# biread — the in-browser builder and the shelf, served as static files.
# Everything here is the bundle from `python web/build.py`; nothing is generated
# at request time and no book text ever rests on this server.
server {
    # OVH's own name for this box. It is still default_server, so the bare IP
    # reaches the same site — the name exists so a certificate can be issued for
    # something, which an IP address cannot be.
    server_name vps-bab9636f.vps.ovh.net;

    root /srv/apps/biread/web;
    index builder.html;
    charset utf-8;

    access_log /var/log/nginx/biread.access.log;
    error_log  /var/log/nginx/biread.error.log;

    # The books are the reason gzip is here: a built reader is one HTML file
    # carrying the whole text, and Candide is 0.6 MB of mostly prose.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    location = / {
        return 302 /builder.html;
    }

    # The sync service: the reading position and the reader's own corrections.
    # It is deliberately the only dynamic thing on this host.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # The wheel and the fonts are named by version or never change; the page,
    # the worker and the shelf are what a deploy replaces, so they revalidate.
    location ~* \.(woff2|whl)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|json|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vps-bab9636f.vps.ovh.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vps-bab9636f.vps.ovh.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Everything arriving unencrypted goes to the name, including requests to the
    # bare IP — that address was handed out before there was a certificate, and a
    # reader holding it should land on the book, not on a 404.
    return 301 https://vps-bab9636f.vps.ovh.net$request_uri;


}
