s mots entrecoupés, des demandes et des réponses qui se croisent, des soupirs, des larmes, des cris. La vieille leur recommande de faire moins de bruit, et les laisse en liberté. « Quoi ! c’est vous, lui dit Candide, vous vivez ! je vous retrouve en Portugal ! On ne vous a donc pas violée ? On ne vous a point fendu le ventre, comme le philosophe Pangloss me l’avait assuré ?", "en": "The old woman soon returned, supporting with great difficulty a young lady, who appeared scarce able to stand. She was of a majestic mien and stature; her dress was rich, and glittering with diamonds, and her face was covered with a veil. “Take off that veil,” said the old woman to Candide. The young man approached, and, with a trembling hand, took off her veil. What a happy moment! What surprise! He thought he beheld Miss Cunegund; he did behold her, it was she herself. His strength failed him, he could not utter a word, he fell at her feet. Cunegund fainted upon the sofa. The old woman bedewed them with spirits; they recovered; they began to speak. At first they could express themselves only in broken accents; their questions and answers were alternately interrupted with sighs, tears, and exclamations. The old woman desired them to make less noise; and left them together. “Good heavens!” cried Candide, “is it you? Is it Miss Cunegund I behold, and alive? Do I find you again in Portugal? Then you have not been ravished? They did not rip open your belly, as the philosopher Pangloss informed me?”"}, {"fr": "Si fait, dit la belle Cunégonde ; mais on ne meurt pas toujours de ces deux accidents.", "en": "“Indeed but they did,” replied Miss Cunegund; “but these two accidents do not always prove mortal.”"}, {"fr": "Mais votre père et votre mère ont-ils été tués ?", "en": "“But were your father and mother killed?”"}, {"fr": "Il n’est que trop vrai, dit Cunégonde en pleurant.", "en": "“Alas!” answered she, “it is but too true!” and she wept."}, {"fr": "Et votre frère ?", "en": "“And my brother also.”"}, {"fr": "Mon frère a été tué aussi.", "en": ""}, {"fr": "Et pourquoi êtes-vous en Portugal ? et comment avez-vous su que j’y étais ? et par quelle étrange aventure m’avez-vous fait conduire dans cette maison ?", "en": "“And how did you come to Portugal? And how did you know of my being here? And by what strange adventure did you contrive to have me brought into this house?”"}, {"fr": "Je vous dirai tout cela, répliqua la dame ; mais il faut auparavant que vous m’appreniez tout ce qui vous est arrivé depuis le baiser innocent que vous me donnâtes, et les coups de pied que vous reçûtes. »", "en": "“I will tell you all,” replied the lady, “but first you must acquaint me with all that has befallen you since the innocent kiss you gave me, and the rude kicking you received.”"}, {"fr": "Candide lui obéit avec un profond respect ; et quoiqu’il fût interdit, quoique sa voix fût faible et tremblante, quoique l’échine lui fît encore un peu mal, il lui raconta de la manière la plus naïve tout ce qu’il avait éprouvé depuis le moment de leur séparation. Cunégonde levait les yeux au ciel : elle donna des larmes à la mort du bon anabaptiste et de Pangloss ; après quoi elle parla en ces termes à Candide, qui ne perdait pas une parole, et qui la dévorait des yeux.", "en": "Candide, with the greatest submission, obeyed her, and though he was still wrapped in amazement, though his voice was low and tremulous, though his back pained him, yet he gave her a most ingenuous account of everything that had befallen him since the moment of their separation. Cunegund, with her eyes uplifted to heaven, shed tears when he related the death of the good Anabaptist James, and of Pangloss; after which, she thus related her adventures to Candide, who lost not one syllable she uttered, and seemed to devour her with his eyes all the time she was speaking."}, {"fr": "« J’étais dans mon lit et je dormais profondément, quand il plut au ciel d’envoyer les Bulgares dans notre beau château de Thunder-ten-tronckh ; ils égorgèrent mon père et mon frère, et coupèrent ma mère par morceaux. Un grand Bulgare, haut de six pieds, voyant qu’à ce spectacle j’avais perdu connaissance, se mit à me violer ; cela me fit revenir, je repris mes sens, je criai, je me débattis, je mordis, j’égratignai, je voulais arracher les yeux à ce grand Bulgare, ne sachant pas que tout ce qui arrivait dans le château de mon père était une chose d’usage : le brutal me donna un coup de couteau dans le flanc gauche dont je porte encore la marque.", "en": "“I was in bed and fast asleep, when it pleased heaven to send the Bulgarians to our delightful castle of Thunder-ten-tronckh, where they murdered my father and brother, and cut my mother in pieces. A tall Bulgarian soldier, six feet high, perceiving that I had fainted away at this sight, attempted to ravish me; the operation brought me to my senses. I cried, I struggled, I bit, I scratched, I would have torn the tall Bulgarian’s eyes out, not knowing that what had happened at my father’s castle was a customary thing. The brutal soldier gave me a cut in the left groin with his hanger, the mark of which I still carry.”"}, {"fr": "Hélas ! j’espère bien la voir, dit le naïf Candide.", "en": "“I hope I shall see it,” said Candide, with all imaginable simplicity."}, {"fr": "Vous la verrez, dit Cunégonde ; mais continuons.", "en": "“You shall,” said Cunegund; “but let me proceed.”"}, {"fr": "Continuez, » dit Candide.", "en": "“Pray do,” replied Candide."}, {"fr": "Elle reprit ainsi le fil de son histoire : « Un capitaine bulgare entra, il me vit toute sanglante, et le soldat ne se dérangeait pas. Le capitaine se mit en colère du peu de respect que lui témoignait ce brutal, et le tua sur mon corps. Ensuite il me fit panser, et m’emmena prisonnière de guerre dans son quartier. Je blanchissais le peu de chemises qu’il avait, je faisais sa cuisine ; il me trouvait fort jolie, il faut l’avouer ; et je ne nierai pas qu’il ne fût très-bien fait, et qu’il n’eût la peau blanche et douce ; d’ailleurs peu d’esprit, peu de philosophie : on voyait bien qu’il n’avait pas été élevé par le docteur Pangloss. Au bout de trois mois, ayant perdu tout son argent, et s’étant dégoûté de moi, il me vendit à un juif nommé don Issachar, qui trafiquait en Hollande et en Portugal, et qui aimait passionnément les femmes. Ce juif s’attacha beaucoup à ma personne, mais il ne pouvait en triompher ; je lui ai mieux résisté qu’au soldat bulgare : une personne d’honneur peut être violée une fois, mais sa vertu s’en affermit. Le juif, pour m’apprivoiser, me mena dans cette maison de campagne que vous voyez. J’avais cru jusque-là qu’il n’y avait rien sur la terre de si beau que le château de Thunder-ten-tronckh ; j’ai été détrompée.", "en": "She continued. “A Bulgarian captain came in and saw me weltering in my blood, and the soldier still as busy as if no one had been present. The officer, enraged at the fellow’s want of respect to him, killed him with one stroke of his sabre as he lay upon me. This captain took care of me, had me cured, and carried me prisoner of war to his quarters. I washed what little linen he was master of, and dressed his victuals: he thought me very pretty, it must be confessed; neither can I deny that he was well made, and had a white soft skin, but he was very stupid, and knew nothing of philosophy: it might plainly be perceived that he had not been educated under Doctor Pangloss. In three months’ time, having gamed away all his money, and being grown tired of me, he sold me to a Jew, named Don Issachar, who traded in Holland and Portugal, and was passionately fond of women. This Jew showed me great kindness in hopes to gain my favours; but he never could prevail on me. A modest woman may be once ravished; but her virtue is greatly strengthened thereby. In order to make sure of me, he brought me to this country house you now see. I had hitherto believed that nothing could equal the beauty of the castle of Thunder-ten-tronckh; but I found I was mistaken."}, {"fr": "« Le grand inquisiteur m’aperçut un jour à la messe ; il me lorgna beaucoup, et me fit dire qu’il avait à me parler pour des affaires secrètes. Je fus conduite à son palais ; je lui appris ma naissance ; il me représenta combien il était au-dessous de mon rang d’appartenir à un israélite. On proposa de sa part à don Issachar de me céder à monseigneur. Don Issachar, qui est le banquier de la cour, et homme de crédit, n’en voulut rien faire. L’inquisiteur le menaça d’un auto-da-fé. Enfin mon juif, intimidé, conclut un marché par lequel la maison et moi leur appartiendraient à tous deux en commun ; que le juif aurait pour lui les lundis, mercredis, et le jour du sabbat, et que l’inquisiteur aurait les autres jours de la semaine. Il y a six mois que cette convention subsiste. Ce n’a pas été sans querelles ; car souvent il a été indécis si la nuit du samedi au dimanche appartenait à l’ancienne loi ou à la nouvelle. Pour moi, j’ai résisté jusqu’à présent à toutes les deux ; et je crois que c’est pour cette raison que j’ai toujours été aimée.", "en": "“The Grand Inquisitor saw me one day at mass, ogled me all the time of service, and, when it was over, sent to let me know he wanted to speak with me about some private business. I was conducted to his palace, where I told him of my parentage: he represented to me how much it was beneath a person of my birth to belong to an Israelite. He caused a proposal to be made to Don Issachar that he should resign me to his lordship. Don Issachar, being the court banker, and a man of credit, was not easily to be prevailed upon. His lordship threatened him with an auto-da-fé; in short, my Jew was frightened into a compromise, and it was agreed between them that the house and myself should belong to both in common; that the Jew should have Monday, Wednesday, and the Sabbath to himself; and the Inquisitor the other days of the week. This agreement has lasted almost six months; but not without several disputes, whether the space from Saturday night to Sunday morning belonged to the old or the new law. For my part, I have hitherto withstood them both, and truly I believe this is the very reason why they both still love me."}, {"fr": "« Enfin, pour détourner le fléau des tremblements de terre, et pour intimider don Issachar, il plut à monseigneur l’inquisiteur de célébrer un auto-da-fé. Il me fit l’honneur de m’y inviter. Je fus très-bien placée ; on servit aux dames des rafraîchissements entre la messe et l’exécution. Je fus, à la vérité, saisie d’horreur en voyant brûler ces deux juifs et cet honnête Biscayen qui avait épousé sa commère ; mais quelle fut ma surprise, mon effroi, mon trouble, quand je vis, dans un san-benito et sous une mitre, une figure qui ressemblait à celle de Pangloss ! Je me frottai les yeux, je regardai attentivement, je le vis pendre ; je tombai en faiblesse. À peine reprenais-je mes sens que je vous vis dépouillé tout nu ; ce fut là le comble de l’horreur, de la consternation, de la douleur, du désespoir. Je vous dirai, avec vérité, que votre peau est encore plus blanche, et d’un incarnat plus parfait que celle de mon capitaine des Bulgares. Cette vue redoubla tous les sentiments qui m’accablaient, qui me dévoraient. Je m’écriai, je voulus dire : « Arrêtez, barbares ! » mais la voix me manqua, et mes cris auraient été inutiles. Quand vous eûtes été bien fessé : « Comment se peut-il faire, disais-je, que l’aimable Candide et le sage Pangloss se trouvent à Lisbonne, l’un pour recevoir cent coups de fouet, et l’autre pour être pendu par l’ordre de monseigneur l’inquisiteur, dont je suis la bien-aimée ? Pangloss m’a donc bien cruellement trompée, quand il me disait que tout va le mieux du monde ! »", "en": "“At length, to turn aside the scourge of earthquakes, and to intimidate Don Issachar, my lord Inquisitor was pleased to celebrate an auto-da-fé. He did me the honour to invite me to the ceremony. I had a very good seat; and refreshments were offered the ladies between mass and the execution. I was dreadfully shocked at the burning of the two Jews, and the honest Biscayan who married his godmother; but how great was my surprise, my consternation, and concern, when I beheld a figure so like Pangloss, dressed in a sanbenito and mitre! I rubbed my eyes, I looked at him attentively. I saw him hanged, and I fainted away: scarce had I recovered my senses, when I beheld you stark naked; this was the height of horror, grief, and despair. I must confess to you for a truth, that your skin is far whiter and more blooming than that of the Bulgarian captain. This spectacle worked me up to a pitch of distraction. I screamed out, and would have said, ‘Hold, barbarians!’ but my voice failed me; and indeed my cries would have been useless. After you had been severely whipped I said to myself, ‘How is it possible that the lovely Candide and the sage Pangloss should be at Lisbon, the one to receive a hundred lashes, and the other to be hanged by order of my lord Inquisitor, of whom I am so great a favourite? Pangloss deceived me most cruelly, in saying that everything is fittest and best.’"}, {"fr": "« Agitée, éperdue, tantôt hors de moi-même, et tantôt prête de mourir de faiblesse, j’avais la tête remplie du massacre de mon père, de ma mère, de mon frère, de l’insolence de mon vilain soldat bulgare, du coup de couteau qu’il me donna, de ma servitude, de mon métier de cuisinière, de mon capitaine bulgare, de mon vilain don Issachar, de mon abominable inquisiteur, de la pendaison du docteur Pangloss, de ce grand miserere en faux-bourdon pendant lequel on vous fessait, et surtout du baiser que je vous avais donné derrière un paravent, le jour que je vous avais vu pour la dernière fois. Je louai Dieu, qui vous ramenait à moi par tant d’épreuves. Je recommandai à ma vieille d’avoir soin de vous, et de vous amener ici dès qu’elle le pourrait. Elle a très-bien exécuté ma commission ; j’ai goûté le plaisir inexprimable de vous revoir, de vous entendre, de vous parler. Vous devez avoir une faim dévorante ; j’ai grand appétit ; commençons par souper. »", "en": "“Thus agitated and perplexed, now distracted and lost, now half dead with grief, I revolved in my mind the murder of my father, mother, and brother; the insolence of the rascally Bulgarian soldier; the wound he gave me in the groin; my servitude; my being a cook-wench to my Bulgarian captain; my subjection to the villainous Don Issachar, and my cruel Inquisitor; the hanging of Doctor Pangloss; the Miserere sung while you were whipped; and particularly the kiss I gave you behind the screen the last day I ever beheld you. I returned thanks to God for having brought you to the place where I was, after so many trials. I charged the old woman who attends me to bring you hither, as soon as possible. She has carried out my orders well, and I now enjoy the inexpressible satisfaction of seeing you, hearing you, and speaking to you. But you must certainly be half dead with hunger; I myself have got a good appetite, and so let us sit down to supper.”"}, {"fr": "Les voilà qui se mettent tous deux à table ; et, après le souper, ils se replacent sur ce beau canapé dont on a déjà parlé ; ils y étaient quand le signor don Issachar, l’un des maîtres de la maison, arriva. C’était le jour du sabbat. Il venait jouir de ses droits, et expliquer son tendre amour.", "en": "Upon this the two lovers immediately placed themselves at table, and, after having supped, they returned to seat themselves again on the magnificent sofa already mentioned; they were there when Signor Don Issachar, one of the masters of the house, entered unexpectedly; it was the Sabbath day, and he came to enjoy his privilege, and sigh forth his tender passion."}, {"fr": "Cet Issachar était le plus colérique Hébreu qu’on eût vu dans Israël, depuis la captivité en Babylone. « Quoi ! dit-il, chienne de galiléenne, ce n’est pas assez de monsieur l’inquisiteur ? Il faut que ce coquin partage aussi avec moi ? » En disant cela il tire un long poignard dont il était toujours pourvu, et, ne croyant pas que son adverse partie eût des armes, il se jette sur Candide ; mais notre bon Vestphalien avait reçu une belle épée de la vieille avec l’habit complet. Il tire son épée, quoiqu’il eût les mœurs fort douces, et vous étend l’israélite roide mort sur le carreau, aux pieds de la belle Cunégonde.", "en": "This same Issachar was the most choleric little Hebrew that had ever been in Israel since the captivity in Babylon. “What,” said he, “you Galilean bitch, my lord Inquisitor was not enough for thee, but this rascal must come in for a share with me?” Uttering these words, he drew out a long poniard which he always carried about him, and never dreaming that his adversary had any arms, he attacked him most furiously; but our honest Westphalian had received a handsome sword from the old woman with the suit of clothes. Candide drew his rapier; and though he was the most gentle, sweet-tempered young man breathing, he whipped it into the Israelite and laid him sprawling on the floor at the fair Cunegund’s feet."}, {"fr": "« Sainte Vierge ! s’écria-t-elle, qu’allons-nous devenir ? Un homme tué chez moi ! si la justice vient, nous sommes perdus.", "en": "“Holy Virgin!” cried she, “what will become of us? A man killed in my apartment! If the peace-officers come, we are undone.”"}, {"fr": "Si Pangloss n’avait pas été pendu, dit Candide, il nous donnerait un bon conseil dans cette extrémité, car c’était un grand philosophe. À son défaut, consultons la vieille. » Elle était fort prudente, et commençait à dire son avis quand une autre petite porte s’ouvrit. Il était une heure après minuit, c’était le commencement du dimanche. Ce jour appartenait à monseigneur l’inquisiteur. Il entre et voit le fessé Candide, l’épée à la main, un mort étendu par terre, Cunégonde effarée, et la vieille donnant des conseils.", "en": "“Had not Pangloss been hanged,” replied Candide, “he would have given us most excellent advice in this emergency, for he was a profound philosopher. But, since he is not here, let us consult the old woman.” She was very intelligent, and was beginning to give her advice when another door opened suddenly. It was now one o’clock in the morning, and of course the beginning of Sunday, which, by agreement, fell to the lot of my lord Inquisitor. Entering, he discovered the flagellated Candide with his drawn sword in his hand, a dead body stretched on the floor, Cunegund frightened out of her wits, and the old woman giving advice."}, {"fr": "Voici dans ce moment ce qui se passa dans l’âme de Candide, et comment il raisonna : « Si ce saint homme appelle du secours, il me fera infailliblement brûler, il pourra en faire autant de Cunégonde ; il m’a fait fouetter impitoyablement ; il est mon rival ; je suis en train de tuer ; il n’y a pas à balancer. » Ce raisonnement fut net et rapide ; et, sans donner le temps à l’inquisiteur de revenir de sa surprise, il le perce d’outre en outre, et le jette à côté du juif. « En voici bien d’une autre, dit Cunégonde ; il n’y a plus de rémission ; nous sommes excommuniés, notre dernière heure est venue ! Comment avez-vous fait, vous qui êtes né si doux, pour tuer en deux minutes un juif et un prélat ?", "en": "At that very moment a sudden thought came into Candide’s head. “If this holy man,” thought he, “should call assistance, I shall most undoubtedly be consigned to the flames, and Miss Cunegund may perhaps meet with no better treatment; besides, he was the cause of my being so cruelly whipped; he is my rival; and I have now begun to dip my hands in blood; there is no time to hesitate.” This whole train of reasoning was clear and instantaneous; so that, without giving time to the Inquisitor to recover from his surprise, he ran him through the body, and laid him by the side of the Jew. “Good God!” cried Cunegund, “here’s another fine piece of work! now there can be no mercy for us, we are excommunicated; our last hour is come. But how in the name of wonder could you, who are of so mild a temper, dispatch a Jew and a prelate in two minutes’ time?”"}, {"fr": "Ma belle demoiselle, répondit Candide, quand on est amoureux, jaloux, et fouetté par l’Inquisition, on ne se connaît plus. »", "en": "“Beautiful lady,” answered Candide, “when a man is in love, is jealous, and has been flogged by the Inquisition, he becomes lost to all reflection.”"}, {"fr": "La vieille prit alors la parole, et dit : « Il y a trois chevaux andalous dans l’écurie, avec leurs selles et leurs brides : que le brave Candide les prépare ; madame a des moyadors et des diamants, montons vite à cheval, quoique je ne puisse me tenir que sur une fesse, et allons à Cadix ; il fait le plus beau temps du monde, et c’est un grand plaisir de voyager pendant la fraîcheur de la nuit. »", "en": "The old woman then put in her word. “There are three Andalusian horses in the stable,” said she, “with as many bridles and saddles; let the brave Candide get them ready; madam has moidores and jewels; let us mount immediately, though I have only one buttock to sit upon; let us set out for Cadiz; it is the finest weather in the world, and there is great pleasure in travelling in the cool of the night.”"}, {"fr": "Aussitôt Candide selle les trois chevaux ; Cunégonde, la vieille, et lui, font trente milles d’une traite. Pendant qu’ils s’éloignaient, la sainte Hermandad arrive dans la maison, on enterre monseigneur dans une belle église, on jette Issachar à la voirie.", "en": "Candide, without any further hesitation, saddled the three horses; and Miss Cunegund, the old woman, and he set out, and travelled thirty miles without once stopping. While they were making the best of their way, the Holy Brotherhood entered the house. My Lord the Inquisitor was interred in a magnificent manner, and Issachar’s body was thrown upon a dunghill."}, {"fr": "Candide, Cunégonde, et la vieille, étaient déjà dans la petite ville d’Avacéna, au milieu des montagnes de la Sierra-Morena ; et ils parlaient ainsi dans un cabaret.", "en": "Candide, Cunegund, and the old woman had, by this time, reached the little town of Aracena, in the midst of the mountains of Sierra Morena, and were engaged in the following conversation in an inn."}, {"fr": "« Qui a donc pu me voler mes pistoles et mes diamants ? disait en pleurant Cunégonde ; de quoi vivrons-nous ? comment ferons-nous ? où trouver des inquisiteurs et des juifs qui m’en donnent d’autres ?", "en": "“Who could it be who has robbed me of my moidores and jewels?” exclaimed Miss Cunegund, all bathed in tears. “How shall we live? What shall we do? Where shall I find Inquisitors and Jews who can give me more?”"}, {"fr": "Hélas ! dit la vieille, je soupçonne fort un révérend père cordelier qui coucha hier dans la même auberge que nous à Badajos ; Dieu me garde de faire un jugement téméraire ! mais il entra deux fois dans notre chambre, et il partit longtemps avant nous.", "en": "“Alas!” said the old woman, “I have a shrewd suspicion of a reverend father cordelier, who lay last night in the same inn with us at Badajoz: God forbid I should condemn any one wrongfully, but he came into our room twice, and he set off in the morning long before us.”"}, {"fr": "Hélas ! dit Candide, le bon Pangloss m’avait souvent prouvé que les biens de la terre sont communs à tous les hommes, que chacun y a un droit égal. Ce cordelier devait bien, suivant ces principes, nous laisser de quoi achever notre voyage. Il ne vous reste donc rien du tout, ma belle Cunégonde ?", "en": "“Alas!” said Candide, “Pangloss has often demonstrated to me that the goods of this world are common to all men, and that every one has an equal right to the enjoyment of them; but, according to these principles, the cordelier ought to have left us enough to carry us to the end of our journey. Have you nothing at all left, my beautiful Cunegund?”"}, {"fr": "Pas un maravédis, dit-elle.", "en": "“Not a sou,” replied she."}, {"fr": "Quel parti prendre ? dit Candide.", "en": "“What is to be done then?” said Candide."}, {"fr": "Vendons un des chevaux, dit la vieille ; je monterai en croupe derrière mademoiselle, quoique je ne puisse me tenir que sur une fesse, et nous arriverons à Cadix ».", "en": "“Sell one of the horses,” replied the old woman, “I will get behind my young lady though I have only one buttock to ride on, and we shall reach Cadiz, never fear.”"}, {"fr": "Il y avait dans la même hôtellerie un prieur de bénédictins ; il acheta le cheval bon marché. Candide, Cunégonde, et la vieille, passèrent par Lucena, par Chillas, par Lebrixa, et arrivèrent enfin à Cadix. On y équipait une flotte, et on y assemblait des troupes pour mettre à la raison les révérends pères jésuites du Paraguai, qu’on accusait d’avoir fait révolter une de leurs hordes contre les rois d’Espagne et de Portugal, auprès de la ville du Saint-Sacrement. Candide, ayant servi chez les Bulgares, fit l’exercice bulgarien devant le général de la petite armée avec tant de grâce, de célérité, d’adresse, de fierté, d’agilité, qu’on lui donna une compagnie d’infanterie à commander. Le voilà capitaine ; il s’embarque avec Mlle Cunégonde, la vieille, deux valets, et les deux chevaux andalous qui avaient appartenu à M. le grand inquisiteur de Portugal.", "en": "In the same inn there was a Benedictine prior who bought the horse very cheap. Candide, Cunegund, and the old woman, after passing through Lucena, Chellas, and Lebrija, arrived at length at Cadiz. A fleet was then getting ready, and troops were assembling in order to reduce the reverend fathers, the Jesuits of Paraguay, who were accused of having excited one of the Indian tribes, in the neighbourhood of the town of the Holy Sacrament, to revolt against the Kings of Spain and Portugal. Candide, having been in the Bulgarian service, performed the military exercise of that nation before the general of this little army with so intrepid an air, and with such agility and expedition that he gave him the command of a company of foot. Being now made a captain, he embarked with Miss Cunegund, the old woman, two valets, and the two Andalusian horses which had belonged to the Grand Inquisitor of Portugal."}, {"fr": "Pendant toute la traversée ils raisonnèrent beaucoup sur la philosophie du pauvre Pangloss. « Nous allons dans un autre univers, disait Candide ; c’est dans celui-là, sans doute, que tout est bien : car il faut avouer qu’on pourrait gémir un peu de ce qui se passe dans le nôtre en physique et en morale.", "en": "During their voyage they amused themselves with many profound reasonings on poor Pangloss’s philosophy. “We are now going into another world,” said Candide, “and surely it must be there that everything is best; for I must confess that we have had some little reason to complain of what passes in ours, both as to the physical and moral part.”"}, {"fr": "Je vous aime de tout mon cœur, disait Cunégonde ; mais j’ai encore l’âme tout effarouchée de ce que j’ai vu, de ce que j’ai éprouvé.", "en": "“Though I have a sincere love for you,” said Miss Cunegund, “yet I still shudder at the reflection of what I have seen and experienced.”"}, {"fr": "Tout ira bien, répliquait Candide ; la mer de ce nouveau monde vaut déjà mieux que les mers de notre Europe ; elle est plus calme, les vents plus constants. C’est certainement le nouveau monde qui est le meilleur des univers possibles.", "en": "“All will be well,” replied Candide, “the sea of this new world is already better than our European seas: it is smoother, and the winds blow more regularly.”"}, {"fr": "Dieu le veuille ! disait Cunégonde ; mais j’ai été si horriblement malheureuse dans le mien que mon cœur est presque fermé à l’espérance.", "en": "“God grant it,” said Cunegund; “but I have met with such terrible treatment in this that I have almost lost all hopes of a better.”"}, {"fr": "Vous vous plaignez, leur dit la vieille ; hélas ! vous n’avez pas éprouvé des infortunes telles que les miennes. » Cunégonde se mit presque à rire, et trouva cette bonne femme fort plaisante de prétendre être plus malheureuse qu’elle. « Hélas ! lui dit-elle, ma bonne, à moins que vous n’ayez été violée par deux Bulgares, que vous n’ayez reçu deux coups de couteau dans le ventre, qu’on n’ait démoli deux de vos châteaux, qu’on n’ait égorgé à vos yeux deux mères et deux pères, et que vous n’ayez vu deux de vos amants fouettés dans un auto-da-fé, je ne vois pas que vous puissiez l’emporter sur moi ; ajoutez que je suis née baronne avec soixante et douze quartiers, et que j’ai été cuisinière.", "en": "“What murmuring and complaining is here indeed!” cried the old woman. “If you had suffered half what I have done, there might be some reason for it.” Miss Cunegund could scarcely refrain from laughing at the good old woman, and thought it droll enough to pretend to a greater share of misfortunes than herself. “Alas! my good dame,” said she, “unless you have been ravished by two Bulgarians, have received two deep wounds in your belly, have seen two of your own castles demolished, and beheld two fathers and two mothers barbarously murdered before your eyes, and, to sum up all, have had two lovers whipped at an auto-da-fé, I cannot see how you could be more unfortunate than me. Add to this, though born a baroness and bearing seventy-two quarterings, I have been reduced to a cook-wench.”"}, {"fr": "Mademoiselle, répondit la vieille, vous ne savez pas quelle est ma naissance ; et si je vous montrais mon derrière, vous ne parleriez pas comme vous faites, et vous suspendriez votre jugement. » Ce discours fit naître une extrême curiosité dans l’esprit de Cunégonde et de Candide. La vieille leur parla en ces termes.", "en": "“Miss,” replied the old woman, “you do not know my family as yet; but if I were to show you my backside, you would not talk in this manner, but suspend your judgment.” This speech raised a high curiosity in Candide and Cunegund; and the old woman continued as follows."}, {"fr": "« Je n’ai pas eu toujours les yeux éraillés et bordés d’écarlate ; mon nez n’a pas toujours touché à mon menton, et je n’ai pas toujours été servante. Je suis la fille du pape Urbain X et de la princesse de Palestrine. On m’éleva jusqu’à quatorze ans dans un palais auquel tous les châteaux de vos barons allemands n’auraient pas servi d’écurie ; et une de mes robes valait mieux que toutes les magnificences de la Vestphalie. Je croissais en beauté, en grâces, en talents, au milieu des plaisirs, des respects, et des espérances : j’inspirais déjà de l’amour ; ma gorge se formait ; et quelle gorge ! blanche, ferme, taillée comme celle de la Vénus de Médicis ; et quels yeux ! quelles paupières ! quels sourcils noirs ! quelles flammes brillaient dans mes deux prunelles, et effaçaient la scintillation des étoiles ! comme me disaient les poëtes du quartier. Les femmes qui m’habillaient et qui me déshabillaient tombaient en extase en me regardant par devant et par derrière ; et tous les hommes auraient voulu être à leur place.", "en": "“I have not always been blear-eyed. My nose did not always touch my chin, nor was I always a servant. You must know that I am the daughter of Pope Urban X, and of the Princess of Palestrina. Up to the age of fourteen I was brought up in a castle, compared with which all the castles of the German barons would not have been fit for stabling, and one of my robes would have bought half the province of Westphalia. I grew in beauty, in wit, and in every graceful accomplishment, in the midst of pleasures, homage, and the highest expectations. I already began to inspire the men with love: my breast began to take its right form; and such a breast! white, firm, and formed like that of Venus of Medici: my eyebrows were as black as jet; and as for my eyes, they darted flames, and eclipsed the lustre of the stars, as I was told by the poets of our part of the world. My maids, when they dressed and undressed me, used to fall into an ecstasy in viewing me before and behind: and all the men longed to be in their places."}, {"fr": "« Je fus fiancée à un prince souverain de Massa-Carrara : quel prince ! aussi beau que moi, pétri de douceur et d’agréments, brillant d’esprit et brûlant d’amour ; je l’aimais comme on aime pour la première fois, avec idolâtrie, avec emportement. Les noces furent préparées : c’était une pompe, une magnificence inouïe ; c’étaient des fêtes, des carrousels, des opéra-buffa continuels ; et toute l’Italie fit pour moi des sonnets dont il n’y eut pas un seul de passable. Je touchais au moment de mon bonheur, quand une vieille marquise qui avait été maîtresse de mon prince l’invita à prendre du chocolat chez elle : il mourut en moins de deux heures avec des convulsions épouvantables ; mais ce n’est qu’une bagatelle. Ma mère, au désespoir, et bien moins affligée que moi, voulut s’arracher pour quelque temps à un séjour si funeste. Elle avait une très-belle terre auprès de Gaïète : nous nous embarquâmes sur une galère du pays, dorée comme l’autel de Saint-Pierre de Rome. Voilà qu’un corsaire de Salé fond sur nous et nous aborde ; nos soldats se défendirent comme des soldats du pape : ils se mirent tous à genoux en jetant leurs armes, et en demandant au corsaire une absolution in articulo mortis.", "en": "“I was contracted to a sovereign prince of Massa-Carrara. Such a prince! as handsome as myself, sweet-tempered, agreeable, of brilliant wit, and in love with me over head and ears. I loved him too, as our sex generally do for the first time, with transport and idolatry. The nuptials were prepared with surprising pomp and magnificence; the ceremony was attended with a succession of feasts, carousals, and burlesques: all Italy composed sonnets in my praise, though not one of them was tolerable. I was on the point of reaching the summit of bliss, when an old marchioness who had been mistress to the Prince my husband invited him to drink chocolate. In less than two hours after he returned from the visit he died of most terrible convulsions: but this is a mere trifle. My mother, in despair, and yet less afflicted than me, determined to absent herself for some time from so fatal a place. As she had a very fine estate in the neighbourhood of Gaeta, we embarked on board a galley which was gilded like the high altar of St. Peter’s at Rome. In our passage we were boarded by a Sallee corsair. Our men defended themselves like true Pope’s soldiers; they flung themselves upon their knees, laid down their arms and begged the corsair to give them absolution in articulo mortis."}, {"fr": "« Aussitôt on les dépouilla nus comme des singes, et ma mère aussi, nos filles d’honneur aussi, et moi aussi. C’est une chose admirable que la diligence avec laquelle ces messieurs déshabillent le monde ; mais ce qui me surprit davantage, c’est qu’ils nous mirent à tous le doigt dans un endroit où nous autres femmes nous ne nous laissons mettre d’ordinaire que des canules. Cette cérémonie me paraissait bien étrange : voilà comme on juge de tout quand on n’est pas sorti de son pays. J’appris bientôt que c’était pour voir si nous n’avions pas caché là quelques diamants : c’est un usage établi de temps immémorial parmi les nations policées qui courent sur mer. J’ai su que messieurs les religieux chevaliers de Malte n’y manquent jamais quand ils prennent des Turcs et des Turques ; c’est une loi du droit des gens à laquelle on n’a jamais dérogé.", "en": "“The Moors presently stripped us as bare as monkeys. My mother, my maids of honour, and myself, were served all in the same manner. It is amazing how quick these gentry are at undressing people. But what surprised me most was that they thrust their fingers into that part of our bodies where we women seldom permit anything but enemas to enter. I thought it a very strange kind of ceremony; for thus we are generally apt to judge of things when we have not seen the world. I afterwards learnt that it was to discover if we had any diamonds concealed. This practice has been established since time immemorial among those civilized nations that scour the seas. I was informed that the religious Knights of Malta never fail to make this search, whenever any Moors of either sex fall into their hands. It is a part of the law of nations from which they never deviate."}, {"fr": "« Je ne vous dirai point combien il est dur pour une jeune princesse d’être menée esclave à Maroc avec sa mère : vous concevez assez tout ce que nous eûmes à souffrir dans le vaisseau corsaire. Ma mère était encore très-belle : nos filles d’honneur, nos simples femmes de chambre avaient plus de charmes qu’on n’en peut trouver dans toute l’Afrique ; pour moi, j’étais ravissante, j’étais la beauté, la grâce même, et j’étais pucelle ; je ne le fus pas longtemps : cette fleur, qui avait été réservée pour le beau prince de Massa-Carrara, me fut ravie par le capitaine corsaire ; c’était un nègre abominable, qui croyait encore me faire beaucoup d’honneur. Certes il fallait que Mme la princesse de Palestrine et moi fussions bien fortes pour résister à tout ce que nous éprouvâmes jusqu’à notre arrivée à Maroc ! Mais, passons ; ce sont des choses si communes qu’elles ne valent pas la peine qu’on en parle.", "en": "“I need not tell you how great a hardship it was for a young princess and her mother to be made slaves and carried to Morocco. You may easily imagine what we must have suffered on board a corsair. My mother was still extremely handsome, our maids of honour, and even our common waiting-women, had more charms than were to be found in all Africa. As to myself, I was enchanting; I was beauty itself, and then I had my virginity. But, alas! I did not retain it long; this precious flower, which was reserved for the lovely Prince of Massa-Carrara, was cropped by the captain of the Moorish vessel, who was a hideous negro, and thought he did me infinite honour. Indeed, both the Princess of Palestrina and myself must have had very strong constitutions to undergo all the hardships and violences we suffered till our arrival at Morocco. But I will not detain you any longer with such common things; they are hardly worth mentioning."}, {"fr": "« Maroc nageait dans le sang quand nous arrivâmes. Cinquante fils de l’empereur Mulei-Ismael avaient chacun leur parti : ce qui produisait en effet cinquante guerres civiles, de noirs contre noirs, de noirs contre basanés, de basanés contre basanés, de mulâtres contre mulâtres : c’était un carnage continuel dans toute l’étendue de l’empire.", "en": "“Upon our arrival at Morocco, we found that kingdom bathed in blood. Fifty sons of the Emperor Muley Ishmael were each at the head of a party. This produced fifty civil wars of blacks against blacks, of blacks against tawnies, of tawnies against tawnies, and of mulattoes against mulattoes. In short, the whole empire was one continual scene of carnage."}, {"fr": "« À peine fûmes-nous débarquées que des noirs d’une faction ennemie de celle de mon corsaire se présentèrent pour lui enlever son butin. Nous étions, après les diamants et l’or, ce qu’il avait de plus précieux. Je fus témoin d’un combat tel que vous n’en voyez jamais dans vos climats d’Europe. Les peuples septentrionaux n’ont pas le sang assez ardent ; ils n’ont pas la rage des femmes au point où elle est commune en Afrique. Il semble que vos Européans aient du lait dans les veines ; c’est du vitriol, c’est du feu qui coule dans celles des habitants du mont Atlas et des pays voisins. On combattit avec la fureur des lions, des tigres, et des serpents de la contrée, pour savoir qui nous aurait. Un Maure saisit ma mère par le bras droit, le lieutenant de mon capitaine la retint par le bras gauche ; un soldat maure la prit par une jambe, un de nos pirates la tenait par l’autre. Nos filles se trouvèrent presque toutes en un moment tirées ainsi à quatre soldats. Mon capitaine me tenait cachée derrière lui ; il avait le cimeterre au poing, et tuait tout ce qui s’opposait à sa rage. Enfin je vis toutes nos Italiennes et ma mère déchirées, coupées, massacrées par les monstres qui se les disputaient. Les captifs, mes compagnons, ceux qui les avaient pris, soldats, matelots, noirs, basanés, blancs, mulâtres, et enfin mon capitaine, tout fut tué, et je demeurai mourante sur un tas de morts. Des scènes pareilles se passaient, comme on sait, dans l’étendue de plus de trois cents lieues, sans qu’on manquât aux cinq prières par jour ordonnées par Mahomet.", "en": "“No sooner were we landed than a party of blacks, of a contrary faction to that of my captain, came to rob him of his booty. Next to the money and jewels, we were the most valuable things he had. I was witness on this occasion to such a battle as you never beheld in your cold European climates. The northern nations have not that fermentation in their blood, nor that raging lust for women that is so common in Africa. The natives of Europe seem to have their veins filled with milk only; but fire and vitriol circulate in those of the inhabitants of Mount Atlas and the neighbouring provinces. They fought with the fury of the lions, tigers, and serpents of their country, to know who should have us. A Moor seized my mother by the right arm, while my captain’s lieutenant held her by the left; another Moor laid hold of her by one leg, and one of our corsairs held her by the other. In this manner were almost every one of our women dragged between soldiers. My captain kept me concealed behind him, and with his drawn scimitar cut down every one who opposed him; at length I saw all our Italian women and my mother mangled and torn in pieces by the monsters who contended for them. The captives, my companions, the Moors who had taken them, the soldiers, the sailors, the blacks, the tawnies, the whites, the mulattoes, and lastly my captain himself, were all slain, and I remained alone expiring upon a heap of dead bodies. The like barbarous scenes were enacted every day over the whole country, which is an extent of three hundred leagues, and yet they never missed the five stated times of prayer enjoined by their prophet Mahomet."}, {"fr": "« Je me débarrassai avec beaucoup de peine de la foule de tant de cadavres sanglants entassés, et je me traînai sous un grand oranger au bord d’un ruisseau voisin ; j’y tombai d’effroi, de lassitude, d’horreur, de désespoir et de faim. Bientôt après, mes sens accablés se livrèrent à un sommeil qui tenait plus de l’évanouissement que du repos. J’étais dans cet état de faiblesse et d’insensibilité, entre la mort et la vie, quand je me sentis pressée de quelque chose qui s’agitait sur mon corps ; j’ouvris les yeux, je vis un homme blanc et de bonne mine qui soupirait, et qui disait entre ses dents : O che sciagura d’essere senza coglioni !", "en": "“I disentangled myself with great difficulty from such a heap of slaughtered bodies, and made shift to crawl to a large orange tree that stood on the bank of a neighbouring rivulet, where I fell down exhausted with terror, and overwhelmed with horror, despair, and hunger. My senses being overpowered, I fell asleep, or rather seemed to be in a trance. Thus I lay in a state of weakness and insensibility between life and death, when I felt myself pressed by something that moved up and down upon my body. This brought me to myself; I opened my eyes, and saw a pretty fair-faced man, who sighed and muttered these words between his teeth, ‘O che sciagura d’essere senza coglioni!’ ”"}, {"fr": "« Étonnée et ravie d’entendre la langue de ma patrie, et non moins surprise des paroles que proférait cet homme, je lui répondis qu’il y avait de plus grands malheurs que celui dont il se plaignait ; je l’instruisis en peu de mots des horreurs que j’avais essuyées, et je retombai en faiblesse. Il m’emporta dans une maison voisine, me fit mettre au lit, me fit donner à manger, me servit, me consola, me flatta, me dit qu’il n’avait rien vu de si beau que moi, et que jamais il n’avait tant regretté ce que personne ne pouvait lui rendre. « Je suis né à Naples, me dit-il ; on y chaponne deux ou trois mille enfants tous les ans ; les uns en meurent, les autres acquièrent une voix plus belle que celle des femmes, les autres vont gouverner des États. On me fit cette opération avec un très-grand succès, et j’ai été musicien de la chapelle de Mme la princesse de Palestrine.", "en": "“Astonished and delighted to hear my native language, and no less surprised at the young man’s words, I told him that there were far greater misfortunes in the world than what he complained of. And to convince him of it, I gave him a short history of the horrible disasters that had befallen me; and again fell into a swoon. He carried me in his arms to a neighbouring cottage, where he had me put to bed, procured me something to eat, waited on me, comforted me, caressed me, told me that he had never seen anything so perfectly beautiful as myself, and that he had never so much regretted the loss of what no one could restore to him. “ ‘I was born at Naples,’ said he, ‘where they caponize two or three thousand children every year: several die of the operation; some acquire voices far beyond the most tuneful of your ladies; and others are sent to govern states and empires. I underwent this operation very happily, and was one of the singers in the Princess of Palestrina’s chapel.’"}, {"fr": "De ma mère ! m’écriai-je.", "en": "“ ‘How,’ cried I, ‘in my mother’s chapel!’"}, {"fr": "De votre mère ! s’écria-t-il en pleurant ; quoi ! vous seriez cette jeune princesse que j’ai élevée jusqu’à l’âge de six ans, et qui promettait déjà d’être aussi belle que vous êtes ?", "en": "“ ‘The Princess of Palestrina, your mother!’ cried he, bursting into a flood of tears, ‘is it possible you should be the beautiful young princess whom I had the care of bringing up till she was six years old, and who, at that tender age, promised to be as fair as I now behold you?’"}, {"fr": "C’est moi-même ; ma mère est à quatre cents pas d’ici, coupée en quartiers sous un tas de morts… »", "en": "“ ‘I am the same,’ I replied. ‘My mother lies about a hundred yards from here, cut in pieces, and buried under a heap of dead bodies.’"}, {"fr": "« Je lui contai tout ce qui m’était arrivé ; il me conta aussi ses aventures, et m’apprit comment il avait été envoyé chez le roi de Maroc par une puissance chrétienne, pour conclure avec ce monarque un traité par lequel on lui fournirait de la poudre, des canons, et des vaisseaux, pour l’aider à exterminer le commerce des autres chrétiens. « Ma mission est faite, dit cet honnête eunuque ; je vais m’embarquer à Ceuta, et je vous ramènerai en Italie. Ma che sciagura d’essere senza coglioni ! »", "en": "“I then related to him all that had befallen me, and he in return acquainted me with all his adventures, and how he had been sent to the court of the King of Morocco by a Christian prince to conclude a treaty with that monarch; in consequence of which he was to be furnished with military stores, and ships to enable him to destroy the commerce of other Christian governments. “ ‘I have executed my commission,’ said the eunuch; ‘I am going to take shipping at Ceuta, and I’ll take you along with me to Italy. Ma che sciagura d’essere senza coglioni!’"}, {"fr": "« Je le remerciai avec des larmes d’attendrissement ; et au lieu de me mener en Italie, il me conduisit à Alger, et me vendit au dey de cette province. À peine fus-je vendue que cette peste qui a fait le tour de l’Afrique, de l’Asie, de l’Europe, se déclara dans Alger avec fureur. Vous avez vu des tremblements de terre ; mais, mademoiselle, avez-vous jamais eu la peste ?", "en": "“I thanked him with tears of joy; but, instead of taking me with him into Italy, he carried me to Algiers, and sold me to the dey of that province. I had not been long a slave when the plague, which had made the tour of Africa, Asia, and Europe, broke out at Algiers with redoubled fury. You have seen an earthquake; but tell me, miss, had you ever the plague?”"}, {"fr": "— Jamais, répondit la baronne.", "en": "“Never,” answered the young Baroness."}, {"fr": "— Si vous l’aviez eue, reprit la vieille, vous avoueriez qu’elle est bien au-dessus d’un tremblement de terre. Elle est fort commune en Afrique ; j’en fus attaquée. Figurez-vous quelle situation pour la fille d’un pape, âgée de quinze ans, qui en trois mois de temps avait éprouvé la pauvreté, l’esclavage, avait été violée presque tous les jours, avait vu couper sa mère en quatre, avait essuyé la faim et la guerre, et mourait pestiférée dans Alger ! Je n’en mourus pourtant pas ; mais mon eunuque et le dey, et presque tout le sérail d’Alger périrent.", "en": "“If you ever had,” continued the old woman, “you would own an earthquake was a trifle to it. It is very common in Africa; I was seized with it. Figure to yourself the situation of the daughter of a pope, only fifteen years old, and who in less than three months had felt the miseries of poverty and slavery; had been ravished almost every day; had beheld her mother cut into four quarters; had experienced the scourges of famine and war, and was now dying of the plague at Algiers. I did not, however, die of it; but my eunuch, and the dey, and almost the whole seraglio of Algiers, were swept off."}, {"fr": "« Quand les premiers ravages de cette épouvantable peste furent passés, on vendit les esclaves du dey. Un marchand m’acheta, et me mena à Tunis ; il me vendit à un autre marchand qui me revendit à Tripoli ; de Tripoli je fus revendue à Alexandrie, d’Alexandrie revendue à Smyrne ; de Smyrne à Constantinople. J’appartins enfin à un aga des janissaires, qui fut bientôt commandé pour aller défendre Azof contre les Russes qui l’assiégeaient.", "en": "“As soon as the first fury of this dreadful pestilence was over, a sale was made of the dey’s slaves. I was purchased by a merchant, who carried me to Tunis. This man sold me to another merchant, who sold me again to another at Tripoli; from Tripoli I was sold to Alexandria, from Alexandria to Smyrna, and from Smyrna to Constantinople. After many changes, I at length became the property of an aga of the janissaries, who, soon after I came into his possession, was ordered away to the defence of Azov, then besieged by the Russians."}, {"fr": "« L’aga, qui était un très-galant homme, mena avec lui tout son sérail, et nous logea dans un petit fort sur les Palus-Méotides, gardé par deux eunuques noirs et vingt soldats. On tua prodigieusement de Russes, mais ils nous le rendirent bien : Azof fut mis à feu et à sang, et on ne pardonna ni au sexe, ni à l’âge ; il ne resta que notre petit fort : les ennemis voulurent nous prendre par famine. Les vingt janissaires avaient juré de ne se jamais rendre. Les extrémités de la faim où ils furent réduits les contraignirent à manger nos deux eunuques, de peur de violer leur serment. Au bout de quelques jours ils résolurent de manger les femmes.", "en": "“The aga being fond of women, took his whole seraglio with him, and lodged us in a small fort on Lake Maeotis, with two black eunuchs and twenty soldiers for our guard. Our army made a great slaughter among the Russians, but they soon returned us the compliment. Azov was taken by storm, and the enemy spared neither age nor sex, but put all to the sword, and laid the city in ashes. Our little fort alone held out; they resolved to reduce us by famine. The twenty janissaries had bound themselves by an oath never to surrender the place. Being reduced to the extremity of famine, they found themselves obliged to eat two eunuchs rather than violate their oath. After a few days they determined to devour the women."}, {"fr": "« Nous avions un iman très-pieux et très-compatissant, qui leur fit un beau sermon par lequel il leur persuada de ne nous pas tuer tout à fait. « Coupez, dit-il, seulement une fesse à chacune de ces dames, vous ferez très-bonne chère ; s’il faut y revenir, vous en aurez encore autant dans quelques jours ; le Ciel vous saura gré d’une action si charitable, et vous serez secourus. »", "en": "“We had a very pious and humane imam, who made them a most excellent sermon on this occasion, exhorting them not to kill us all at once. “ ‘Only cut off one of the buttocks of each of those ladies,’ said he, ‘and you will fare extremely well; if ye are still under the necessity of having recourse to the same expedient again, ye will find the like supply a few days hence. Heaven will approve of so charitable an action, and work your deliverance.’"}, {"fr": "« Il avait beaucoup d’éloquence ; il les persuada : on nous fit cette horrible opération ; l’iman nous appliqua le même baume qu’on met aux enfants qu’on vient de circoncire : nous étions toutes à la mort.", "en": "“By the force of this eloquence he easily persuaded them, and all underwent the operation. The imam applied the same balsam as they do to children after circumcision. We were all ready to give up the ghost."}, {"fr": "« À peine les janissaires eurent-ils fait le repas que nous leur avions fourni, que les Russes arrivent sur des bateaux plats : pas un janissaire ne réchappa. Les Russes ne firent aucune attention à l’état où nous étions. Il y a partout des chirurgiens français ; un d’eux, qui était fort adroit, prit soin de nous, il nous guérit, et je me souviendrai toute ma vie que, quand mes plaies furent bien fermées, il me fit des propositions. Au reste, il nous dit à toutes de nous consoler ; il nous assura que dans plusieurs sièges pareille chose était arrivée, et que c’était la loi de la guerre.", "en": "“The janissaries had scarcely time to finish the repast with which we had supplied them, when the Russians attacked the place by means of flat-bottomed boats, and not a single janissary escaped. The Russians paid no regard to the condition we were in; but as there are French surgeons in all parts of the world, a skilful operator took us under his care, and made a cure of us; and I shall never forget, while I live, that as soon as my wounds were perfectly healed, he made me certain proposals. In general, he desired us all to have a good heart, assuring us that the like had happened in many sieges; and that it was the law of war."}, {"fr": "« Dès que mes compagnes purent marcher, on les fit aller à Moscou ; j’échus en partage à un boïard qui me fit sa jardinière, et qui me donnait vingt coups de fouet par jour ; mais ce seigneur ayant été roué au bout de deux ans avec une trentaine de boïards pour quelque tracasserie de cour, je profitai de cette aventure ; je m’enfuis ; je traversai toute la Russie ; je fus longtemps servante de cabaret à Riga, puis à Rostock, à Vismar, à Leipsick, à Cassel, à Utrecht, à Leyde, à la Haye, à Rotterdam ; j’ai vieilli dans la misère et dans l’opprobre, n’ayant que la moitié d’un derrière, me souvenant toujours que j’étais fille d’un pape ; je voulus cent fois me tuer, mais j’aimais encore la vie. Cette faiblesse ridicule est peut-être un de nos penchants les plus funestes : car y a-t-il rien de plus sot que de vouloir porter continuellement un fardeau qu’on veut toujours jeter par terre ; d’avoir son être en horreur, et de tenir à son être ; enfin de caresser le serpent qui nous dévore, jusqu’à ce qu’il nous ait mangé le cœur ?", "en": "“As soon as my companions were in a condition to walk, they were sent to Moscow. As for me, I fell to the lot of a boyard, who put me to work in his garden, and gave me twenty lashes a day. But this nobleman having, in about two years afterwards, been broken alive upon the wheel, with about thirty others, for some court intrigues, I took advantage of the event, and made my escape. I travelled over a great part of Russia. I was a long time an innkeeper’s servant at Riga, then at Rostock, Wismar, Leipsic, Cassel, Utrecht, Leyden, The Hague, and Rotterdam: I have grown old in misery and disgrace, living with only one buttock, and in the perpetual remembrance that I was a pope’s daughter. I have been an hundred times upon the point of killing myself, but still was fond of life. This ridiculous weakness is, perhaps, one of the dangerous principles implanted in our nature. For what can be more absurd than to persist in carrying a burden of which we wish to be eased? to detest, and yet to strive to preserve our existence? In a word, to caress the serpent that devours us, and hug him close to our bosoms till he has gnawed into our hearts?"}, {"fr": "« J’ai vu dans les pays que le sort m’a fait parcourir, et dans les cabarets où j’ai servi, un nombre prodigieux de personnes qui avaient leur existence en exécration ; mais je n’en ai vu que douze qui aient mis volontairement fin à leur misère : trois nègres, quatre Anglais, quatre Genevois, et un professeur allemand nommé Robeck. J’ai fini par être servante chez le juif don Issachar ; il me mit auprès de vous, ma belle demoiselle ; je me suis attachée à votre destinée, et j’ai été plus occupée de vos aventures que des miennes. Je ne vous aurais même jamais parlé de mes malheurs, si vous ne m’aviez pas un peu piquée, et s’il n’était d’usage, dans un vaisseau, de conter des histoires pour se désennuyer. Enfin, mademoiselle, j’ai de l’expérience, je connais le monde : donnez-vous un plaisir, engagez chaque passager à vous conter son histoire, et s’il s’en trouve un seul qui n’ait souvent maudit sa vie, qui ne se soit souvent dit à lui-même qu’il était le plus malheureux des hommes, jetez-moi dans la mer la tête la première. »", "en": "“In the different countries which it has been my fate to traverse, and the many inns where I have been a servant, I have observed a prodigious number of people who held their existence in abhorrence, and yet I never knew more than twelve who voluntarily put an end to their misery; namely, three negroes, four Englishmen, as many Genoese, and a German professor named Robek. My last place was with the Jew, Don Issachar, who placed me near your person, my fair lady; to your fortunes I have attached myself, and have been more affected by your adventures than my own. I should never have even mentioned the latter to you, had you not a little piqued me on the head of sufferings; and if it were not customary to tell stories on board a ship in order to pass away the time. In short, my dear miss, I have a great deal of knowledge and experience of the world, therefore take my advice; divert yourself, and prevail upon each passenger to tell his story, and if there is one of them all that has not cursed his existence many times, and said to himself over and over again, that he was the most wretched of mortals, I give you leave to throw me headforemost into the sea.”"}, {"fr": "La belle Cunégonde, ayant entendu l’histoire de la vieille, lui fit toutes les politesses qu’on devait à une personne de son rang et de son mérite. Elle accepta la proposition ; elle engagea tous les passagers, l’un après l’autre, à lui conter leurs aventures. Candide et elle avouèrent que la vieille avait raison. « C’est bien dommage, disait Candide, que le sage Pangloss ait été pendu contre la coutume dans un auto-da-fé ; il nous dirait des choses admirables sur le mal physique et sur le mal moral qui couvrent la terre et la mer, et je me sentirais assez de force pour oser lui faire respectueusement quelques objections. »", "en": "The fair Cunegund, being thus made acquainted with the history of the old woman’s life and adventures, paid her all the respect and civility due to a person of her rank and merit. She very readily came into her proposal of engaging every one of the passengers to relate their adventures in their turns, and was at length, as well as Candide, compelled to acknowledge that the old woman was in the right. “It is a thousand pities,” said Candide, “that the sage Pangloss should have been hanged contrary to the custom of an auto-da-fé, for he would have read us a most admirable lecture on the moral and physical evil which overspreads the earth and sea; and I think I should have courage enough to presume to offer (with all due respect) some few objections.”"}, {"fr": "À mesure que chacun racontait son histoire, le vaisseau avançait. On aborda dans Buénos-Ayres. Cunégonde, le capitaine Candide, et la vieille, allèrent chez le gouverneur don Fernando d’Ibaraa, y Figueora, y Mascarenes, y Lampourdos, y Souza. Ce seigneur avait une fierté convenable à un homme qui portait tant de noms. Il parlait aux hommes avec le dédain le plus noble, portant le nez si haut, élevant si impitoyablement la voix, prenant un ton si imposant, affectant une démarche si altière, que tous ceux qui le saluaient étaient tentés de le battre. Il aimait les femmes à la fureur. Cunégonde lui parut ce qu’il avait jamais vu de plus beau. La première chose qu’il fit fut de demander si elle n’était point la femme du capitaine. L’air dont il fit cette question alarma Candide : il n’osa pas dire qu’elle était sa femme, parce qu’en effet elle ne l’était point ; il n’osait pas dire que c’était sa sœur, parce qu’elle ne l’était pas non plus ; et quoique ce mensonge officieux eût été autrefois très à la mode chez les anciens, et qu’il pût être utile aux modernes, son âme était trop pure pour trahir la vérité. « Mademoiselle Cunégonde, dit-il, doit me faire l’honneur de m’épouser, et nous supplions Votre Excellence de daigner faire notre noce. »", "en": "While everyone was reciting his adventures, the ship continued her way, and at length arrived at Buenos Ayres, where Cunegund, Captain Candide, and the old woman, landed and went to wait upon the Governor Don Fernando d’Ibaraa y Figueora y Mascarenas y Lampourdos y Souza. This nobleman carried himself with a haughtiness suitable to a person who bore so many names. He spoke with the most noble disdain to every one, carried his nose so high, strained his voice to such a pitch, assumed so imperious an air, and stalked with so much loftiness and pride, that every one who had the honour of conversing with him was violently tempted to bastinade his Excellency. He was immoderately fond of women, and Cunegund appeared in his eyes a paragon of beauty. The first thing he did was to ask her if she was the captain’s wife. The air with which he made this demand alarmed Candide; he did not dare to say he was married to her, because, indeed, he was not; neither durst he say she was his sister, because she was not that either: and though a lie of this nature proved of great service to one of the ancients, and might possibly be useful to some of the moderns, yet the purity of his heart would not permit him to violate the truth."}, {"fr": "Don Fernando d’Ibaraa, y Figueora, y Mascarenes, y Lampourdos, y Souza, relevant sa moustache, sourit amèrement, et ordonna au capitaine Candide d’aller faire la revue de sa compagnie. Candide obéit ; le gouverneur demeura avec Mlle Cunégonde. Il lui déclara sa passion, lui protesta que le lendemain il l’épouserait à la face de l’Église, ou autrement, ainsi qu’il plairait à ses charmes. Cunégonde lui demanda un quart d’heure pour se recueillir, pour consulter la vieille, et pour se déterminer.", "en": "“Miss Cunegund,” replied he, “is to do me the honour of marrying me, and we humbly beseech your Excellency to condescend to grace the ceremony with your presence.” Don Fernando d’Ibaraa y Figueora y Mascarenas y Lampourdos y Souza, twirling his mustachio, and putting on a sarcastic smile, ordered Captain Candide to go and review his company. Candide obeyed, and the Governor was left with Miss Cunegund. He made her a strong declaration of love, protesting that he was ready on the morrow to give her his hand in the face of the Church, or otherwise, as should appear most agreeable to a young lady of her prodigious beauty. Cunegund desired leave to retire a quarter of an hour to consult the old woman, and determine how she should proceed."}, {"fr": "La vieille dit à Cunégonde : « Mademoiselle, vous avez soixante et douze quartiers et pas une obole ; il ne tient qu’à vous d’être la femme du plus grand seigneur de l’Amérique méridionale, qui a une très-belle moustache ; est-ce à vous de vous piquer d’une fidélité à toute épreuve ? Vous avez été violée par les Bulgares ; un juif et un inquisiteur ont eu vos bonnes grâces : les malheurs donnent des droits. J’avoue que si j’étais à votre place, je ne ferais aucun scrupule d’épouser monsieur le gouverneur, et de faire la fortune de monsieur le capitaine Candide. » Tandis que la vieille parlait avec toute la prudence que l’âge et l’expérience donnent, on vit entrer dans le port un petit vaisseau ; il portait un alcade et des alguazils, et voici ce qui était arrivé.", "en": "The old woman gave her the following counsel: “Miss, you have seventy-two quarterings in your arms, it is true, but you have not a penny to bless yourself with: it is your own fault if you are not wife to one of the greatest noblemen in South America, with an exceeding fine mustachio. What business have you to pride yourself upon an unshaken constancy? You have been ravished by a Bulgarian soldier; a Jew and an Inquisitor have both tasted of your favours. People take advantage of misfortunes. I must confess, were I in your place, I should, without the least scruple, give my hand to the Governor, and thereby make the fortune of the brave Captain Candide.” While the old woman was thus haranguing, with all the prudence that old age and experience furnish, a small bark entered the harbour, in which was a magistrate and his alguazils. Matters had fallen out as follows:"}, {"fr": "La vieille avait très-bien deviné que ce fut un cordelier à la grande manche qui vola l’argent et les bijoux de Cunégonde dans la ville de Badajos, lorsqu’elle fuyait en hâte avec Candide. Ce moine voulut vendre quelques-unes des pierreries à un joaillier. Le marchand les reconnut pour celles du grand inquisiteur. Le cordelier, avant d’être pendu, avoua qu’il les avait volées : il indiqua les personnes, et la route qu’elles prenaient. La fuite de Cunégonde et de Candide était déjà connue. On les suivit à Cadix : on envoya, sans perdre de temps, un vaisseau à leur poursuite. Le vaisseau était déjà dans le port de Buénos-Ayres. Le bruit se répandit qu’un alcade allait débarquer, et qu’on poursuivait les meurtriers de monseigneur le grand inquisiteur. La prudente vieille vit dans l’instant tout ce qui était à faire. « Vous ne pouvez fuir, dit-elle à Cunégonde, et vous n’avez rien à craindre : ce n’est pas vous qui avez tué monseigneur, et d’ailleurs le gouverneur, qui vous aime, ne souffrira pas qu’on vous maltraite ; demeurez. » Elle court sur-le-champ à Candide : « Fuyez, dit-elle, ou dans une heure vous allez être brûlé. » Il n’y avait pas un moment à perdre ; mais comment se séparer de Cunégonde, et où se réfugier ?", "en": "The old woman rightly guessed that the cordelier with the long sleeves was the person who had taken Cunegund’s money and jewels while they and Candide were at Badajoz, in their hasty flight from Lisbon. This same friar attempted to sell some of the diamonds to a jeweller, who at once knew them to have belonged to the Grand Inquisitor. The cordelier, before he was hanged, confessed that he had stolen them, and described the persons, and the road they had taken. The flight of Cunegund and Candide was already the town-talk. They sent in pursuit of them to Cadiz; and the vessel which had been sent, to make the greater dispatch, had now reached the port of Buenos Ayres. A report was spread that a magistrate was going to land, and that he was in pursuit of the murderers of my lord the Grand Inquisitor. The wise old woman immediately saw what was to be done. “You cannot run away,” said she to Cunegund; “but you have nothing to fear; it was not you who killed my lord Inquisitor: besides, as the Governor is in love with you, he will not suffer you to be ill-treated; therefore stand your ground.” Then hurrying away to Candide, “Be gone,” said she, “from hence this instant, or you will be burnt alive.” Candide found there was no time to be lost; but how could he part from Cunegund, and whither must he fly for shelter?"}, {"fr": "Candide avait amené de Cadix un valet tel qu’on en trouve beaucoup sur les côtes d’Espagne et dans les colonies. C’était un quart d’Espagnol, né d’un métis dans le Tucuman ; il avait été enfant de chœur, sacristain, matelot, moine, facteur, soldat, laquais. Il s’appelait Cacambo, et aimait fort son maître, parce que son maître était un fort bon homme. Il sella au plus vite les deux chevaux andalous. « Allons, mon maître, suivons le conseil de la vieille ; partons, et courons sans regarder derrière nous. » Candide versa des larmes : « Ô ma chère Cunégonde ! faut-il vous abandonner dans le temps que monsieur le gouverneur va faire nos noces ! Cunégonde amenée de si loin, que deviendrez-vous ?", "en": "Candide had brought with him from Cadiz such a footman as one often meets with on the coasts of Spain and in the colonies. He was the fourth part of a Spaniard, of a mongrel breed, and born in Tucuman. He had successively gone through the profession of a choirboy, sexton, sailor, monk, pedlar, soldier, and lackey. His name was Cacambo; he had a great affection for his master because his master was a mighty good man. He immediately saddled the two Andalusian horses. “Come, my good master,“ he said, “let us follow the old woman’s advice, and make all the haste we can from this place, without staying to look behind us.” Candide burst into a flood of tears. “O my dear Cunegund, must I then be compelled to quit you, just as the Governor was going to honour us with his presence at our wedding! Cunegund, so long lost, and found again, what will become of you?”"}, {"fr": "Elle deviendra ce qu’elle pourra, dit Cacambo ; les femmes ne sont jamais embarrassées d’elles ; Dieu y pourvoit ; courons.", "en": "“Lord!” said Cacambo, “she must do as well as she can; women are never at a loss. God takes care of them, and so let us make the best of our way.”"}, {"fr": "Où me mènes-tu ? où allons-nous ? que ferons-nous sans Cunégonde ? disait Candide.", "en": "“But whither wilt thou carry me? Where can we go? What can we do without Cunegund?” cried the disconsolate Candide."}, {"fr": "Par saint Jacques de Compostelle, dit Cacambo, vous alliez faire la guerre aux jésuites ; allons la faire pour eux : je sais assez les chemins, je vous mènerai dans leur royaume, ils seront charmés d’avoir un capitaine qui fasse l’exercice à la bulgare ; vous ferez une fortune prodigieuse : quand on n’a pas son compte dans un monde, on le trouve dans un autre. C’est un très-grand plaisir de voir et de faire des choses nouvelles.", "en": "“By St. James of Compostella,” said Cacambo, “you were going to fight against the Jesuits of Paraguay; now, let us go and fight for them: I know the road perfectly well; I’ll conduct you to their kingdom; they will be delighted with a captain that understands the Bulgarian exercise; you will certainly make a prodigious fortune. If we cannot find our account in one world, we may in another. It is a great pleasure to see new objects, and perform new exploits.”"}, {"fr": "Tu as donc été déjà dans le Paraguai ? dit Candide.", "en": "“Then you have been in Paraguay?” said Candide."}, {"fr": "Eh vraiment oui ! dit Cacambo ; j’ai été cuistre dans le collège de l’Assomption, et je connais le gouvernement de los padres comme je connais les rues de Cadix. C’est une chose admirable que ce gouvernement. Le royaume a déjà plus de trois cents lieues de diamètre ; il est divisé en trente provinces. Los padres y ont tout, et les peuples rien ; c’est le chef-d’œuvre de la raison et de la justice. Pour moi, je ne vois rien de si divin que los padres, qui font ici la guerre au roi d’Espagne et au roi de Portugal, et qui en Europe confessent ces rois ; qui tuent ici des Espagnols, et qui à Madrid les envoient au ciel : cela me ravit ; avançons : vous allez être le plus heureux de tous les hommes. Quel plaisir auront los padres quand ils sauront qu’il leur vient un capitaine qui sait l’exercice bulgare ! »", "en": "“Ay, marry, have I,” replied Cacambo: “I was a scout in the College of the Assumption, and I am as well acquainted with the new government of Los Padres as I am with the streets of Cadiz. Oh, it is an admirable government, that is most certain! The kingdom is at present upwards of three hundred leagues in diameter, and divided into thirty provinces; the fathers are there masters of everything, and the people have no money at all; this is the masterpiece of justice and reason. For my part, I see nothing so divine as the good fathers, who wage war in this part of the world against the King of Spain and the King of Portugal, at the same time that they hear the confessions of those very princes in Europe; who kill Spaniards in America, and send them to Heaven in Madrid. This pleases me exceedingly, but let us push forward; you are going to be most fortunate of all mortals. How charmed will those fathers be to hear that a captain who understands the Bulgarian exercise is coming among them!”"}, {"fr": "Dès qu’ils furent arrivés à la première barrière, Cacambo dit à la garde avancée qu’un capitaine demandait à parler à monseigneur le commandant. On alla avertir la grande garde. Un officier paraguain courut aux pieds du commandant lui donner part de la nouvelle. Candide et Cacambo furent d’abord désarmés ; on se saisit de leurs deux chevaux andalous. Les deux étrangers sont introduits au milieu de deux files de soldats ; le commandant était au bout, le bonnet à trois cornes en tête, la robe retroussée, l’épée au côté, l’esponton à la main. Il fit un signe ; aussitôt vingt-quatre soldats entourent les deux nouveaux venus. Un sergent leur dit qu’il faut attendre, que le commandant ne peut leur parler, que le révérend père provincial ne permet pas qu’aucun Espagnol ouvre la bouche qu’en sa présence, et demeure plus de trois heures dans le pays. « Et où est le révérend père provincial ? dit Cacambo.", "en": "As soon as they reached the first barrier, Cacambo called to the advance guard, and told them that a captain wanted to speak to my Lord the General. Notice was given to the main guard, and immediately a Paraguayan officer ran to throw himself at the feet of the Commandant to impart this news to him. Candide and Cacambo were immediately disarmed, and their two Andalusian horses were seized. The two strangers were now conducted between two files of musketeers, the Commandant was at the farther end with a three-cornered cap on his head, his gown tucked up, a sword by his side, and a half-pike in his hand; he made a sign, and instantly four-and-twenty soldiers drew up round the newcomers. A sergeant told them that they must wait, the Commandant could not speak to them; and that the Reverend Father Provincial did not suffer any Spaniard to open his mouth but in his presence, or to stay above three hours in the province. “And where is the Reverend Father Provincial?” said Cacambo."}, {"fr": "Il est à la parade après avoir dit sa messe, répondit le sergent, et vous ne pourrez baiser ses éperons que dans trois heures.", "en": "“He is just come from mass, and is at the parade,” replied the sergeant, “and in about three hours’ time, you may possibly have the honour to kiss his spurs.”"}, {"fr": "Mais, dit Cacambo, monsieur le capitaine, qui meurt de faim comme moi, n’est point Espagnol, il est Allemand ; ne pourrions-nous point déjeuner en attendant sa révérence ? »", "en": "“But,” said Cacambo, “the captain, who, as well as myself, is perishing with hunger, is no Spaniard, but a German; therefore, pray, might we not be permitted to break our fast till we can be introduced to his Reverence?”"}, {"fr": "Le sergent alla sur-le-champ rendre compte de ce discours au commandant. « Dieu soit béni ! dit ce seigneur, puisqu’il est Allemand, je peux lui parler ; qu’on le mène dans ma feuillée. » Aussitôt on conduit Candide dans un cabinet de verdure, orné d’une très-jolie colonnade de marbre vert et or, et de treillages qui renfermaient des perroquets, des colibris, des oiseaux-mouches, des pintades, et tous les oiseaux les plus rares. Un excellent déjeuner était préparé dans des vases d’or ; et tandis que les Paraguains mangèrent du maïs dans des écuelles de bois, en plein champ, à l’ardeur du soleil, le révérend père commandant entra dans la feuillée.", "en": "The sergeant immediately went, and acquainted the Commandant with what he heard. “God be praised,” said the Reverend Commandant, “since he is a German, I will hear what he has to say; let him be brought to my arbour.” Immediately they conducted Candide to a beautiful pavilion, adorned with a colonnade of green and gold marble, and with trellisses of vines, which served as a kind of cage for parrots, humming-birds, fly-birds, guinea-hens, and all other curious kinds of birds. An excellent breakfast was provided in vessels of gold; and while the Paraguayans were eating coarse Indian corn out of wooden dishes in the open air, and exposed to the burning heat of the sun, the Reverend Father Commandant retired to his cool arbour."}, {"fr": "C’était un très-beau jeune homme, le visage plein, assez blanc, haut en couleur, le sourcil relevé, l’œil vif, l’oreille rouge, les lèvres vermeilles, l’air fier, mais d’une fierté qui n’était ni celle d’un Espagnol ni celle d’un jésuite. On rendit à Candide et à Cacambo leurs armes, qu’on leur avait saisies, ainsi que les deux chevaux andalous ; Cacambo leur fit manger l’avoine auprès de la feuillée, ayant toujours l’œil sur eux, crainte de surprise.", "en": "He was a very handsome young man, round-faced, fair, and fresh-coloured, his eyebrows were finely arched, he had a piercing eye, the tips of his ears were red, his lips vermilion, and he had a bold and commanding air; but such a boldness as neither resembled that of a Spaniard nor of a Jesuit. He ordered Candide and Cacambo to have their arms restored to them, together with their two Andalusian horses. Cacambo gave the poor beasts some oats to eat close by the arbour, keeping a strict eye upon them all the while for fear of surprise."}, {"fr": "Candide baisa d’abord le bas de la robe du commandant, ensuite ils se mirent à table. « Vous êtes donc Allemand ? lui dit le jésuite en cette langue.", "en": "Candide having kissed the hem of the Commandant’s robe, they sat down to table."}, {"fr": "Oui, mon révérend père, » dit Candide. L’un et l’autre, en prononçant ces paroles, se regardaient avec une extrême surprise, et une émotion dont ils n’étaient pas les maîtres. « Et de quel pays d’Allemagne êtes-vous ? dit le jésuite.", "en": "“It seems you are a German?” said the Jesuit to him in that language. “Yes, Reverend Father,” answered Candide. As they pronounced these words, they looked at each other with great amazement, and with an emotion that neither could conceal. “From what part of Germany do you come?” said the Jesuit."}, {"fr": "De la sale province de Vestphalie, dit Candide ; je suis né dans le château de Thunder-ten-tronckh.", "en": "“From the dirty province of Westphalia,” answered Candide: “I was born in the castle of Thunder-ten-tronckh.”"}, {"fr": "Ô ciel ! est-il possible ! s’écria le commandant.", "en": "“Oh heavens! is it possible?” said the Commandant."}, {"fr": "Quel miracle ! s’écria Candide.", "en": "“What a miracle!” cried Candide."}, {"fr": "Serait-ce vous ? dit le commandant.", "en": "“Can it be you?” said the Commandant."}, {"fr": "Cela n’est pas possible, dit Candide. » Ils se laissent tomber tous deux à la renverse, ils s’embrassent, ils versent des ruisseaux de larmes. « Quoi ! serait-ce vous, mon révérend père ? vous, le frère de la belle Cunégonde ! vous qui fûtes tué par les Bulgares ! vous, le fils de monsieur le baron ! vous, jésuite au Paraguai ! Il faut avouer que ce monde est une étrange chose. Ô Pangloss ! Pangloss ! que vous seriez aise si vous n’aviez pas été pendu ! »", "en": "On this they both retired a few steps backwards, th
