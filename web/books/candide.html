r entre les plus apparents, il distingua une vingtaine de personnes qui lui paraissaient sociables, et qui toutes prétendaient mériter la préférence. Il les assembla dans son cabaret, et leur donna à souper, à condition que chacun ferait serment de raconter fidèlement son histoire, promettant de choisir celui qui lui paraîtrait le plus à plaindre et le plus mécontent de son état, à plus juste titre, et de donner aux autres quelques gratifications.", "en": "Upon this there appeared such a crowd of candidates that a large fleet could not have contained them. Candide, willing to choose from among those who appeared most likely to answer his intention, selected twenty, who seemed to him the most sociable, and who all pretended to merit the preference. He invited them to his inn, and promised to treat them with a supper, on condition that every man should bind himself by an oath to relate his own history. He declared at the same time that he would make choice of that person who should appear to him the most deserving of compassion, and the most justly dissatisfied with his condition of life; and that he would make a present to the rest."}, {"fr": "La séance dura jusqu’à quatre heures du matin. Candide, en écoutant toutes leurs aventures, se ressouvenait de ce que lui avait dit la vieille en allant à Buénos-Ayres, et de la gageure qu’elle avait faite, qu’il n’y avait personne sur le vaisseau à qui il ne fût arrivé de très-grands malheurs. Il songeait à Pangloss à chaque aventure qu’on lui contait. « Ce Pangloss, disait-il, serait bien embarrassé à démontrer son système. Je voudrais qu’il fût ici. Certainement si tout va bien, c’est dans Eldorado, et non pas dans le reste de la terre. » Enfin il se détermina en faveur d’un pauvre savant qui avait travaillé dix ans pour les libraires à Amsterdam. Il jugea qu’il n’y avait point de métier au monde dont on dût être plus dégoûté.", "en": "This extraordinary assembly continued sitting till four in the morning. Candide, while he was listening to their adventures, called to mind what the old woman had said to him on their voyage to Buenos Ayres, and the wager she had laid that there was not a person on board the ship but had met with some great misfortune. Every story he heard put him in mind of Pangloss. “My old master,” said he, “would be confoundedly put to it to demonstrate his favourite system. Would he were here! Certainly if everything is for the best, it is in El Dorado, and not in the other parts of the world.”"}, {"fr": "Ce savant, qui était d’ailleurs un bon homme, avait été volé par sa femme, battu par son fils, et abandonné de sa fille, qui s’était fait enlever par un Portugais. Il venait d’être privé d’un petit emploi duquel il subsistait ; et les prédicants de Surinam le persécutaient, parce qu’ils le prenaient pour un socinien. Il faut avouer que les autres étaient pour le moins aussi malheureux que lui ; mais Candide espérait que le savant le désennuierait dans le voyage. Tous ses autres rivaux trouvèrent que Candide leur faisait une grande injustice ; mais il les apaisa en leur donnant à chacun cent piastres.", "en": "At length he determined in favour of a poor scholar who had laboured ten years for the booksellers at Amsterdam, being of opinion that no employment could be more detestable. This scholar, who was in fact a very honest man, had been robbed by his wife, beaten by his son, and forsaken by his daughter, who had run away with a Portuguese. He had been likewise deprived of a small employment on which he subsisted, and he was persecuted by the clergy of Surinam, who took him for a Socinian. It must be acknowledged that the other competitors were, at least, as wretched as he; but Candide was in hopes that the company of a man of letters would relieve the tediousness of the voyage. All the other candidates complained that Candide had done them great injustice; but he stopped their mouths by a present of a hundred piastres to each."}, {"fr": "Le vieux savant, qui s’appelait Martin, s’embarqua donc pour Bordeaux avec Candide. L’un et l’autre avaient beaucoup vu et beaucoup souffert ; et quand le vaisseau aurait dû faire voile de Surinam au Japon par le cap de Bonne-Espérance, ils auraient eu de quoi s’entretenir du mal moral et du mal physique pendant tout le voyage.", "en": "The old scholar, whose name was Martin, took shipping with Candide for Bordeaux. They both had seen and suffered a great deal; and if the ship had been destined to sail from Surinam to Japan round the Cape of Good Hope, they could have found sufficient entertainment for each other during the whole voyage in discoursing upon moral and natural evil."}, {"fr": "Cependant Candide avait un grand avantage sur Martin, c’est qu’il espérait toujours revoir Mlle Cunégonde, et que Martin n’avait rien à espérer ; de plus il avait de l’or et des diamants ; et, quoiqu’il eût perdu cent gros moutons rouges chargés des plus grands trésors de la terre, quoiqu’il eût toujours sur le cœur la friponnerie du patron hollandais ; cependant, quand il songeait à ce qui lui restait dans ses poches, et quand il parlait de Cunégonde, surtout à la fin du repas, il penchait alors pour le système de Pangloss.", "en": "Candide, however, had one advantage over Martin: he lived in the pleasing hopes of seeing Miss Cunegund once more; whereas the poor philosopher had nothing to hope for. Besides, Candide had money and jewels, and, notwithstanding he had lost a hundred red sheep, laden with the greatest treasure on the earth, and though he still smarted from the reflection of the Dutch skipper’s knavery, yet when he considered what he had still left, and repeated the name of Cunegund, especially after meal-times, he inclined to Pangloss’s doctrine."}, {"fr": "« Mais vous, monsieur Martin, dit-il au savant, que pensez-vous de tout cela ? quelle est votre idée sur le mal moral et le mal physique ?", "en": "“And pray,” said he to Martin, “what is your opinion of the whole of this system? What notion have you of moral and natural evil?”"}, {"fr": "Monsieur, répondit Martin, mes prêtres m’ont accusé d’être socinien ; mais la vérité du fait est que je suis manichéen.", "en": "“Sir,” replied Martin, “our priests accused me of being a Socinian; but the real truth is, I am a Manichæan.”"}, {"fr": "Vous vous moquez de moi, dit Candide ; il n’y a plus de manichéens dans le monde.", "en": "“Nay, now you are jesting,” said Candide; “there are no Manichæans existing at present in the world.”"}, {"fr": "Il y a moi, dit Martin ; je ne sais qu’y faire, mais je ne peux penser autrement.", "en": "“And yet I am one,” said Martin; “but I cannot help it; I cannot for the soul of me think otherwise.”"}, {"fr": "Il faut que vous ayez le diable au corps, dit Candide.", "en": "“Surely the devil must be in you,” said Candide."}, {"fr": "Il se mêle si fort des affaires de ce monde, dit Martin, qu’il pourrait bien être dans mon corps, comme partout ailleurs ; mais je vous avoue qu’en jetant la vue sur ce globe, ou plutôt sur ce globule, je pense que Dieu l’a abandonné à quelque être malfaisant ; j’en excepte toujours Eldorado. Je n’ai guère vu de ville qui ne désirât la ruine de la ville voisine, point de famille qui ne voulût exterminer quelque autre famille. Partout les faibles ont en exécration les puissants devant lesquels ils rampent, et les puissants les traitent comme des troupeaux dont on vend la laine et la chair. Un million d’assassins enrégimentés, courant d’un bout de l’Europe à l’autre, exerce le meurtre et le brigandage avec discipline pour gagner son pain, parce qu’il n’a pas de métier plus honnête ; et dans les villes qui paraissent jouir de la paix, et où les arts fleurissent, les hommes sont dévorés de plus d’envie, de soins et d’inquiétudes, qu’une ville assiégée n’éprouve de fléaux. Les chagrins secrets sont encore plus cruels que les misères publiques. En un mot, j’en ai tant vu et tant éprouvé que je suis manichéen.", "en": "“He concerns himself so much,” replied Martin, “in the affairs of this world that it is very probable he may be in me as well as everywhere else; but I must confess, when I cast my eye on this globe, or rather globule, I cannot help thinking that God has abandoned it to some malignant being. I always except El Dorado. I scarce ever knew a city that did not wish the destruction of its neighbouring city; nor a family that did not desire to exterminate some other family. The poor, in all parts of the world, bear an inveterate hatred to the rich, even while they creep and cringe to them; and the rich treat the poor like sheep, whose wool and flesh they barter for money: a million of regimented assassins traverse Europe from one end to the other to get their bread by regular depredation and murder, because it is the most gentleman-like profession. Even in those cities which seem to enjoy the blessings of peace, and where the arts flourish, the inhabitants are devoured with envy, care, and anxiety, which are greater plagues than any experienced in a town besieged. Private chagrins are still more dreadful than public calamities. In a word, I have seen and suffered so much, that I am a Manichæan.”"}, {"fr": "Il y a pourtant du bon, répliquait Candide.", "en": "“And yet there is some good in the world,” replied Candide."}, {"fr": "Cela peut être, disait Martin ; mais je ne le connais pas. »", "en": "“May be,” said Martin, “but it has escaped my knowledge.”"}, {"fr": "Au milieu de cette dispute, on entendit un bruit de canon. Le bruit redouble de moment en moment. Chacun prend sa lunette. On aperçoit deux vaisseaux qui combattaient à la distance d’environ trois milles : le vent les amena l’un et l’autre si près du vaisseau français, qu’on eut le plaisir de voir le combat tout à son aise. Enfin l’un des deux vaisseaux lâcha à l’autre une bordée si bas et si juste, qu’il le coula à fond. Candide et Martin aperçurent distinctement une centaine d’hommes sur le tillac du vaisseau qui s’enfonçait ; ils levaient tous les mains au ciel, et jetaient des clameurs effroyables : en un moment tout fut englouti.", "en": "While they were deeply engaged in this dispute they heard the report of cannon, which redoubled every moment. Each took out his glass, and they espied two ships warmly engaged at the distance of about three miles. The wind brought them both so near the French ship that those on board her had the pleasure of seeing the fight with great ease. At last one of the two vessels gave the other a shot between wind and water, which sank her outright. Then could Candide and Martin plainly perceive a hundred men on the deck of the vessel which was sinking, who, with hands uplifted to heaven, sent forth piercing cries, and were in a moment swallowed up by the waves."}, {"fr": "« Eh bien ! dit Martin, voilà comme les hommes se traitent les uns les autres.", "en": "“Well,” said Martin, “you now see in what manner mankind treat each other.”"}, {"fr": "Il est vrai, dit Candide, qu’il y a quelque chose de diabolique dans cette affaire. » En parlant ainsi, il aperçut je ne sais quoi d’un rouge éclatant, qui nageait auprès de son vaisseau. On détacha la chaloupe pour voir ce que ce pouvait être : c’était un de ses moutons. Candide eut plus de joie de retrouver ce mouton, qu’il n’avait été affligé d’en perdre cent tous chargés de gros diamants d’Eldorado.", "en": "“It is certain,” said Candide, “that there is something diabolical in this affair.” As he was speaking thus, he saw something of a shining red hue, which swam close to the vessel. The boat was hoisted out to see what it might be, when it proved to be one of his sheep. Candide felt more joy at the recovery of this one animal than he did grief when he lost the other hundred, though laden with the large diamonds of El Dorado."}, {"fr": "Le capitaine français aperçut bientôt que le capitaine du vaisseau submergeant était espagnol, et que celui du vaisseau submergé était un pirate hollandais ; c’était celui-là même qui avait volé Candide. Les richesses immenses dont ce scélérat s’était emparé furent ensevelies avec lui dans la mer, et il n’y eut qu’un mouton de sauvé. « Vous voyez, dit Candide à Martin, que le crime est puni quelquefois ; ce coquin de patron hollandais a eu le sort qu’il méritait.", "en": "The French captain quickly perceived that the victorious ship belonged to the crown of Spain; that the other which sank was a Dutch pirate, and the very same captain who had robbed Candide. The immense riches which this villain had amassed were buried with him in the deep, and only this one sheep saved out of the whole. “You see,” said Candide to Martin, “that vice is sometimes punished: this villain, the Dutch skipper, has met with the fate he deserved.”"}, {"fr": "Oui, dit Martin ; mais fallait-il que les passagers qui étaient sur son vaisseau périssent aussi ? Dieu a puni ce fripon, le diable a noyé les autres. »", "en": "“Very true,” said Martin; “but why should the passengers be doomed also to destruction? God has punished the knave, and the devil has drowned the rest.”"}, {"fr": "Cependant le vaisseau français et l’espagnol continuèrent leur route, et Candide continua ses conversations avec Martin. Ils disputèrent quinze jours de suite, et au bout de quinze jours ils étaient aussi avancés que le premier. Mais enfin ils parlaient, ils se communiquaient des idées, ils se consolaient. Candide caressait son mouton. « Puisque je t’ai retrouvé, dit-il, je pourrai bien retrouver Cunégonde. »", "en": "The French and Spanish ships continued their cruise, and Candide and Martin their conversation. They disputed fourteen days successively, at the end of which they were just as far advanced as the first moment they began. However, they had the satisfaction of disputing, of communicating their ideas, and of mutually comforting each other. Candide embraced his sheep. “Since I have found thee again,” said he, “I may possibly find my Cunegund once more.”"}, {"fr": "On aperçut enfin les côtes de France. « Avez-vous jamais été en France, monsieur Martin ? dit Candide.", "en": "At length they sighted the coast of France. “Pray, Mr. Martin,” said Candide, “have you ever been in France?”"}, {"fr": "Oui, dit Martin, j’ai parcouru plusieurs provinces. Il y en a où la moitié des habitants est folle, quelques-unes où l’on est trop rusé, d’autres où l’on est communément assez doux et assez bête, d’autres où l’on fait le bel esprit ; et, dans toutes, la principale occupation est l’amour ; la seconde, de médire ; et la troisième, de dire des sottises.", "en": "“Yes, Sir,” said Martin, “I have been in several provinces of that kingdom. In some, one half of the people are madmen; in some, they are too artful; in others, again, they are in general either very good-natured or very brutal; while in others, they affect to be witty, and in all, their ruling passion is love, the next is slander, and the last is to talk nonsense.”"}, {"fr": "Mais, monsieur Martin, avez-vous vu Paris ?", "en": "“But pray, Mr. Martin, were you ever in Paris?”"}, {"fr": "Oui, j’ai vu Paris ; il tient de toutes ces espèces-là ; c’est un chaos, c’est une presse dans laquelle tout le monde cherche le plaisir, et où presque personne ne le trouve, du moins à ce qu’il m’a paru. J’y ai séjourné peu ; j’y fus volé, en arrivant, de tout ce que j’avais, par des filous, à la foire Saint-Germain ; on me prit moi-même pour un voleur, et je fus huit jours en prison ; après quoi je me fis correcteur d’imprimerie pour gagner de quoi retourner à pied en Hollande. Je connus la canaille écrivante, la canaille cabalante, et la canaille convulsionnaire. On dit qu’il y a des gens fort polis dans cette ville-là : je le veux croire.", "en": "“Yes, Sir, I have been in that city, and it is a place that contains the several species just described; it is a chaos, a confused multitude, where everyone seeks for pleasure without being able to find it; at least, as far as I have observed during my short stay in that city. At my arrival, I was robbed of all I had in the world by pickpockets and sharpers, at the fair of St. Germain. I was taken up myself for a robber, and confined in prison a whole week; after that I hired myself as corrector to a press in order to get a little money towards defraying my expenses back to Holland on foot. I knew the whole tribe of scribblers, malcontents, and religious convulsionaries. It is said the people of that city are very polite; I believe they may be so.”"}, {"fr": "— Pour moi, je n’ai nulle curiosité de voir la France, dit Candide ; vous devinez aisément que quand on a passé un mois dans Eldorado, on ne se soucie plus de rien voir sur la terre que Mlle Cunégonde : je vais l’attendre à Venise ; nous traverserons la France pour aller en Italie ; ne m’accompagnerez-vous pas ?", "en": "“For my part, I have no curiosity to see France,” said Candide; “you may easily conceive, my friend, that, after spending a month at El Dorado, I can desire to behold nothing upon earth but Miss Cunegund; I am going to wait for her at Venice; I intend to pass through France on my way to Italy; will you not bear me company?”"}, {"fr": "Très-volontiers, dit Martin ; on dit que Venise n’est bonne que pour les nobles vénitiens, mais que cependant on y reçoit très-bien les étrangers quand ils ont beaucoup d’argent : je n’en ai point ; vous en avez, je vous suivrai partout.", "en": "“With all my heart,” said Martin: “they say Venice is agreeable to none but noble Venetians; but that, nevertheless, strangers are well received there when they have plenty of money; now I have none, but you have, therefore I will attend you wherever you please.”"}, {"fr": "À propos, dit Candide, pensez-vous que la terre ait été originairement une mer, comme on l’assure dans ce gros livre qui appartient au capitaine du vaisseau ?", "en": "“Now we are upon this subject,” said Candide, “do you think that the earth was originally sea, as we read in that great book which belongs to the captain of the ship?”"}, {"fr": "Je n’en crois rien du tout, dit Martin, non plus que de toutes les rêveries qu’on nous débite depuis quelque temps.", "en": "“I believe nothing of it,” replied Martin, “any more than I do of the many other chimeras which have been related to us for some time past.”"}, {"fr": "Mais à quelle fin ce monde a-t-il donc été formé ? dit Candide.", "en": "“But then, to what end,” said Candide, “was the world formed?”"}, {"fr": "Pour nous faire enrager, répondit Martin.", "en": "“To make us mad,” said Martin."}, {"fr": "N’êtes-vous pas bien étonné, continua Candide, de l’amour que ces deux filles du pays des Oreillons avaient pour ces deux singes, et dont je vous ai conté l’aventure ?", "en": "“Are you not surprised,” continued Candide, “at the love which the two girls in the country of the Oreillons had for those two monkeys?—You know I have told you the story.”"}, {"fr": "Point du tout, dit Martin ; je ne vois pas ce que cette passion a d’étrange : j’ai tant vu de choses extraordinaires, qu’il n’y a plus rien d’extraordinaire pour moi.", "en": "“Surprised!” replied Martin, “not in the least; I see nothing strange in this passion. I have seen so many extraordinary things, that there is nothing extraordinary to me now.”"}, {"fr": "Croyez-vous, dit Candide, que les hommes se soient toujours mutuellement massacrés comme ils font aujourd’hui ? qu’ils aient toujours été menteurs, fourbes, perfides, ingrats, brigands, faibles, volages, lâches, envieux, gourmands, ivrognes, avares, ambitieux, sanguinaires, calomniateurs, débauchés, fanatiques, hypocrites, et sots ?", "en": "“Do you think,” said Candide, “that mankind always massacred each other as they do now? Were they always guilty of lies, fraud, treachery, ingratitude, inconstancy, envy, ambition, and cruelty? Were they always thieves, fools, cowards, gluttons, drunkards, misers, calumniators, debauchees, fanatics, and hypocrites?”"}, {"fr": "Croyez-vous, dit Martin, que les éperviers aient toujours mangé des pigeons quand ils en ont trouvé ?", "en": "“Do you believe,” said Martin, “that hawks have always been accustomed to eat pigeons when they came in their way?”"}, {"fr": "Oui, sans doute, dit Candide.", "en": "“Doubtless,” said Candide."}, {"fr": "Eh bien ! dit Martin, si les éperviers ont toujours eu le même caractère, pourquoi voulez-vous que les hommes aient changé le leur ?", "en": "“Well then,” replied Martin, “if hawks have always had the same nature, why should you pretend that mankind change theirs?”"}, {"fr": "Oh ! dit Candide, il y a bien de la différence, car le libre arbitre… » En raisonnant ainsi, ils arrivèrent à Bordeaux.", "en": "“Oh!” said Candide, “there is a great deal of difference, for free will . . .” Reasoning thus, they arrived at Bordeaux."}, {"fr": "Candide ne s’arrêta dans Bordeaux qu’autant de temps qu’il en fallait pour vendre quelques cailloux du Dorado, et pour s’accommoder d’une bonne chaise à deux places : car il ne pouvait plus se passer de son philosophe Martin ; il fut seulement très-fâché de se séparer de son mouton, qu’il laissa à l’Académie des sciences de Bordeaux, laquelle proposa pour le sujet du prix de cette année de trouver pourquoi la laine de ce mouton était rouge ; et le prix fut adjugé à un savant du Nord, qui démontra par A, plus B, moins C divisé par Z, que le mouton devait être rouge, et mourir de la clavelée.", "en": "Candide stayed no longer at Bordeaux than was necessary to dispose of a few of the pebbles he had brought from El Dorado, and to provide himself with a post-chaise for two persons, for he could no longer stir a step without his philosopher Martin. The only thing that gave him concern was the being obliged to leave his sheep behind him, which he entrusted to the care of the Academy of Sciences at Bordeaux. The academicians proposed, as a prize-subject for the year, to prove why the wool of this sheep was red; and the prize was adjudged to a northern sage, who demonstrated by A plus B, minus C, divided by Z, that the sheep must necessarily be red, and die of the rot."}, {"fr": "Cependant tous les voyageurs que Candide rencontra dans les cabarets de la route lui disaient : « Nous allons à Paris. » Cet empressement général lui donna enfin l’envie de voir cette capitale ; ce n’était pas beaucoup se détourner du chemin de Venise. Il entra par le faubourg Saint-Marceau, et crut être dans le plus vilain village de la Vestphalie.", "en": "In the meantime, all the travellers whom Candide met with in the inns, or on the road, told him to a man that they were going to Paris. This general eagerness gave him likewise a great desire to see this capital, and it was not much out of his way to Venice. He entered the city by the suburbs of St. Marceau, and thought himself in one of the vilest hamlets in all Westphalia."}, {"fr": "À peine Candide fut-il dans son auberge, qu’il fut attaqué d’une maladie légère, causée par ses fatigues. Comme il avait au doigt un diamant énorme, et qu’on avait aperçu dans son équipage une cassette prodigieusement pesante, il eut aussitôt auprès de lui deux médecins qu’il n’avait pas mandés, quelques amis intimes qui ne le quittèrent pas, et deux dévotes qui faisaient chauffer ses bouillons. Martin disait : « Je me souviens d’avoir été malade aussi à Paris dans mon premier voyage ; j’étais fort pauvre : aussi n’eus-je ni amis, ni dévotes, ni médecins, et je guéris. »", "en": "Candide had not been long at his inn before he was seized with a slight disorder owing to the fatigue he had undergone. As he wore a diamond of an enormous size on his finger, and had, among the rest of his equipage, a strong box that seemed very weighty, he soon found himself between two physicians whom he had not sent for, a number of intimate friends whom he had never seen, and who would not quit his bedside, and two female devotees who warmed his soup for him. “I remember,” said Martin to him, “that the first time I came to Paris I was likewise taken ill; I was very poor, and, accordingly, I had neither friends, nurses, nor physicians, and yet I did very well.”"}, {"fr": "Cependant, à force de médecines et de saignées, la maladie de Candide devint sérieuse. Un habitué du quartier vint avec douceur lui demander un billet payable au porteur pour l’autre monde : Candide n’en voulut rien faire ; les dévotes l’assurèrent que c’était une nouvelle mode ; Candide répondit qu’il n’était point homme à la mode. Martin voulut jeter l’habitué par les fenêtres. Le clerc jura qu’on n’enterrerait point Candide. Martin jura qu’il enterrerait le clerc s’il continuait à les importuner. La querelle s’échauffa : Martin le prit par les épaules, et le chassa rudement ; ce qui causa un grand scandale, dont on fit un procès-verbal.", "en": "However, by dint of purging and bleeding Candide’s disorder became very serious. The priest of the parish came with all imaginable politeness to desire a note of him, payable to the bearer in the other world. Candide refused to comply with his request; but the two devotees assured him that it was a new fashion. Candide replied that he was not one that followed the fashion. Martin was for throwing the priest out of the window. The clerk swore Candide should not have Christian burial. Martin swore in his turn that he would bury the clerk alive, if he continued to plague them any longer. The dispute grew warm; Martin took him by the shoulders, and turned him out of the room, which gave great scandal, and occasioned a lawsuit."}, {"fr": "Candide guérit ; et pendant sa convalescence il eut très-bonne compagnie à souper chez lui. On jouait gros jeu. Candide était tout étonné que jamais les as ne lui vinssent ; et Martin ne s’en étonnait pas.", "en": "Candide recovered; and, till he was in a condition to go abroad, had a great deal of very good company to pass the evenings with him in his chamber. They played deep. Candide was surprised to find he could never turn a trick; and Martin was not at all surprised at the matter."}, {"fr": "Parmi ceux qui lui faisaient les honneurs de la ville, il y avait un petit abbé périgourdin, l’un de ces gens empressés, toujours alertes, toujours serviables, effrontés, caressants, accommodants, qui guettent les étrangers à leur passage, leur content l’histoire scandaleuse de la ville, et leur offrent des plaisirs à tout prix. Celui-ci mena d’abord Candide et Martin à la comédie. On y jouait une tragédie nouvelle. Candide se trouva placé auprès de quelques beaux esprits. Cela ne l’empêcha pas de pleurer à des scènes jouées parfaitement. Un des raisonneurs qui étaient à ses côtés lui dit dans un entr’acte : « Vous avez grand tort de pleurer, cette actrice est fort mauvaise ; l’acteur qui joue avec elle est plus mauvais acteur encore ; la pièce est encore plus mauvaise que les acteurs ; l’auteur ne sait pas un mot d’arabe, et cependant la scène est en Arabie ; et, de plus, c’est un homme qui ne croit pas aux idées innées ; je vous apporterai demain vingt brochures contre lui.", "en": "Among those who did him the honours of the place, was a little spruce Abbé from Périgord, one of those insinuating, busy, fawning, impudent, accommodating fellows, that lie in wait for strangers at their arrival, tell them all the scandal of the town, and offer to minister to their pleasures at various prices. This man conducted Candide and Martin to the playhouse: they were acting a new tragedy. Candide found himself placed near a cluster of wits: this, however, did not prevent him from shedding tears at some scenes which were perfectly acted. One of these talkers said to him between the acts: “You are greatly to blame in shedding tears; that actress plays horribly, and the man that plays with her still worse, and the piece itself is still more execrable than the representation. The author does not understand a word of Arabia, and yet he has laid his scene in Arabia; and what is more, he is a fellow who does not believe in innate ideas. To-morrow I will bring you a score of pamphlets that have been written against him.”"}, {"fr": "Monsieur, combien avez-vous de pièces de théâtre en France ? » dit Candide à l’abbé ; lequel répondit : « Cinq ou six mille.", "en": "“Pray, Sir,” said Candide to the Abbé, “how many theatrical pieces have you in France?” “Five or six thousand,” replied the other."}, {"fr": "C’est beaucoup, dit Candide ; combien y en a-t-il de bonnes ?", "en": "“Indeed! that is a great number,” said Candide: “but how many good ones may there be?”"}, {"fr": "Quinze ou seize, répliqua l’autre.", "en": "“About fifteen or sixteen.”"}, {"fr": "C’est beaucoup, » dit Martin.", "en": "“Oh! that is a great number,” said Martin."}, {"fr": "Candide fut très-content d’une actrice qui faisait la reine Élisabeth, dans une assez plate tragédie, que l’on joue quelquefois. « Cette actrice, dit-il à Martin, me plaît beaucoup ; elle a un faux air de Mlle Cunégonde ; je serais bien aise de la saluer. » L’abbé périgourdin s’offrit à l’introduire chez elle. Candide, élevé en Allemagne, demanda quelle était l’étiquette, et comment on traitait en France les reines d’Angleterre. « Il faut distinguer, dit l’abbé ; en province, on les mène au cabaret ; à Paris, on les respecte quand elles sont belles, et on les jette à la voirie quand elles sont mortes.", "en": "Candide was greatly taken with an actress who performed the part of Queen Elizabeth in a dull kind of tragedy that is played sometimes. “That actress,” said he to Martin, “pleases me greatly; she has some sort of resemblance to Miss Cunegund. I should be very glad to pay my respects to her.” The Abbé of Périgord offered his services to introduce him to her at her own house. Candide, who was brought up in Germany, desired to know what might be the ceremonial used on those occasions, and how a Queen of England was treated in France. “There is a necessary distinction to be observed in these matters,” said the Abbé. “In a country town we take them to a tavern; here in Paris, they are treated with great respect during their lifetime, provided they are handsome, and when they die, we throw their bodies upon a dunghill.”"}, {"fr": "Des reines à la voirie ! dit Candide.", "en": "“How,” said Candide, “throw a queen’s body upon a dunghill!”"}, {"fr": "Oui vraiment, dit Martin ; monsieur l’abbé a raison : j’étais à Paris quand Mlle Monime passa, comme on dit, de cette vie à l’autre ; on lui refusa ce que ces gens-ci appellent les honneurs de la sépulture, c’est-à-dire de pourrir avec tous les gueux du quartier dans un vilain cimetière ; elle fut enterrée toute seule de sa bande au coin de la rue de Bourgogne ; ce qui dut lui faire une peine extrême, car elle pensait très-noblement.", "en": "“The gentleman is quite right,” said Martin; “he tells you nothing but the truth. I happened to be in Paris when Mlle. Monime made her exit, as one may say, out of this world into another. She was refused what they call here the rights of sepulture; that is to say, she was denied the privilege of rotting in a churchyard by the side of all the beggars in the parish. She was buried alone by her troupe at the corner of Burgundy Street, which must certainly have shocked her extremely, as she had very exalted notions of things.”"}, {"fr": "Cela est bien impoli, dit Candide.", "en": "“This is acting very impolitely,” said Candide."}, {"fr": "Que voulez-vous ? dit Martin ; ces gens-ci sont ainsi faits. Imaginez toutes les contradictions, toutes les incompatibilités possibles, vous les verrez dans le gouvernement, dans les tribunaux, dans les églises, dans les spectacles de cette drôle de nation.", "en": "“Lord!” said Martin, “what can be said to it? It is the way of these people. Figure to yourself all the contradictions, all the inconsistencies possible, and you may meet with them in the government, the courts of justice, the churches, and the public spectacles of this odd nation.”"}, {"fr": "Est-il vrai qu’on rit toujours à Paris ? dit Candide.", "en": "“Is it true,” said Candide, “that the people of Paris are always laughing?”"}, {"fr": "Oui, dit l’abbé ; mais c’est en enrageant : car on s’y plaint de tout avec de grands éclats de rire ; même on y fait en riant les actions les plus détestables.", "en": "“Yes,” replied the Abbé, “but it is with anger in their hearts; they express all their complaints by loud bursts of laughter, and commit the most detestable crimes with a smile on their faces.”"}, {"fr": "— Quel est, dit Candide, ce gros cochon qui me disait tant de mal de la pièce où j’ai tant pleuré, et des acteurs qui m’ont fait tant de plaisir ?", "en": "“Who was that great overgrown beast,” said Candide, “who spoke so ill to me of the piece with which I was so much affected, and of the players who gave me so much pleasure?”"}, {"fr": "C’est un mal-vivant, répondit l’abbé, qui gagne sa vie à dire du mal de toutes les pièces et de tous les livres ; il hait quiconque réussit, comme les eunuques haïssent les jouissants ; c’est un de ces serpents de la littérature qui se nourrissent de fange et de venin ; c’est un folliculaire.", "en": "“A good-for-nothing sort of a man,” answered the Abbé, “one who gets his livelihood by abusing every new book and play; he abominates to see anyone meet with success, like eunuchs, who detest every one that possesses those powers they are deprived of; he is one of those vipers in literature who nourish themselves with their own venom; a pamphlet-monger.”"}, {"fr": "Qu’appelez-vous folliculaire ? dit Candide.", "en": "“A pamphlet-monger!” said Candide, “what is that?”"}, {"fr": "C’est, dit l’abbé, un faiseur de feuilles, un Fréron. »", "en": "“Why, a pamphlet-monger,” replied the Abbé, “is a writer of pamphlets, a Fréron.”"}, {"fr": "C’est ainsi que Candide, Martin, et le Périgourdin, raisonnaient sur l’escalier, en voyant défiler le monde au sortir de la pièce. « Quoique je sois très-empressé de revoir Mlle Cunégonde, dit Candide, je voudrais pourtant souper avec Mlle Clairon, car elle m’a paru admirable. »", "en": "Candide, Martin, and the Abbé of Périgord argued thus on the staircase, while they stood to see people go out of the playhouse. “Though I am very earnest to see Miss Cunegund again,” said Candide, “yet I have a great inclination to sup with Mlle. Clairon, for I am really much taken with her.”"}, {"fr": "L’abbé n’était pas homme à approcher de Mlle Clairon, qui ne voyait que bonne compagnie. « Elle est engagée pour ce soir, dit-il ; mais j’aurai l’honneur de vous mener chez une dame de qualité, et là vous connaîtrez Paris comme si vous y aviez été quatre ans. »", "en": "The Abbé was not a person to show his face at this lady’s house, which was frequented by none but the best company. “She is engaged this evening,” said he; “but I will do myself the honour of introducing you to a lady of quality of my acquaintance, at whose house you will see as much of the manners of Paris as if you had lived here for four years.”"}, {"fr": "Candide, qui était naturellement curieux, se laissa mener chez la dame, au fond du faubourg Saint-Honoré ; on y était occupé d’un pharaon ; douze tristes pontes tenaient chacun en main un petit livre de cartes, registre cornu de leurs infortunes. Un profond silence régnait, la pâleur était sur le front des pontes, l’inquiétude sur celui du banquier ; et la dame du logis, assise auprès de ce banquier impitoyable, remarquait avec des yeux de lynx tous les parolis, tous les sept-et-le-va de campagne, dont chaque joueur cornait ses cartes ; elle les faisait décorner avec une attention sévère, mais polie, et ne se fâchait point, de peur de perdre ses pratiques. La dame se faisait appeler la marquise de Parolignac. Sa fille, âgée de quinze ans, était au nombre des pontes, et avertissait d’un clin d’œil des friponneries de ces pauvres gens qui tâchaient de réparer les cruautés du sort. L’abbé périgourdin, Candide, et Martin, entrèrent ; personne ne se leva, ni les salua, ni les regarda ; tous étaient profondément occupés de leurs cartes. « Mme la baronne de Thunder-ten-tronckh était plus civile, » dit Candide.", "en": "Candide, who was naturally curious, suffered himself to be conducted to this lady’s house, which was in the suburb of St. Honoré. The company were engaged at faro; twelve melancholy punters held each in his hand a small pack of cards, the corners of which doubled down were so many registers of their ill fortune. A profound silence reigned throughout the assembly, a pallid dread was in the countenances of the punters, and restless anxiety in the face of him who kept the bank; and the lady of the house, who was seated next to him, observed pitilessly with lynx’s eyes every parole, and sept-et-le-va as they were going, as likewise those who tallied, and made them undouble their cards with a severe exactness, though mixed with a politeness which she thought necessary not to frighten away her customers. This lady assumed the title of Marchioness of Parolignac. Her daughter, a girl of about fifteen years of age, was one of the punters, and took care to give her mamma an item, by signs, when any one of them attempted to repair the rigour of their ill fortune by a little innocent deception. The company were thus occupied when Candide, Martin, and the Abbé made their entrance: not a creature rose to salute them, or indeed took the least notice of them, being wholly intent upon the business in hand. “Ah!’ said Candide, “my lady Baroness of Thunder-ten-tronckh would have behaved more civilly.”"}, {"fr": "Cependant l’abbé s’approcha de l’oreille de la marquise, qui se leva à moitié, honora Candide d’un sourire gracieux, et Martin d’un air de tête tout-à-fait noble ; elle fit donner un siège et un jeu de cartes à Candide, qui perdit cinquante mille francs en deux tailles : après quoi on soupa très-gaiement ; et tout le monde était étonné que Candide ne fût pas ému de sa perte ; les laquais disaient entre eux, dans leur langage de laquais : « Il faut que ce soit quelque milord anglais. »", "en": "However, the Abbé whispered in the ear of the marchioness, who half rose, and honoured Candide with a gracious smile and Martin with a dignified inclination of her head. She then ordered a seat for Candide and a hand of cards. He lost fifty thousand francs in two rounds. After that, they supped very elegantly, and every one was astounded that Candide was not disturbed at his loss. The servants said to each other in their servants’ language: “This must be some English lord!”"}, {"fr": "Le souper fut comme la plupart des soupers de Paris, d’abord du silence, ensuite un bruit de paroles qu’on ne distingue point, puis des plaisanteries dont la plupart sont insipides, de fausses nouvelles, de mauvais raisonnements, un peu de politique, et beaucoup de médisance : on parla même de livres nouveaux. « Avez-vous vu, dit l’abbé périgourdin, le roman du sieur Gauchat, docteur en théologie ?", "en": "Supper was like most others of this kind in Paris; at first there was silence, then there was an indistinguishable babel of words, then jokes, most of them insipid, false reports, bad reasonings, a little political talk, and much scandal. They spoke also of new books."}, {"fr": "Oui, répondit un des convives ; mais je n’ai pu l’achever. Nous avons une foule d’écrits impertinents ; mais tous ensemble n’approchent pas de l’impertinence de Gauchat, docteur en théologie ; je suis si rassasié de cette immensité de détestables livres qui nous inondent que je me suis mis à ponter au pharaon.", "en": "“Have you seen,” said the Abbé of Périgord, “the romance written by Monsieur Gauchat, the doctor of theology?” “Yes,” replied one of the guests, “but I had not the patience to go through it. We have a throng of impertinent writers, but all of them together do not approach Gauchat, the doctor of theology, in impertinence. I am so sated with reading these piles of vile stuff that flood upon us that I even resolved to come here and make a party at faro.”"}, {"fr": "Et les Mélanges de l’archidiacre Trublet, qu’en dites-vous ? dit l’abbé.", "en": "“But what say you to Archdeacon Trublet’s miscellanies?” said the Abbé."}, {"fr": "Ah ! dit Mme de Parolignac, l’ennuyeux mortel ! comme il vous dit curieusement ce que tout le monde sait ! comme il discute pesamment ce qui ne vaut pas la peine d’être remarqué légèrement ! comme il s’approprie, sans esprit, l’esprit des autres ! comme il gâte ce qu’il pille ! comme il me dégoûte ! mais il ne me dégoûtera plus ; c’est assez d’avoir lu quelques pages de l’archidiacre. »", "en": "“Oh,” cried the Marchioness of Parolignac, “tedious creature. What pains he is at to tell one things that all the world knows. How he labours an argument that is hardly worth the slightest consideration! How absurdly he makes use of other people’s wit! How he mangles what he pilfers from them! How he disgusts me! But he will disgust me no more. It is enough to have read a few pages of the Archdeacon.”"}, {"fr": "Il y avait à table un homme savant et de goût qui appuya ce que disait la marquise. On parla ensuite de tragédies ; la dame demanda pourquoi il y avait des tragédies qu’on jouait quelquefois, et qu’on ne pouvait lire. L’homme de goût expliqua très-bien comment une pièce pouvait avoir quelque intérêt, et n’avoir presque aucun mérite ; il prouva en peu de mots que ce n’était pas assez d’amener une ou deux de ces situations qu’on trouve dans tous les romans, et qui séduisent toujours les spectateurs ; mais qu’il faut être neuf sans être bizarre, souvent sublime et toujours naturel, connaître le cœur humain et le faire parler ; être grand poëte, sans que jamais aucun personnage de la pièce paraisse poëte ; savoir parfaitement sa langue, la parler avec pureté, avec une harmonie continue, sans que jamais la rime coûte rien au sens. « Quiconque, ajouta-t-il, n’observe pas toutes ces règles peut faire une ou deux tragédies applaudies au théâtre, mais il ne sera jamais compté au rang des bons écrivains ; il y a très-peu de bonnes tragédies : les unes sont des idylles en dialogues bien écrits et bien rimés ; les autres, des raisonnements politiques qui endorment, ou des amplifications qui rebutent ; les autres, des rêves d’énergumène, en style barbare, des propos interrompus, de longues apostrophes aux dieux, parce qu’on ne sait point parler aux hommes, des maximes fausses, des lieux communs ampoulés. »", "en": "There was at the table a person of learning and taste, who supported what the Marchioness had advanced. They next began to talk of tragedies. The lady desired to know how it came about that there were several tragedies which still continued to be played, but which were unreadable. The man of taste explained very clearly how a piece may be in some manner interesting, without having a grain of merit. He showed, in a few words, that it is not sufficient to throw together a few incidents that are to be met with in every romance, and that dazzle the spectator; the thoughts should be new without being far-fetched; frequently sublime, but always natural; the author should have a thorough knowledge of the human heart and make it speak properly. He should be a complete poet, without showing an affectation of it in any of the characters of his piece; he should be a perfect master of his language, speak it with all its purity, and with the utmost harmony, and yet not so as to make the sense a slave to the rhyme. “Whoever,” added he, “neglects any of these rules, though he may write two or three tragedies with tolerable success, will never be reckoned in the number of good authors. There are a few good tragedies, some are idylls, in well-written and harmonious dialogue, and others a chain of political reasonings that send one to sleep, or else pompous and high-flown amplifications that disgust rather than please. Others again are the ravings of a madman, in an uncouth style, with unmeaning flights, or long apostrophes, to the deities, for want of knowing how to address mankind; in a word, a collection of false maxims and dull commonplaces.”"}, {"fr": "Candide écouta ce propos avec attention, et conçut une grande idée du discoureur ; et, comme la marquise avait eu soin de le placer à côté d’elle, il s’approcha de son oreille, et prit la liberté de lui demander qui était cet homme qui parlait si bien. « C’est un savant, dit la dame, qui ne ponte point, et que l’abbé m’amène quelquefois à souper : il se connaît parfaitement en tragédies et en livres, et il a fait une tragédie sifflée, et un livre dont on n’a jamais vu hors de la boutique de son libraire qu’un exemplaire qu’il m’a dédié.", "en": "Candide listened to this discourse with great attention, and conceived a high opinion for the person who delivered it; and as the Marchioness had taken care to place him at her side, he took the liberty to whisper softly in her ear and ask who this person was who spoke so well. “It is a man of letters,” replied her ladyship, “who never plays and whom the Abbé brings with him to my house sometimes to spend an evening. He is a great judge of writing, especially in tragedy; he has composed one himself which was damned, and has written a book which was never seen out of his bookseller’s shop, excepting only one copy, which he sent me with a dedication.”"}, {"fr": "Le grand homme ! dit Candide, c’est un autre Pangloss. »", "en": "“What a great man,” cried Candide, “he is a second Pangloss.”"}, {"fr": "Alors se tournant vers lui, il lui dit : « Monsieur, vous pensez, sans doute, que tout est au mieux dans le monde physique et dans le moral, et que rien ne pouvait être autrement ?", "en": "Then, turning towards him, “Sir,” said he, “you are doubtless of opinion that everything is for the best in the physical and moral world and that nothing could be otherwise than it is?”"}, {"fr": "Moi, monsieur, lui répondit le savant, je ne pense rien de tout cela : je trouve que tout va de travers chez nous ; que personne ne sait ni quel est son rang, ni quelle est sa charge, ni ce qu’il fait, ni ce qu’il doit faire, et qu’excepté le souper, qui est assez gai, et où il paraît assez d’union, tout le reste du temps se passe en querelles impertinentes : jansénistes contre molinistes, gens du parlement contre gens d’église, gens de lettres contre gens de lettres, courtisans contre courtisans, financiers contre le peuple, femmes contre maris, parents contre parents ; c’est une guerre éternelle. »", "en": "“I, Sir,” replied the man of letters, ‘‘I think no such thing, I assure you. I find that all in this world is set the wrong end uppermost. No one knows what is his rank, his office, nor what he does, nor what he should do; and that except for our evenings which we generally pass tolerably merrily, the rest of our time is spent in idle disputes and quarrels, Jansenists against Molinists, the Parliament against the Church, men of letters against men of letters, countries against countries, financiers against the people, wives against husbands, relations against relations. In short, there is eternal warfare.”"}, {"fr": "Candide lui répliqua : « J’ai vu pis : mais un sage, qui depuis a eu le malheur d’être pendu, m’apprit que tout cela est à merveille : ce sont des ombres à un beau tableau.", "en": "“Yes,” said Candide, “and I have seen worse than all that; and yet a learned man, who had the misfortune to be hanged, taught me that everything was marvellously well, and that these evils you are speaking of were only so many shadows in a beautiful picture.”"}, {"fr": "Votre pendu se moquait du monde, dit Martin ; vos ombres sont des taches horribles.", "en": "“Your hempen sage,” said Martin, “laughed at you. These shadows as you call them are most horrible blemishes.”"}, {"fr": "Ce sont les hommes qui font les taches, dit Candide, et ils ne peuvent pas s’en dispenser.", "en": "“It is men who make these blemishes,” rejoined Candide, “and they cannot do otherwise.”"}, {"fr": "Ce n’est donc pas leur faute, dit Martin. » La plupart des pontes, qui n’entendaient rien à ce langage, buvaient ; et Martin raisonna avec le savant, et Candide raconta une partie de ses aventures à la dame du logis.", "en": "“Then it is not their fault,” added Martin. The greater part of the gamesters, who did not understand a syllable of this discourse, continued to drink, while Martin reasoned with the learned gentleman, and Candide recounted some of his adventures to the lady of the house."}, {"fr": "Après souper, la marquise mena Candide dans son cabinet, et le fit asseoir sur un canapé. « Eh bien ! lui dit-elle, vous aimez donc toujours éperdument Mlle Cunégonde de Thunder-ten-tronckh ?", "en": "After supper, the Marchioness conducted Candide into her dressing-room, and made him sit down on a sofa. “Well,” said she, “are you still so violently fond of Miss Cunegund of Thunder-ten-tronckh?”"}, {"fr": "Oui, madame, » répondit Candide. La marquise lui répliqua avec un souris tendre : « Vous me répondez comme un jeune homme de Vestphalie ; un Français m’aurait dit : Il est vrai que j’ai aimé Mlle Cunégonde ; mais, en vous voyant, madame, je crains de ne la plus aimer.", "en": "“Yes, Madam,” replied Candide. The Marchioness said to him with a tender smile, “You answer like a young man from Westphalia. A Frenchman would have said, ‘It is true, Madam, I had a great passion for Miss Cunegund, but since I have seen you, I fear I can no longer love her as I did.’ ”"}, {"fr": "Hélas ! madame, dit Candide, je répondrai comme vous voudrez.", "en": "“Alas! Madam,” replied Candide, “I’ll make you what answer you please.”"}, {"fr": "Votre passion pour elle, dit la marquise, a commencé en ramassant son mouchoir ; je veux que vous ramassiez ma jarretière.", "en": "“You fell in love with her, I find, in picking up her handkerchief. You shall pick up my garter.”"}, {"fr": "De tout mon cœur », dit Candide ; et il la ramassa. « Mais je veux que vous me la remettiez », dit la dame ; et Candide la lui remit. « Voyez-vous, dit la dame, vous êtes étranger : je fais quelquefois languir mes amants de Paris quinze jours, mais je me rends à vous dès la première nuit, parce qu’il faut faire les honneurs de son pays à un jeune homme de Vestphalie. » La belle, ayant aperçu deux énormes diamants aux deux mains de son jeune étranger, les loua de si bonne foi que des doigts de Candide ils passèrent aux doigts de la marquise.", "en": "“With all my heart,” said Candide. “But you must tie it on,” said the lady; and Candide tied it on. “Look you,” said the lady, “you are a stranger. I make some of my lovers here in Paris languish for me a fortnight, but I surrender to you the first night, because I am willing to do the honours of my country to a young Westphalian.” The fair one having cast her eye on two large diamonds on the young stranger’s finger, praised them in so earnest a manner that they passed from Candide’s fingers to those of the marchioness."}, {"fr": "Candide, en s’en retournant avec son abbé périgourdin, sentit quelques remords d’avoir fait une infidélité à Mlle Cunégonde. M. l’abbé entra dans sa peine ; il n’avait qu’une légère part aux cinquante mille livres perdues au jeu par Candide, et à la valeur des deux brillants moitié donnés, moitié extorqués. Son dessein était de profiter, autant qu’il le pourrait, des avantages que la connaissance de Candide pouvait lui procurer. Il lui parla beaucoup de Cunégonde ; et Candide lui dit qu’il demanderait bien pardon à cette belle de son infidélité, quand il la verrait à Venise.", "en": "As Candide was going home with the Abbé, he felt some qualms of conscience for having been guilty of infidelity to Miss Cunegund. The Abbé shared with him in his uneasiness; he had but an inconsiderable share in the fifty thousand francs that Candide had lost at play, and in the value of the two jewels, half given, half extorted from him. His plan was to profit as much as he could from the advantages which his acquaintance with Candide could procure for him. He spoke to him much of Miss Cunegund, and Candide assured him that he would heartily ask pardon of that fair one for his infidelity to her, when he saw her at Venice."}, {"fr": "Le Périgourdin redoublait de politesses et d’attentions, et prenait un intérêt tendre à tout ce que Candide disait, à tout ce qu’il faisait, à tout ce qu’il voulait faire.", "en": "The Abbé redoubled his civilities and seemed to interest himself warmly in everything that Candide said, did, or seemed inclined to do."}, {"fr": "« Vous avez donc, monsieur, lui dit-il, un rendez-vous à Venise ?", "en": "“And so, Sir, you have a rendez-vous at Venice?”"}, {"fr": "Oui, monsieur l’abbé, dit Candide ; il faut absolument que j’aille trouver Mlle Cunégonde. » Alors, engagé par le plaisir de parler de ce qu’il aimait, il conta, selon son usage, une partie de ses aventures avec cette illustre Vestphalienne.", "en": "“Yes, Monsieur l’Abbé,” answered Candide. “I must indeed go and find Miss Cunegund.” Then the pleasure he took in talking about the object he loved led him insensibly to relate, according to custom, part of his adventures with the illustrious Westphalian beauty."}, {"fr": "« Je crois, dit l’abbé, que Mlle Cunégonde a bien de l’esprit, et qu’elle écrit des lettres charmantes.", "en": "“I fancy,” said the Abbé, “Miss Cunegund has a great deal of wit, and that her letters must be very entertaining.”"}, {"fr": "Je n’en ai jamais reçu, dit Candide ; car, figurez-vous qu’ayant été chassé du château pour l’amour d’elle, je ne pus lui écrire ; que bientôt après j’appris qu’elle était morte, qu’ensuite je la retrouvai, et que je la perdis, et que je lui ai envoyé à deux mille cinq cents lieues d’ici un exprès dont j’attends la réponse. »", "en": "“I never received any from her,” said Candide, “for you are to consider that being kicked out of the castle on her account, I could not write to her; especially as, soon after my departure, I heard she was dead; that though I found her again, I lost her, and that I have sent a messenger to her two thousand five hundred leagues from here, and I wait here for his return with an answer from her.”"}, {"fr": "L’abbé écoutait attentivement, et paraissait un peu rêveur. Il prit bientôt congé des deux étrangers, après les avoir tendrement embrassés. Le lendemain Candide reçut à son réveil une lettre conçue en ces termes :", "en": "The Abbé listened attentively—and seemed a little thoughtful. He soon took leave of the two strangers, after having embraced them tenderly. The next day, immediately on waking, Candide received a letter couched in these terms:"}, {"fr": "« Monsieur mon très-cher amant, il y a huit jours que je suis malade en cette ville ; j’apprends que vous y êtes. Je volerais dans vos bras si je pouvais remuer. J’ai su votre passage à Bordeaux ; j’y ai laissé le fidèle Cacambo et la vieille, qui doivent bientôt me suivre. Le gouverneur de Buénos-Ayres a tout pris, mais il me reste votre cœur. Venez ; votre présence me rendra la vie ou me fera mourir de plaisir. »", "en": "“My dearest lover, I have been ill in this city these eight days. I have heard of your arrival and should fly to your arms, were I able to move a limb of me. I was informed of your procedure at Bordeaux. I left there the faithful Cacambo and the old woman who will soon follow me. The Governor of Buenos Ayres has taken everything from me; but I still have your heart. Come. Your presence will restore me to life or will make me die with pleasure.”"}, {"fr": "Cette lettre charmante, cette lettre inespérée, transporta Candide d’une joie inexprimable ; et la maladie de sa chère Cunégonde l’accabla de douleur. Partagé entre ces deux sentiments, il prend son or et ses diamants, et se fait conduire avec Martin à l’hôtel où Mlle Cunégonde demeurait. Il entre en tremblant d’émotion, son cœur palpite, sa voix sanglote ; il veut ouvrir les rideaux du lit ; il veut faire apporter de la lumière. « Gardez-vous-en bien, lui dit la suivante ; la lumière la tue » ; et soudain elle referme le rideau. « Ma chère Cunégonde, dit Candide en pleurant, comment vous portez-vous ? si vous ne pouvez me voir, parlez-moi du moins.", "en": "At the receipt of this charming, this unexpected letter, Candide felt the utmost joy, though the malady of his beloved Cunegund overwhelmed him with grief. Distracted between these two passions, he took his gold and his diamonds and procured a person to direct him with Martin to the house where Miss Cunegund lodged. He entered, trembling with emotion, his heart flut- tered, his tongue faltered. He attempted to draw the curtain apart, and called for a light to the bedside. “Take care,” said the servant, “the light is unbearable to her”; and immediately she closed the curtains again. “My beloved,” said Candide, weeping, “how are you? If you cannot see me, at least speak to me.”"}, {"fr": "Elle ne peut parler, dit la suivante. » La dame alors tire du lit une main potelée que Candide arrose longtemps de ses larmes, et qu’il remplit ensuite de diamants, en laissant un sac plein d’or sur le fauteuil.", "en": "“She cannot speak,” said the servant. The lady then put from the bed a plump hand which Candide bathed with his tears; then filled with diamonds, leaving a purse full of gold on the arm-chair."}, {"fr": "Au milieu de ses transports arrive un exempt suivi de l’abbé périgourdin et d’une escouade. « Voilà donc, dit-il, ces deux étrangers suspects ? » Il les fait incontinent saisir, et ordonne à ses braves de les traîner en prison. « Ce n’est pas ainsi qu’on traite les voyageurs dans Eldorado, dit Candide.", "en": "In the midst of his transports there arrived an officer, followed by the Abbé of Périgord and a file of musketeers. “There,” said he, “are the two suspected foreigners.” He had them seized forthwith and bade the soldiers carry them off to prison. “Travellers are not treated in this manner in El Dorado,” said Candide."}, {"fr": "Je suis plus manichéen que jamais, dit Martin.", "en": "“I am more of a Manichæan now than ever,” said Martin."}, {"fr": "Mais, monsieur, où nous menez-vous ? dit Candide.", "en": "“But pray, good Sir, where are you taking us?” asked Candide."}, {"fr": "Dans un cul de basse-fosse », dit l’exempt.", "en": "“To a dungeon,” said the officer."}, {"fr": "Martin, ayant repris son sang-froid, jugea que la dame qui se prétendait Cunégonde était une friponne, monsieur l’abbé périgourdin un fripon qui avait abusé au plus vite de l’innocence de Candide, et l’exempt un autre fripon dont on pouvait aisément se débarrasser.", "en": "Martin having recovered his calm judged that the lady who pretended to be Cunegund was a cheat, that the Abbé of Périgord was a sharper, who had imposed upon Candide’s simplicity so quickly as he could, and the officer another knave whom they might easily get rid of."}, {"fr": "Plutôt que de s’exposer aux procédures de la justice, Candide, éclairé par son conseil, et d’ailleurs toujours impatient de revoir la véritable Cunégonde, propose à l’exempt trois petits diamants d’environ trois mille pistoles chacun. « Ah ! monsieur, lui dit l’homme au bâton d’ivoire, eussiez-vous commis tous les crimes imaginables, vous êtes le plus honnête homme du monde. Trois diamants ! chacun de trois mille pistoles ! Monsieur ! je me ferais tuer pour vous, au lieu de vous mener dans un cachot. On arrête tous les étrangers, mais laissez-moi faire ; j’ai un frère à Dieppe en Normandie ; je vais vous y mener ; et si vous avez quelque diamant à lui donner, il aura soin de vous comme moi-même.", "en": "Candide, following the advice of his friend Martin, and burning with impatience to see the real Cunegund, rather than be obliged to appear at a court of justice, proposed to the officer to make him a present of three small diamonds, each of them worth three thousand pistoles. “Ah, Sir,” said this understrapper of justice, “had you committed ever so much villainy, this would render you the honestest man living in my eyes. Three diamonds, worth three thousand pistoles. Why, my dear Sir, so far from leading you to jail, I would lose my life to serve you. There are orders to arrest all strangers, but leave it to me. I have a brother at Dieppe in Normandy. I myself will conduct you thither, and if you have a diamond left to give him, he will take as much care of you as I myself should.”"}, {"fr": "Et pourquoi arrête-t-on tous les étrangers ? » dit Candide.", "en": "“But why,” said Candide, “do they arrest all strangers?”"}, {"fr": "L’abbé périgourdin prit alors la parole, et dit : « C’est parce qu’un gueux du pays d’Atrébatie a entendu dire des sottises ; cela seul lui a fait commettre un parricide, non pas tel que celui de 1610 au mois de mai, mais tel que celui de 1594 au mois de décembre, et tel que plusieurs autres commis dans d’autres années et dans d’autres mois par d’autres gueux qui avaient entendu dire des sottises. »", "en": "The Abbé of Périgord answered that it was because a poor devil of the province of Atrébatie heard somebody tell foolish stories, and this induced him to commit a parricide; not such a one as that in the month of May, 1610, but such as that in the month of December in the year 1594, and such as many that have been perpetrated in other months and years by other poor devils who had heard foolish stories. The officer then explained to them what the Abbé meant."}, {"fr": "L’exempt alors expliqua de quoi il s’agissait. « Ah ! les monstres ! s’écria Candide ; quoi ! de telles horreurs chez un peuple qui danse et qui chante ! Ne pourrai-je sortir au plus vite de ce pays où des singes agacent des tigres ? J’ai vu des ours dans mon pays ; je n’ai vu des hommes que dans le Dorado. Au nom de Dieu, monsieur l’exempt, menez-moi à Venise, où je dois attendre Mlle Cunégonde.", "en": "“Monsters,” exclaimed Candide. “Is it possible that such horrors should pass among a people who are continually singing and dancing? Is there no immediate means of flying this abominable country, where monkeys provoke tigers? I have seen bears in my country, but men I have beheld nowhere but in El Dorado. In the name of God, Sir,” said he to the officer, “do me the kindness to conduct me to Venice, where I am to wait upon Miss Cunegund.”"}, {"fr": "Je ne peux vous mener qu’en Basse-Normandie, dit le barigel. » Aussitôt il lui fait ôter ses fers, dit qu’il s’est mépris, renvoie ses gens, emmène à Dieppe Candide et Martin, et les laisse entre les mains de son frère. Il y avait un petit vaisseau hollandais à la rade. Le Normand, à l’aide de trois autres diamants, devenu le plus serviable des hommes, embarque Candide et ses gens dans le vaisseau qui allait faire voile pour Portsmouth en Angleterre. Ce n’était pas le chemin de Venise ; mais Candide croyait être délivré de l’enfer ; et il comptait bien reprendre la route de Venise à la première occasion.", "en": "“I cannot conduct you further than Lower Normandy,” said the officer. So saying, he ordered Candide’s irons to be struck off and sent his followers about their business, after which he conducted Candide and Martin to Dieppe, and left them to the care of his brother. There happened just then to be a small Dutch ship in the roads. The Norman, whom the other three diamonds had converted into the most obliging, serviceable being that ever breathed, took care to see Candide and his attendants safe on board the vessel, that was just ready to sail for Portsmouth in England. This was not the nearest way to Venice indeed; but Candide thought himself escaped out of hell, and did not in the least doubt but he should quickly find an opportunity of resuming his voyage to Venice."}, {"fr": "« Ah ! Pangloss ! Pangloss ! Ah ! Martin ! Martin ! Ah ! ma chère Cunégonde ! qu’est-ce que ce monde-ci ? disait Candide sur le vaisseau hollandais.", "en": "“Ah Pangloss! Pangloss! Ah, Martin! Martin! Ah, my dear Miss Cunegund! What sort of a world is this?” Thus exclaimed Candide, as soon as he had got on board the Dutch ship."}, {"fr": "Quelque chose de bien fou et de bien abominable, répondait Martin.", "en": "“Why, something very foolish, and very abominable,” said Martin."}, {"fr": "Vous connaissez l’Angleterre ; y est-on aussi fou qu’en France ?", "en": "“You are acquainted with England,” said Candide; “are they as great fools in that country, as in France?”"}, {"fr": "C’est une autre espèce de folie, dit Martin. Vous savez que ces deux nations sont en guerre pour quelques arpents de neige vers le Canada, et qu’elles dépensent pour cette belle guerre beaucoup plus que tout le Canada ne vaut. De vous dire précisément s’il y a plus de gens à lier dans un pays que dans un autre, c’est ce que mes faibles lumières ne me permettent pas ; je sais seulement qu’en général les gens que nous allons voir sont fort atrabilaires. »", "en": "“Yes, but in a different manner,” answered Martin. “You know that these two nations are at war about a few acres of snow in the neighbourhood of Canada, and that they have expended much greater sums in the contest than all Canada is worth. To say exactly whether there are a greater number fit to be inhabitants of a mad-house in the one country than the other, exceeds the limits of my imperfect capacity; I know, in general, that the people we are going to visit, are of a very dark and gloomy disposition.”"}, {"fr": "En causant ainsi ils abordèrent à Portsmouth ; une multitude de peuple couvrait le rivage, et regardait attentivement un assez gros homme qui était à genoux, les yeux bandés, sur le tillac d’un des vaisseaux de la flotte ; quatre soldats, postés vis-à-vis de cet homme, lui tirèrent chacun trois balles dans le crâne, le plus paisiblement du monde ; et toute l’assemblée s’en retourna extrêmement satisfaite. « Qu’est-ce donc que tout ceci ? dit Candide ; et quel démon exerce partout son empire ? » Il demanda qui était ce gros homme qu’on venait de tuer en cérémonie. « C’est un amiral, lui répondit-on.", "en": "As they were chatting thus together, they arrived at Portsmouth. The shore, on each side of the harbour, was lined with a multitude of people, whose eyes were steadfastly fixed on a lusty man, who was kneeling down on the deck of one of the men of war, with his eyes bound. Opposite to this personage stood four soldiers, each of whom shot three bullets into his skull, with all the composure imaginable; and when it was done, the whole company went away perfectly well satisfied. “What the devil is all this for?” said Candide; “and what demon lords it thus over all the world?” He then asked who was that lusty man who had been sent out of the world with so much ceremony, and he received for answer, that it was an admiral."}, {"fr": "Et pourquoi tuer cet amiral ?", "en": "“And, pray,” he said, “why do you put your admiral to death?”"}, {"fr": "C’est, lui dit-on, parce qu’il n’a pas fait tuer assez de monde ; il a livré un combat à un amiral français, et on a trouvé qu’il n’était pas assez près de lui.", "en": "“Because he did not put a sufficient number of his fellow creatures to death. You must know, he had an engagement with a French admiral, and it has been proved against him that he was not near enough to his antagonist.”"}, {"fr": "Mais, dit Candide, l’amiral français était aussi loin de l’amiral anglais que celui-ci l’était de l’autre !", "en": "“But,” replied Candide, “the French admiral must have been as far from him.”"}, {"fr": "Cela est incontestable, lui répliqua-t-on ; mais dans ce pays-ci il est bon de tuer de temps en temps un amiral pour encourager les autres. »", "en": "“There is no doubt of that; but in this country it is found requisite, now and then, to put one admiral to death, in order to spirit up the others.”"}, {"fr": "Candide fut si étourdi et si choqué de ce qu’il voyait et de ce qu’il entendait qu’il ne voulut pas seulement mettre pied à terre, et qu’il fit son marché avec le patron hollandais (dût-il le voler comme celui de Surinam) pour le conduire sans délai à Venise.", "en": "Candide was so shocked at what he saw and heard that he would not set foot on shore, but made a bargain with the Dutch skipper (were he even to rob him like the captain of Surinam) to carry him directly to Venice."}, {"fr": "Le patron fut prêt au bout de deux jours. On côtoya la France ; on passa à la vue de Lisbonne, et Candide frémit. On entra dans le détroit et dans la Méditerranée ; enfin on aborda à Venise. « Dieu soit loué ! dit Candide, en embrassant Martin ; c’est ici que je reverrai la belle Cunégonde. Je compte sur Cacambo comme sur moi-même. Tout est bien, tout va bien, tout va le mieux qu’il soit possible. »", "en": "The skipper was ready in two days. They sailed along the coast of France, and passed within sight of Lisbon, at which Candide trembled. From thence they proceeded to the straits, entered the Mediterranean, and at length arrived at Venice. “God be praised,” said Candide, embracing Martin, “this is the place where I am to behold my beloved Cunegund once again. I can rely on Cacambo, like another self. All is well, all very well, all as well as possible.”"}, {"fr": "Dès qu’il fut à Venise, il fit chercher Cacambo dans tous les cabarets, dans tous les cafés, chez toutes les filles de joie, et ne le trouva point. Il envoyait tous les jours à la découverte de tous les vaisseaux et de toutes les barques : nulles nouvelles de Cacambo. « Quoi ! disait-il à Martin, j’ai eu le temps de passer de Surinam à Bordeaux, d’aller de Bordeaux à Paris, de Paris à Dieppe, de Dieppe à Portsmouth, de côtoyer le Portugal et l’Espagne, de traverser toute la Méditerranée, de passer quelques mois à Venise ; et la belle Cunégonde n’est point venue ! Je n’ai rencontré au lieu d’elle qu’une drôlesse et un abbé périgourdin ! Cunégonde est morte, sans doute ; je n’ai plus qu’à mourir. Ah ! il valait mieux rester dans le paradis du Dorado que de revenir dans cette maudite Europe. Que vous avez raison, mon cher Martin ! tout n’est qu’illusion et calamité. »", "en": "Upon their arrival at Venice, he went in search of Cacambo at every inn and coffee-house, and among all the ladies of pleasure; but could hear nothing of him. He sent every day to inquire of every ship and every vessel that came in: still no news of Cacambo. “It is strange!” said he to Martin, “very strange! that I should have had time to sail from Surinam to Bordeaux; to travel from thence to Paris, to Dieppe, to Portsmouth; to sail along the coast of Portugal and Spain, and up the Mediterranean, to spend some months in Venice; and that my lovely Cunegund should not have arrived. Instead of her, I only met with a Parisian impostor, and a rascally Abbé of Périgord. Cunegund is actually dead, and I have nothing to do but to follow her. Alas! how much better would it have been for me to have remained in the paradise of El Dorado than to have returned to this cursed Europe! You are in the right, my dear Martin; you are certainly in the right; all is misery and deceit.”"}, {"fr": "Il tomba dans une mélancolie noire, et ne prit aucune part à l’opéra alla moda, ni aux autres divertissements du carnaval ; pas une dame ne lui donna la moindre tentation. Martin lui dit : « Vous êtes bien simple, en vérité, de vous figurer qu’un valet métis qui a cinq ou six millions dans ses poches ira chercher votre maîtresse au bout du monde, et vous l’amènera à Venise. Il la prendra pour lui, s’il la trouve ; s’il ne la trouve pas, il en prendra une autre : je vous conseille d’oublier votre valet Cacambo et votre maîtresse Cunégonde. » Martin n’était pas consolant. La mélancolie de Candide augmenta, et Martin ne cessait de lui prouver qu’il y avait peu de vertu et peu de bonheur sur la terre ; excepté peut-être dans Eldorado, où personne ne pouvait aller.", "en": "He fell into a deep melancholy, and neither went to the opera in vogue, nor partook of any of the diversions of the Carnival; not a woman caused him even a moment’s temptation. Martin said to him, “Upon my word, I think you are very simple to imagine that a rascally valet, with five or six millions in his pocket, would go in search of your mistress to the further end of the world, and bring her to Venice to meet you. If he finds her, he will take her for himself; if he does not, he will take another. Let me advise you to forget your valet Cacambo, and your mistress Cunegund.” Martin’s speech was not consoling. Candide’s melancholy increased, and Martin never left proving to him that there is very little virtue or happiness in this world; except, perhaps, in El Dorado where hardly anybody can gain admittance."}, {"fr": "En disputant sur cette matière importante, et en attendant Cunégonde, Candide aperçut un jeune théatin dans la place Saint-Marc, qui tenait sous le bras une fille. Le théatin paraissait frais, potelé, vigoureux ; ses yeux étaient brillants, son air assuré, sa mine haute, sa démarche fière. La fille était très-jolie, et chantait ; elle regardait amoureusement son théatin, et de temps en temps lui pinçait ses grosses joues. « Vous m’avouerez du moins, dit Candide à Martin, que ces gens-ci sont heureux. Je n’ai trouvé jusqu’à présent dans toute la terre habitable, excepté dans Eldorado, que des infortunés ; mais pour cette fille et ce théatin, je gage que ce sont des créatures très-heureuses.", "en": "While they were disputing on this important subject, and still expecting Miss Cunegund, Candide perceived a young Theatine friar in St. Mark’s Place, with a girl under his arm. The Theatine looked fresh-coloured, plump, and vigorous; his eyes sparkled; his air and gait were bold and lofty. The girl was very pretty, and was singing a song; and every now and then gave her Theatine an amorous ogle and wantonly pinched his ruddy cheeks. “You will at least allow,” said Candide to Martin, “that these two are happy. Hitherto I have met with none but unfortunate people in the whole habitable globe, except in El Dorado; but, as to this couple, I would venture to lay a wager they are happy.”"}, {"fr": "Je gage que non, dit Martin.", "en": "“Done,” said Martin; “they are not, for what you will.”"}, {"fr": "Il n’y a qu’à les prier à dîner, dit Candide, et vous verrez si je me trompe. »", "en": "“Well, we have only to ask them to dine with us,” said Candide, “and you will see whether I am mistaken or not.”"}, {"fr": "Aussitôt il les aborde, il leur fait son compliment, et les invite à venir à son hôtellerie manger des macaronis, des perdrix de Lombardie, des œufs d’esturgeon, et à boire du vin de Montepulciano, du lacryma-christi, du chypre, et du samos. La demoiselle rougit, le théatin accepta la partie, et la fille le suivit en regardant Candide avec des yeux de surprise et de confusion, qui furent obscurcis de quelques larmes. À peine fut-elle entrée dans la chambre de Candide, qu’elle lui dit : « Eh quoi ! monsieur Candide ne reconnaît plus Paquette ! »", "en": "Thereupon he accosted them, and with great politeness invited them to his inn to eat some macaroni, with Lombard partridges and caviare, and to drink a bottle of Montepulciano, Lacrima Christi, Cyprus and Samos wine. The girl blushed; the Theatine accepted the invitation, and she followed him, eyeing Candide every now and then with a mixture of surprise and confusion, while the tears stole down her cheeks. No sooner did she enter his apartment than she cried out:"}, {"fr": "À ces mots, Candide, qui ne l’avait pas considérée jusque-là avec attention, parce qu’il n’était occupé que de Cunégonde, lui dit : « Hélas ! ma pauvre enfant, c’est donc vous qui avez mis le docteur Pangloss dans le bel état où je l’ai vu ?", "en": "“How, Mr. Candide, have you quite forgotten poor Pacquette? Do you not know her again?” Candide, who had not regarded her with any degree of attention before, being wholly occupied with the thoughts of his dear Cunegund, exclaimed: “Ah! is it you, child? Was it you that reduced Dr. Pangloss to that fine condition I saw him in?”"}, {"fr": "— Hélas ! monsieur, c’est moi-même, dit Paquette ; je vois que vous êtes instruit de tout. J’ai su les malheurs épouvantables arrivés à toute la maison de madame la baronne et à la belle Cunégonde. Je vous jure que ma destinée n’a guère été moins triste. J’étais fort innocente quand vous m’avez vue. Un cordelier, qui était mon confesseur, me séduisit aisément. Les suites en furent affreuses ; je fus obligée de sortir du château quelque temps après que monsieur le baron vous eut renvoyé à grands coups de pied dans le derrière. Si un fameux médecin n’avait pas pris pitié de moi, j’étais morte. Je fus quelque temps par reconnaissance la maîtresse de ce médecin. Sa femme, qui était jalouse à la rage, me battait tous les jours impitoyablement ; c’était une furie. Ce médecin était le plus laid de tous les hommes, et moi la plus malheureuse de toutes les créatures d’être battue continuellement pour un homme que je n’aimais pas. Vous savez, monsieur, combien il est dangereux pour une femme acariâtre d’être l’épouse d’un médecin. Celui-ci, outré des procédés de sa femme, lui donna un jour, pour la guérir d’un petit rhume, une médecine si efficace qu’elle en mourut en deux heures de temps dans des convulsions horribles. Les parents de madame intentèrent à monsieur un procès criminel ; il prit la fuite, et moi je fus mise en prison. Mon innocence ne m’aurait pas sauvée si je n’avais été un peu jolie. Le juge m’élargit, à condition qu’il succéderait au médecin. Je fus bientôt supplantée par une rivale, chassée sans récompense, et obligée de continuer ce métier abominable qui vous paraît si plaisant à vous autres hommes, et qui n’est pour nous qu’un abîme de misère. J’allai exercer la profession à Venise. Ah ! monsieur, si vous pouviez vous imaginer ce que c’est que d’être obligée de caresser indifféremment un vieux marchand, un avocat, un moine, un gondolier, un abbé ; d’être exposée à toutes les insultes, à toutes les avanies ; d’être souvent réduite à emprunter une jupe pour aller se la faire lever par un homme dégoûtant ; d’être volée par l’un de ce qu’on a gagné avec l’autre ; d’être rançonnée par les officiers de justice, et de n’avoir en perspective qu’une vieillesse affreuse, un hôpital, et un fumier, vous concluriez que je suis une des plus malheureuses créatures du monde. »", "en": "“Alas! Sir,” answered Pacquette, “it was I, indeed. I find you are acquainted with everything; and I have been informed of all the misfortunes that happened to the whole family of my lady Baroness and the fair Cunegund. But I can safely swear to you that my lot was no less deplorable; I was innocence itself when you saw me last. A cordelier, who was my confessor, easily seduced me; the consequences proved terrible. I was obliged to leave the castle some time after the Baron kicked you out by the backside from there; and if a famous surgeon had not taken compassion on me, I had been a dead woman. Gratitude obliged me to live with him some time as a mistress: his wife, who was a very devil for jealousy, beat me unmercifully every day. Oh! she was a perfect fury. The doctor himself was the most ugly of all mortals, and I the most wretched creature existing, to be continually beaten for a man whom I did not love. You are sensible, Sir, how dangerous it was for an ill-natured woman to be married to a physician. Incensed at the behaviour of his wife, he one day gave her so affectionate a remedy for a slight cold she had caught, that she died in less than two hours in most dreadful convulsions. Her relations prosecuted the husband, who was obliged to fly, and I was sent to prison. My innocence would not have saved me, if I had not been tolerably handsome. The judge gave me my liberty on condition he should succeed the doctor. However, I was soon supplanted by a rival, turned off without a farthing, and obliged to continue the abominable trade which you men think so pleasing, but which to us unhappy creatures is the most dreadful of all sufferings. At length I came to follow the business at Venice. Ah! Sir, did you but know what it is to be obliged to lie indifferently with old tradesmen, with counsellors, with monks, gon
