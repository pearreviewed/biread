doliers, and abbés; to be exposed to all their insolence and abuse; to find it often necessary to borrow a petticoat, only that it may be taken up by some disagreeable wretch; to be robbed by one gallant of what we get from another; to be subject to the extortions of civil magistrates; and to have for ever before one’s eyes the prospect of old age, a hospital, or a dunghill, you would conclude that I am one of the most unhappy wretches breathing.”"}, {"fr": "Paquette ouvrait ainsi son cœur au bon Candide, dans un cabinet, en présence de Martin, qui disait à Candide : « Vous voyez que j’ai déjà gagné la moitié de la gageure. »", "en": "Thus did Pacquette unbosom herself to honest Candide in his closet, in the presence of Martin, who took occasion to say to him: “You see I have half won the wager already.”"}, {"fr": "Frère Giroflée était resté dans la salle à manger, et buvait un coup en attendant le dîner. « Mais, dit Candide à Paquette, vous aviez l’air si gai, si content, quand je vous ai rencontrée ; vous chantiez, vous caressiez le théatin avec une complaisance naturelle ; vous m’avez paru aussi heureuse que vous prétendez être infortunée.", "en": "Friar Giroflée was all this time in the parlour refreshing himself with a glass or two of wine till dinner was ready. “But,” said Candide to Pacquette, “you looked so gay and content, when I met you, you were singing, and caressing the Theatine with so much fondness that I absolutely thought you as happy as you say you are now miserable.”"}, {"fr": "Ah ! monsieur, répondit Paquette, c’est encore là une des misères du métier. J’ai été hier volée et battue par un officier, et il faut aujourd’hui que je paraisse de bonne humeur pour plaire à un moine. »", "en": "“Ah! dear Sir,” said Pacquette, “this is one of the miseries of the trade; yesterday I was stripped and beaten by an officer; yet to-day I must appear good-humoured and gay to please a friar.”"}, {"fr": "Candide n’en voulut pas davantage ; il avoua que Martin avait raison. On se mit à table avec Paquette et le théatin ; le repas fut assez amusant, et sur la fin on se parla avec quelque confiance. « Mon père, dit Candide au moine, vous me paraissez jouir d’une destinée que tout le monde doit envier ; la fleur de la santé brille sur votre visage, votre physionomie annonce le bonheur ; vous avez une très-jolie fille pour votre récréation, et vous paraissez très-content de votre état de théatin.", "en": "Candide was convinced, and acknowledged that Martin was in the right. They sat down to table with Pacquette and the Theatine; the entertainment was very agreeable, and towards the end they began to converse together with some freedom. “Father,” said Candide, to the friar, “you seem to me to enjoy a state of happiness that even kings might envy; joy and health arc painted in your countenance. You have a tight pretty wench to divert you; and you seem to be perfectly well contented with your condition as a Theatine.”"}, {"fr": "— Ma foi, monsieur, dit frère Giroflée, je voudrais que tous les théatins fussent au fond de la mer. J’ai été tenté cent fois de mettre le feu au couvent, et d’aller me faire turc. Mes parents me forcèrent, à l’âge de quinze ans, d’endosser cette détestable robe, pour laisser plus de fortune à un maudit frère aîné, que Dieu confonde ! La jalousie, la discorde, la rage, habitent dans le couvent. Il est vrai que j’ai prêché quelques mauvais sermons qui m’ont valu un peu d’argent dont le prieur me vole la moitié ; le reste me sert à entretenir des filles ; mais quand je rentre le soir dans le monastère, je suis prêt à me casser la tête contre les murs du dortoir ; et tous mes confrères sont dans le même cas. »", "en": "“Faith, Sir,” said Friar Giroflée, “I wish with all my soul the Theatines were every one of them at the bottom of the sea. I have been tempted a thousand times to set fire to the convent and go and turn Turk. My parents obliged me, at the age of fifteen, to put on this detestable habit only to increase the fortune of an elder brother of mine, whom God confound! Jealousy, discord, and fury reside in our convent. It is true, I have preached some paltry sermons, by which I have got a little money, half of which the prior robs me of, and the remainder helps to pay my girls; but, at night, when I go hence to my convent, I am ready to dash my brains against the walls of the dormitory; and this is the case with all the rest of our fraternity.”"}, {"fr": "Martin se tournant vers Candide avec son sang-froid ordinaire : « Eh bien ! lui dit-il, n’ai-je pas gagné la gageure tout entière ? » Candide donna deux mille piastres à Paquette, et mille piastres à frère Giroflée. « Je vous réponds, dit-il, qu’avec cela ils seront heureux.", "en": "Martin, turning towards Candide, with his usual indifference, said, “Well, what think you now? Have I won the wager entirely?” Candide gave two thousand piastres to Pacquette, and a thousand to Friai Giroflée, saying, “I will answer that this will make them happy.”"}, {"fr": "Je n’en crois rien du tout, dit Martin ; vous les rendrez peut-être avec ces piastres beaucoup plus malheureux encore.", "en": "“I am not of your opinion,” said Martin; “perhaps this money will only make them much more wretched.”"}, {"fr": "Il en sera ce qui pourra, dit Candide ; mais une chose me console, je vois qu’on retrouve souvent les gens qu’on ne croyait jamais retrouver : il se pourra bien faire qu’ayant rencontré mon mouton rouge et Paquette, je rencontre aussi Cunégonde.", "en": "“Be that as it may,” said Candide, “one thing comforts me; I see that one often meets with those whom we expected never to see again; so that, perhaps, as I have found my red sheep and Pacquette, I may be lucky enough to find Miss Cunegund also.”"}, {"fr": "Je souhaite, dit Martin, qu’elle fasse un jour votre bonheur ; mais c’est de quoi je doute fort.", "en": "“I wish,” said Martin, “she one day may make you happy, but I doubt it much.”"}, {"fr": "Vous êtes bien dur, dit Candide.", "en": "“You are very hard of belief,” said Candide."}, {"fr": "C’est que j’ai vécu, dit Martin.", "en": "“It is because,” said Martin, “I have seen the world.”"}, {"fr": "Mais regardez ces gondoliers, dit Candide ; ne chantent-ils pas sans cesse ?", "en": "“Observe those gondoliers,” said Candide; “are they not perpetually singing?”"}, {"fr": "Vous ne les voyez pas dans leur ménage, avec leurs femmes et leurs marmots d’enfants, dit Martin. Le doge a ses chagrins, les gondoliers ont les leurs. Il est vrai qu’à tout prendre le sort d’un gondolier est préférable à celui d’un doge ; mais je crois la différence si médiocre que cela ne vaut pas la peine d’être examiné.", "en": "“You do not see them,” answered Martin, “at home with their wives and brats. The doge has his chagrin, gondoliers theirs. Nevertheless, in the main, I look upon the gondolier’s life as preferable to that of the doge; but the difference is so trifling that it is not worth the trouble of examining into.”"}, {"fr": "— On parle, dit Candide, du sénateur Pococurante, qui demeure dans ce beau palais sur la Brenta, et qui reçoit assez bien les étrangers. On prétend que c’est un homme qui n’a jamais eu de chagrin.", "en": "“I have heard great talk,” said Candide, “of the senator Pococurante, who lives in that fine house at the Brenta, where, they say, he entertains foreigners in the most polite manner. They claim that this man is a perfect stranger to uneasiness.”"}, {"fr": "Je voudrais voir une espèce si rare », dit Martin. Candide aussitôt fit demander au seigneur Pococurante la permission de venir le voir le lendemain.", "en": "“I should be glad to see so extraordinary a being,” said Martin. Candide thereupon sent a messenger to Signor Pococurante, desiring permission to wait on him the next day."}, {"fr": "Candide et Martin allèrent en gondole sur la Brenta, et arrivèrent au palais du noble Pococurante. Les jardins étaient bien entendus, et ornés de belles statues de marbre ; le palais, d’une belle architecture. Le maître du logis, homme de soixante ans, fort riche, reçut très-poliment les deux curieux, mais avec très-peu d’empressement, ce qui déconcerta Candide, et ne déplut point à Martin.", "en": "Candide and his friend Martin went in a gondola on the Brenta, and arrived at the palace of the noble Pococurante: the gardens were laid out in an elegant taste, and adorned with beautiful marble statues; his palace was architecturally magnificent. The master of the house, who was a man of sixty, and very rich, received our two travellers with great politeness, but without much ceremony, which somewhat disconcerted Candide, but was not at all displeasing to Martin."}, {"fr": "D’abord deux filles jolies et proprement mises servirent du chocolat, qu’elles firent très-bien mousser. Candide ne put s’empêcher de les louer sur leur beauté, sur leur bonne grâce, et sur leur adresse. « Ce sont d’assez bonnes créatures, dit le sénateur Pococurante ; je les fais quelquefois coucher dans mon lit : car je suis bien las des dames de la ville, de leurs coquetteries, de leurs jalousies, de leurs querelles, de leurs humeurs, de leurs petitesses, de leur orgueil, de leurs sottises, et des sonnets qu’il faut faire ou commander pour elles ; mais, après tout, ces deux filles commencent fort à m’ennuyer. »", "en": "First, two very pretty girls, neatly dressed, brought in chocolate, which was extremely well frothed. Candide could not help praising their beauty and graceful carriage. “The creatures are well enough,” said the senator; “I make them lie with me sometimes, for I am heartily tired of the women of the town, their coquetry, their jealousy, their quarrels, their humours, their meannesses, their pride, and their folly; I am weary of making sonnets, or of paying for sonnets to be made on them; but, after all, these two girls begin to grow very indifferent to me.”"}, {"fr": "Candide, après le déjeuner, se promenant dans une longue galerie, fut surpris de la beauté des tableaux. Il demanda de quel maître étaient les deux premiers. « Ils sont de Raphaël, dit le sénateur ; je les achetai fort cher par vanité, il y a quelques années ; on dit que c’est ce qu’il y a de plus beau en Italie, mais ils ne me plaisent point du tout : la couleur en est très-rembrunie, les figures ne sont pas assez arrondies, et ne sortent point assez ; les draperies ne ressemblent en rien à une étoffe : en un mot, quoi qu’on en dise, je ne trouve point là une imitation vraie de la nature. Je n’aimerai un tableau que quand je croirai voir la nature elle-même : il n’y en a point de cette espèce. J’ai beaucoup de tableaux, mais je ne les regarde plus. »", "en": "After having refreshed himself, Candide walked into a large gallery, where he was struck with the sight of a fine collection of paintings. He asked what master had painted the two first. “They are Raphael’s,” answered the senator. “I gave a great deal of money for them some years ago, purely out of conceit, as they were said to be the finest pieces in Italy; but I cannot say they please me: the colouring is dark and heavy; the figures do not swell nor come out enough, and the drapery has no resemblance to the actual material. In short, notwithstanding the encomiums lavished upon them, they are not, in my opinion, a true representation of nature. I approve of no paintings but where I think I behold nature herself; and there are none of that kind to be met with. I have what is called a fine collection, but I take no manner of delight in them.”"}, {"fr": "Pococurante, en attendant le dîner, se fit donner un concerto. Candide trouva la musique délicieuse. « Ce bruit, dit Pococurante, peut amuser une demi-heure ; mais s’il dure plus longtemps, il fatigue tout le monde, quoique personne n’ose l’avouer. La musique aujourd’hui n’est plus que l’art d’exécuter des choses difficiles, et ce qui n’est que difficile ne plaît point à la longue.", "en": "While dinner was getting ready, Pococurante ordered a concert. Candide praised the music to the skies."}, {"fr": "« J’aimerais peut-être mieux l’opéra, si on n’avait pas trouvé le secret d’en faire un monstre qui me révolte. Ira voir qui voudra de mauvaises tragédies en musique, où les scènes ne sont faites que pour amener très-mal à propos deux ou trois chansons ridicules qui font valoir le gosier d’une actrice ; se pâmera de plaisir qui voudra ou qui pourra, en voyant un châtré fredonner le rôle de César et de Caton, et se promener d’un air gauche sur des planches ; pour moi, il y a longtemps que j’ai renoncé à ces pauvretés qui font aujourd’hui la gloire de l’Italie, et que des souverains paient si chèrement. » Candide disputa un peu, mais avec discrétion. Martin fut entièrement de l’avis du sénateur.", "en": "“This noise,” said the noble Venetian, “may amuse one for a little time, but if it was to last above half an hour, it would grow tiresome to everybody, though perhaps no one would care to own it. Music is become the art of executing what is difficult; now, whatever is difficult cannot be long pleasing. I believe I might take more pleasure in an opera, if they had not made such a monster of it as perfectly shocks me; and I am amazed how people can bear to see wretched tragedies set to music; where the scenes are contrived for no other purpose than to lug in, as it were by the ears, three or four ridiculous songs, to give a favourite actress an opportunity of exhibiting her pipe. Let who will, or can, die away in raptures at the trills of an eunuch quavering the majestic part of Cæsar or Cato, and strutting in a foolish manner upon the stage; for my part, I have long ago renounced these paltry entertainments which constitute the glory of modern Italy, and are so dearly purchased by crowned heads.” Candide opposed these sentiments; but he did it in a discreet manner; as for Martin, he was entirely of the old senator’s opinion."}, {"fr": "On se mit à table ; et, après un excellent dîner, on entra dans la bibliothèque. Candide, en voyant un Homère magnifiquement relié, loua l’illustrissime sur son bon goût. « Voilà, dit-il, un livre qui faisait les délices du grand Pangloss, le meilleur philosophe de l’Allemagne.", "en": "Dinner being served they sat down to table, and after a very hearty repast returned to the library. Candide, observing Homer richly bound, commended the noble Venetian’s taste. “This,” said he, “is a book that was once the delight of the great Pangloss, the best philosopher in Germany.”"}, {"fr": "Il ne fait pas les miennes, dit froidement Pococurante ; on me fit accroire autrefois que j’avais du plaisir en le lisant ; mais cette répétition continuelle de combats qui se ressemblent tous, ces dieux qui agissent toujours pour ne rien faire de décisif, cette Hélène qui est le sujet de la guerre, et qui à peine est une actrice de la pièce ; cette Troie qu’on assiège, et qu’on ne prend point : tout cela me causait le plus mortel ennui. J’ai demandé quelquefois à des savants s’ils s’ennuyaient autant que moi à cette lecture : tous les gens sincères m’ont avoué que le livre leur tombait des mains, mais qu’il fallait toujours l’avoir dans sa bibliothèque, comme un monument de l’antiquité, et comme ces médailles rouillées qui ne peuvent être de commerce.", "en": "“Homer is no favourite of mine,” answered Pococurante, very coolly: “I was made to believe once that I took a pleasure in reading him; but his continual repetitions of battles have all such a resemblance with each other; his gods that are for ever in a hurry and bustle, without ever doing anything; his Helen, that is the cause of the war, and yet hardly acts in the whole performance; his Troy, that holds out so long, without being taken: in short, all these things together make the poem very insipid to me. I have asked some learned men, whether they are not in reality as much tired as myself with reading this poet: those who were sincere assured me that he had made them fall asleep; and yet, that they could not well avoid giving him a place in their libraries as a monument of antiquity or like those rusty medals which are of no use in commerce.”"}, {"fr": "— Votre excellence ne pense pas ainsi de Virgile ? dit Candide.", "en": "“But your Excellency does not surely form the same opinion of Virgil?” said Candide."}, {"fr": "Je conviens, dit Pococurante, que le second, le quatrième, et le sixième livre de son Énéide, sont excellents ; mais pour son pieux Énée, et le fort Cloanthe, et l’ami Achates, et le petit Ascanius, et l’imbécile roi Latinus, et la bourgeoise Amata, et l’insipide Lavinia, je ne crois pas qu’il y ait rien de si froid et de plus désagréable. J’aime mieux le Tasse et les contes à dormir debout de l’Arioste.", "en": "“Why, I grant,” replied Pococurante, “that the second, third, fourth, and sixth book of his Æneid are excellent; but as for his pious Æneas, his strong Cloanthus, his friendly Achates, his boy Ascanius, his silly king Latinus, his ill-bred Amata, his insipid Lavinia, I think there cannot in nature be anything more flat and disagreeable. I must confess, I prefer Tasso far beyond him; nay, even that sleepy tale-teller Ariosto.”"}, {"fr": "— Oserais-je vous demander, monsieur, dit Candide, si vous n’avez pas un grand plaisir à lire Horace ?", "en": "“May I take the liberty to ask if you do not receive great pleasure from reading Horace?” said Candide."}, {"fr": "Il y a des maximes, dit Pococurante, dont un homme du monde peut faire son profit, et qui, étant resserrées dans des vers énergiques, se gravent plus aisément dans la mémoire ; mais je me soucie fort peu de son voyage à Brindes, et de sa description d’un mauvais dîner, et de la querelle de crocheteurs entre je ne sais quel Pupilus dont les paroles, dit-il, étaient pleines de pus, et un autre dont les paroles étaient du vinaigre. Je n’ai lu qu’avec un extrême dégoût ses vers grossiers contre des vieilles et contre des sorcières ; et je ne vois pas quel mérite il peut y avoir à dire à son ami Mecenas que, s’il est mis par lui au rang des poëtes lyriques, il frappera les astres de son front sublime. Les sots admirent tout dans un auteur estimé. Je ne lis que pour moi : je n’aime que ce qui est à mon usage. » Candide, qui avait été élevé à ne jamais juger de rien par lui-même, était fort étonné de ce qu’il entendait ; et Martin trouvait la façon de penser de Pococurante assez raisonnable.", "en": "“There are maxims in this writer,” said Pococurante, “from whence a man of the world may reap some benefit; and the short and forceful measure of the verse makes them more easily to be retained in the memory. But I see nothing extraordinary in his journey to Brundisium, and his account of his bad dinner; nor in his dirty low quarrel between one Rupilius, whose words, as he expresses it, were full of poisonous filth, and another, whose language was dipped in vinegar. His indelicate verses against old women and witches have frequently given me great offence; nor can I discover the great merit of his telling his friend Mæcenas that if he will but rank him in the class of lyric poets, his lofty head shall touch the stars. Ignorant readers are apt to praise everything by the lump in a writer of reputation. For my part, I read only to please myself. I like nothing but what makes for my purpose.” Candide, who had been brought up with a notion of never making use of his own judgment, was astonished at what he had heard; but Martin found there was a good deal of reason in the senator’s remarks."}, {"fr": "« Oh ! voici un Cicéron, dit Candide ; pour ce grand homme-là, je pense que vous ne vous lassez point de le lire.", "en": "“Oh! here is a Cicero,” said Candide: “this great man, I fancy, you are never tired of reading?”"}, {"fr": "Je ne le lis jamais, répondit le Vénitien. Que m’importe qu’il ait plaidé pour Rabirius ou pour Cluentius ? J’ai bien assez des procès que je juge ; je me serais mieux accommodé de ses œuvres philosophiques ; mais quand j’ai vu qu’il doutait de tout, j’ai conclu que j’en savais autant que lui, et que je n’avais besoin de personne pour être ignorant.", "en": "“Indeed, I never read him at all,” replied Pococurante. “What a deuce is it to me whether he pleads for Rabirius or Cluentius? I try causes enough myself. I had once some liking for his philosophical works; but when I found he doubted of everything, I thought I knew as much as he, and had no need of a guide to learn ignorance.”"}, {"fr": "— Ah ! voilà quatre-vingts volumes de recueils d’une académie des sciences, s’écria Martin : il se peut qu’il y ait là du bon.", "en": "“Ha!” cried Martin, “here are fourscore volumes of the memoirs of the Academy of Science; perhaps there may be something valuable in them.”"}, {"fr": "Il y en aurait, dit Pococurante, si un seul des auteurs de ces fatras avait inventé seulement l’art de faire des épingles ; mais il n’y a dans tous ces livres que de vains systèmes, et pas une seule chose utile.", "en": "“Yes,” answered Pococurante; “so there might if any one of the compilers of this rubbish had only invented the art of pin-making: but all these volumes are filled with mere chimerical systems without one single article conducive to real utility.”"}, {"fr": "— Que de pièces de théâtre je vois là, dit Candide, en italien, en espagnol, en français !", "en": "“I see a prodigious number of plays,” said Candide, “in Italian, Spanish, and French.”"}, {"fr": "Oui, dit le sénateur, il y en a trois mille, et pas trois douzaines de bonnes. Pour ces recueils de sermons, qui tous ensemble ne valent pas une page de Sénèque, et tous ces gros volumes de théologie, vous pensez bien que je ne les ouvre jamais, ni moi, ni personne. »", "en": "“Yes,” replied the Venetian; “there are I think three thousand, and not three dozen of them good for anything. As to these huge volumes of divinity, and those enormous collections of sermons, they are altogether not worth one single page in Seneca; and I fancy you will readily believe that neither myself, nor any one else, ever looks into them.”"}, {"fr": "Martin aperçut des rayons chargés de livres anglais. « Je crois, dit-il, qu’un républicain doit se plaire à la plupart de ces ouvrages écrits si librement.", "en": "Martin noticed some shelves filled with English books. “I fancy,” he said, “that a republican must be highly delighted with those books, which are most of them written with a noble spirit of freedom.”"}, {"fr": "Oui, répondit Pococurante, il est beau d’écrire ce qu’on pense : c’est le privilège de l’homme. Dans toute notre Italie, on n’écrit que ce qu’on ne pense pas ; ceux qui habitent la patrie des Césars et des Antonins n’osent avoir une idée sans la permission d’un jacobin. Je serais content de la liberté qui inspire les génies anglais si la passion et l’esprit de parti ne corrompaient pas tout ce que cette précieuse liberté a d’estimable. »", "en": "“It is noble to write as we think,” said Pococurante; “it is the privilege of humanity. Throughout Italy we write only what we do not think; and the present inhabitants of the country of the Cæsars and Antoninus’s dare not acquire a single idea without the permission of a Dominican friar. I should be enamoured of the spirit of the English nation, did it not utterly frustrate the good effects it would produce, by passion and the spirit of party.”"}, {"fr": "Candide, apercevant un Milton, lui demanda s’il ne regardait pas cet auteur comme un grand homme. « Qui ? dit Pococurante, ce barbare, qui fait un long commentaire du premier chapitre de la Genèse, en dix livres de vers durs ? ce grossier imitateur des Grecs, qui défigure la création, et qui, tandis que Moïse représente l’Être éternel produisant le monde par la parole, fait prendre un grand compas par le Messiah dans une armoire du ciel pour tracer son ouvrage ? Moi, j’estimerais celui qui a gâté l’enfer et le diable du Tasse ; qui déguise Lucifer tantôt en crapaud, tantôt en pygmée ; qui lui fait rebattre cent fois les mêmes discours ; qui le fait disputer sur la théologie ; qui, en imitant sérieusement l’invention comique des armes à feu de l’Arioste, fait tirer le canon dans le ciel par les diables ? Ni moi ni personne en Italie n’a pu se plaire à toutes ces tristes extravagances. Le mariage du Péché et de la Mort, et les couleuvres dont le Péché accouche, font vomir tout homme qui a le goût un peu délicat ; et sa longue description d’un hôpital n’est bonne que pour un fossoyeur. Ce poëme obscur, bizarre, et dégoûtant, fut méprisé à sa naissance ; je le traite aujourd’hui comme il fut traité dans sa patrie par les contemporains. Au reste, je dis ce que je pense, et je me soucie fort peu que les autres pensent comme moi. » Candide était affligé de ces discours ; il respectait Homère, il aimait un peu Milton. « Hélas ! dit-il tout bas à Martin, j’ai bien peur que cet homme-ci n’ait un souverain mépris pour nos poëtes allemands.", "en": "Candide, seeing a Milton, asked the senator if he did not think that author a great man. “Who?” said Pococurante sharply; “that barbarian who writes a tedious commentary in ten books of rumbling verse, on the first chapter of Genesis? that slovenly imitator of the Greeks, who disfigures the creation, by making the Messiah take a pair of compasses from heaven’s armoury to plan the world; whereas Moses represented the Deity as producing the whole universe by his fiat? Can I, think you, have any esteem for a writer who has spoiled Tasso’s hell and the devil? who transforms Lucifer sometimes into a toad, and, at others, into a pigmy? who makes him say the same thing over again a hundred times? who metamorphoses him into a school-divine? and who, by an absurdly serious imitation of Ariosto’s comic invention of fire-arms, represents the devils and angels cannonading each other in heaven? Neither I nor any other Italian can possibly take pleasure in such melancholy reveries; but the marriage of Sin and Death, and snakes issuing from the womb of the former, are enough to make any person sick that is not lost to all sense of delicacy, while his long description of a lazar-house is fit only for a gravedigger. This obscene, whimsical and disagreeable poem met with neglect at its first publication; and I only treat the author now as he was treated in his own country by his contemporaries.” Candide was sensibly grieved at this speech, as he had a great respect for Homer and was very fond of Milton. “Alas!” said he softly to Martin, “I am afraid this man holds our German poets in great contempt.”"}, {"fr": "Il n’y aurait pas grand mal à cela, dit Martin.", "en": "“There would be no such great harm in that,” said Martin."}, {"fr": "Oh ! quel homme supérieur ! disait encore Candide entre ses dents, quel grand génie que ce Pococurante ! rien ne peut lui plaire. »", "en": "“O what a surprising man!” said Candide, still to himself; “what a prodigious genius is this Pococurante! nothing can please him.”"}, {"fr": "Après avoir fait ainsi la revue de tous les livres, ils descendirent dans le jardin. Candide en loua toutes les beautés. « Je ne sais rien de si mauvais goût, dit le maître ; nous n’avons ici que des colifichets, mais je vais dès demain en faire planter un d’un dessin plus noble. »", "en": "After finishing their survey of the library, they went down into the garden, when Candide commended the several beauties that offered themselves to his view. “I know nothing upon earth laid out in such bad taste,” said Pococurante; “everything about it is childish and trifling; but I shall have another laid out tomorrow upon a nobler plan.”"}, {"fr": "Quand les deux curieux eurent pris congé de Son Excellence : « Or çà, dit Candide à Martin, vous conviendrez que voilà le plus heureux de tous les hommes, car il est au-dessus de tout ce qu’il possède.", "en": "As soon as our two travellers had taken leave of his Excellency, Candide said to Martin: “I hope you will own that this man is the happiest of all mortals, for he is above everything he possesses.”"}, {"fr": "Ne voyez-vous pas, dit Martin, qu’il est dégoûté de tout ce qu’il possède ? Platon a dit, il y a longtemps, que les meilleurs estomacs ne sont pas ceux qui rebutent tous les aliments.", "en": "“But do not you see,” answered Martin, “that he likewise dislikes everything he possesses? It was an observation of Plato, long since, that those are not the best stomachs that reject, without distinction, all sorts of aliments.”"}, {"fr": "Mais, dit Candide, n’y a-t-il pas du plaisir à tout critiquer, à sentir des défauts où les autres hommes croient voir des beautés ?", "en": "“True,” said Candide, “but still there must certainly be a pleasure in criticizing everything, and in perceiving faults where others think they see beauties.”"}, {"fr": "C’est-à-dire, reprit Martin, qu’il y a du plaisir à n’avoir pas de plaisir ?", "en": "“That is,” replied Martin, “there is a pleasure in having no pleasure.”"}, {"fr": "Oh bien ! dit Candide, il n’y a donc d’heureux que moi, quand je reverrai Mlle Cunégonde.", "en": "“Well, well,” said Candide, “I find that I shall be the only happy man at last, when I am blessed with the sight of my dear Cunegund.”"}, {"fr": "C’est toujours bien fait d’espérer », dit Martin.", "en": "“It is good to hope,” said Martin."}, {"fr": "Cependant les jours, les semaines, s’écoulaient ; Cacambo ne revenait point, et Candide était si abîmé dans sa douleur qu’il ne fit pas même réflexion que Paquette et frère Giroflée n’étaient pas venus seulement le remercier.", "en": "In the meanwhile, days and weeks passed away, and no news of Cacambo. Candide was so overwhelmed with grief, that he did not reflect on the behaviour of Pacquette and Friar Giroflée, who never stayed to return him thanks for the presents he had so generously made them."}, {"fr": "Un soir que Candide, suivi de Martin, allait se mettre à table avec les étrangers qui logeaient dans la même hôtellerie, un homme à visage couleur de suie l’aborda par derrière, et, le prenant par le bras, lui dit : « Soyez prêt à partir avec nous, n’y manquez pas. » Il se retourne, et voit Cacambo. Il n’y avait que la vue de Cunégonde qui pût l’étonner et lui plaire davantage. Il fut sur le point de devenir fou de joie. Il embrasse son cher ami. « Cunégonde est ici, sans doute ? Où est-elle ? Mène-moi vers elle, que je meure de joie avec elle.", "en": "One evening when Candide, with his attendant Martin, were going to sit down to supper with some foreigners who lodged in the same inn, a man, with a face the colour of soot, came behind him, and taking him by the arm, said: “Hold yourself in readiness to go along with us, be sure you do not fail.” He turned and beheld Cacambo. Nothing but the sight of Cunegund could have given greater joy and surprise. He was almost beside himself with joy. After embracing this dear friend, he said: “Cunegund must be here? Where, where is she? Carry me to her this instant, that I may die with joy in her presence.”"}, {"fr": "Cunégonde n’est point ici, dit Cacambo, elle est à Constantinople.", "en": "“Cunegund is not here,” answered Cacambo; “she is at Constantinople.”"}, {"fr": "Ah ciel ! à Constantinople ! mais fût-elle à la Chine, j’y vole, partons.", "en": "“Good heavens, at Constantinople! but no matter if she was in China, I would fly thither. Let us be gone.”"}, {"fr": "Nous partirons après souper, reprit Cacambo ; je ne peux vous en dire davantage ; je suis esclave, mon maître m’attend ; il faut que j’aille le servir à table : ne dites mot ; soupez, et tenez-vous prêt. »", "en": "“We depart after supper,” said Cacambo. “I cannot at present stay to say anything more to you; I am a slave, and my master waits for me; I must go and attend him at table: but say not a word, only get your supper, and hold yourself in readiness.”"}, {"fr": "Candide, partagé entre la joie et la douleur, charmé d’avoir revu son agent fidèle, étonné de le voir esclave, plein de l’idée de retrouver sa maîtresse, le cœur agité, l’esprit bouleversé, se mit à table avec Martin, qui voyait de sang-froid toutes ces aventures, et avec six étrangers, qui étaient venus passer le carnaval à Venise.", "en": "Candide, divided between joy and grief, charmed to have thus met with his faithful agent again, and surprised to hear he was a slave, his heart palpitating, his senses confused, but full of the hopes of recovering his mistress, sat down to table with Martin, who beheld all these scenes with great unconcern, and with six strangers who had come to spend the carnival at Venice."}, {"fr": "Cacambo, qui versait à boire à l’un de ces six étrangers, s’approcha de l’oreille de son maître, sur la fin du repas, et lui dit : « Sire, Votre Majesté partira quand elle voudra, le vaisseau est prêt. » Ayant dit ces mots, il sortit. Les convives étonnés se regardaient sans proférer une seule parole, lorsqu’un autre domestique s’approchant de son maître, lui dit : « Sire, la chaise de Votre Majesté est à Padoue, et la barque est prête. » Le maître fit un signe, et le domestique partit. Tous les convives se regardèrent encore, et la surprise commune redoubla. Un troisième valet, s’approchant aussi d’un troisième étranger, lui dit : « Sire, croyez-moi, Votre Majesté ne doit pas rester ici plus longtemps : je vais tout préparer » ; et aussitôt il disparut.", "en": "Cacambo waited at table upon one of these strangers. When supper was nearly over, he drew near to his master, and whispered him in the ear: “Sire, your Majesty may go when you please, the ship is ready.” Having said these words, he left the room. The guests, surprised at what they had heard, looked at each other without speaking a word; when another servant drawing near to his master, in like manner said: “Sire, your Majesty’s post-chaise is at Padua, and the bark is ready.” His master made him a sign, and he instantly withdrew. The company all stared at each other again, and the general astonishment was increased. A third servant then approached another of the strangers, and said: “Sire, if your Majesty will be advised by me, you will not stay any longer in this place; I will go and get everything ready”—and he instantly disappeared."}, {"fr": "Candide et Martin ne doutèrent pas alors que ce ne fût une mascarade du carnaval. Un quatrième domestique dit au quatrième maître : « Votre Majesté partira quand elle voudra », et sortit comme les autres. Le cinquième valet en dit autant au cinquième maître. Mais le sixième valet parla différemment au sixième étranger, qui était auprès de Candide ; il lui dit : « Ma foi, sire, on ne veut plus faire crédit à Votre Majesté ni à moi non plus, et nous pourrions bien être coffrés cette nuit, vous et moi ; je vais pourvoir à mes affaires : adieu. »", "en": "Candide and Martin then took it for granted that this was some of the diversions of the carnival, and that these were characters in masquerade. Then a fourth domestic said to the fourth stranger: “Your Majesty may set out when you please.” Saying this, he went away like the rest. A fifth valet said the same to a fifth master. But the sixth domestic spoke in a different style to the person on whom he waited, and who sat next to Candide. “Troth, Sir,” said he, “they will trust your Majesty no longer, nor myself neither; and we may both of us chance to be sent to gaol this very night; and therefore I shall take care of myself, and so adieu.”"}, {"fr": "Tous les domestiques ayant disparu, les six étrangers, Candide, et Martin, demeurèrent dans un profond silence. Enfin Candide le rompit : « Messieurs, dit-il, voilà une singulière plaisanterie. Pourquoi êtes-vous tous rois ? Pour moi, je vous avoue que ni moi ni Martin nous ne le sommes. »", "en": "The servants being all gone, the six strangers, with Candide and Martin, remained in a profound silence. At length Candide broke it by saying: “Gentlemen, this is a very singular joke, upon my word; why, how came you all to be kings? For my part, I own frankly, that neither my friend Martin here nor myself have any claim to royalty.”"}, {"fr": "Le maître de Cacambo prit alors gravement la parole, et dit en italien : « Je ne suis point plaisant, je m’appelle Achmet III ; j’ai été grand sultan plusieurs années ; je détrônai mon frère ; mon neveu m’a détrôné ; on a coupé le cou à mes vizirs ; j’achève ma vie dans le vieux sérail ; mon neveu le grand sultan Mahmoud me permet de voyager quelquefois pour ma santé ; et je suis venu passer le carnaval à Venise. »", "en": "Cacambo’s master then began, with great gravity, to deliver himself thus in Italian: “I am not joking in the least, my name is Achmet III. I was Grand Sultan for many years; I dethroned my brother, my nephew dethroned me, my viziers lost their heads, and I am condemned to end my days in the old seraglio. My nephew, the Grand Sultan Mahmud, gives me permission to travel sometimes for my health, and I am come to spend the carnival at Venice.”"}, {"fr": "Un jeune homme qui était auprès d’Achmet parla après lui, et dit : « Je m’appelle Ivan ; j’ai été empereur de toutes les Russies ; j’ai été détrôné au berceau ; mon père et ma mère ont été enfermés ; on m’a élevé en prison ; j’ai quelquefois la permission de voyager, accompagné de ceux qui me gardent ; et je suis venu passer le carnaval à Venise. »", "en": "A young man who sat by Achmet spoke next, and said: “My name is Ivan. I was once Emperor of all the Russias, but was dethroned in my cradle. My parents were confined, and I was brought up in a prison; yet I am sometimes allowed to travel, though always with persons to keep a guard over me, and I am come to spend the carnival at Venice.”"}, {"fr": "Le troisième dit : « Je suis Charles-Édouard, roi d’Angleterre ; mon père m’a cédé ses droits au royaume ; j’ai combattu pour les soutenir ; on a arraché le cœur à huit cents de mes partisans, et on leur en a battu les joues ; j’ai été mis en prison ; je vais à Rome faire une visite au roi mon père, détrôné ainsi que moi et mon grand-père ; et je suis venu passer le carnaval à Venise. »", "en": "I am Charles Edward, King of England; my father has renounced his right to the throne in my favour. I have fought in defence of my rights, and eight hundred of my followers have had their hearts taken out of their bodies alive and thrown in their faces. I have myself been confined in a prison. I am going to Rome to visit the King my father, who was dethroned as well as myself and my grandfather; and I am come to spend the carnival at Venice.”"}, {"fr": "Le quatrième prit alors la parole et dit : « Je suis roi des Polaques ; le sort de la guerre m’a privé de mes États héréditaires ; mon père a éprouvé les mêmes revers ; je me résigne à la Providence comme le sultan Achmet, l’empereur Ivan, et le roi Charles-Édouard, à qui Dieu donne une longue vie ; et je suis venu passer le carnaval à Venise. »", "en": "The fourth spoke thus: “I am the King of Poland; the fortune of war has stripped me of my hereditary dominions. My father experienced the same vicissitudes of fate. I resign myself to the will of Providence, in the same manner as Sultan Achmet, the Emperor Ivan, and King Charles Edward, whom God long preserve; and I am come to spend the carnival at Venice.”"}, {"fr": "Le cinquième dit : « Je suis aussi roi des Polaques ; j’ai perdu mon royaume deux fois ; mais la Providence m’a donné un autre État dans lequel j’ai fait plus de bien que tous les rois des Sarmates ensemble n’en ont jamais pu faire sur les bords de la Vistule. Je me résigne aussi à la Providence ; et je suis venu passer le carnaval à Venise. »", "en": "“I am King of Poland also. I have twice lost my kingdom; but Providence has given me other dominions, where I have done more good than all the Sarmatian kings put together were ever able to do on the banks of the Vistula: I resign myself likewise to Providence; and am come to spend the carnival at Venice.”"}, {"fr": "Il restait au sixième monarque à parler. « Messieurs, dit-il, je ne suis pas si grand seigneur que vous ; mais enfin j’ai été roi tout comme un autre ; je suis Théodore ; on m’a élu roi en Corse ; on m’a appelé Votre Majesté, et à présent à peine m’appelle-t-on Monsieur ; j’ai fait frapper de la monnaie, et je ne possède pas un denier ; j’ai eu deux secrétaires d’État, et j’ai à peine un valet ; je me suis vu sur un trône, et j’ai longtemps été à Londres en prison sur la paille ; j’ai bien peur d’être traité de même ici, quoique je sois venu, comme Vos Majestés, passer le carnaval à Venise. »", "en": "It now came to the sixth monarch’s turn to speak. “Gentlemen,” said he, “I am not so great a prince as the rest of you, it is true; but I am, however, a crowned head. I am Theodore, elected King of Corsica. I have had the title of Majesty, and am now hardly treated with common civility. I have coined money, and am not now worth a single ducat. I have had two secretaries of state, and am now without a valet. I was once seated on a throne, and since that have lain upon a truss of straw in a common gaol in London, and I very much fear I shall meet with the same fate here in Venice, where I come, like your Majesties, to divert myself at the carnival.”"}, {"fr": "Les cinq autres rois écoutèrent ce discours avec une noble compassion. Chacun d’eux donna vingt sequins au roi Théodore pour avoir des habits et des chemises ; Candide lui fit présent d’un diamant de deux mille sequins. « Quel est donc, disaient les cinq rois, cet homme qui est en état de donner cent fois autant que chacun de nous, et qui le donne ? Êtes-vous roi aussi, monsieur ?", "en": "The other five kings listened to this speech with great attention; it excited their compassion; each of them made the unhappy Theodore a present of twenty sequins to get clothes and shirts, and Candide gave him a diamond worth just an hundred times that sum. “Who can this private person be,” said the five kings, “who is able to give, and has actually given, a hundred times as much as any of us? Are you, Sir, also a king?”"}, {"fr": "Non, messieurs, et n’en ai nulle envie. »", "en": "“No, gentlemen, and I have no wish to be one.”"}, {"fr": "Dans l’instant qu’on sortait de table, il arriva dans la même hôtellerie quatre altesses sérénissimes qui avaient aussi perdu leurs États par le sort de la guerre, et qui venaient passer le reste du carnaval à Venise ; mais Candide ne prit pas seulement garde à ces nouveaux venus. Il n’était occupé que d’aller trouver sa chère Cunégonde à Constantinople.", "en": "Just as they rose from table, in came four Serene Highnesses who had also been stripped of their territories by the fortune of war, and were come to spend the remainder of the carnival at Venice. Candide took no manner of notice of them; for his thoughts were wholly employed on his voyage to Constantinople, whither he intended to go in search of his beloved Cunegund."}, {"fr": "Le fidèle Cacambo avait déjà obtenu du patron turc qui allait reconduire le sultan Achmet à Constantinople qu’il recevrait Candide et Martin sur son bord. L’un et l’autre s’y rendirent après s’être prosternés devant Sa misérable Hautesse. Candide, chemin faisant, disait à Martin : « Voilà pourtant six rois détrônés avec qui nous avons soupé ! et encore dans ces six rois il y en a un à qui j’ai fait l’aumône. Peut-être y a-t-il beaucoup d’autres princes plus infortunés. Pour moi, je n’ai perdu que cent moutons, et je vole dans les bras de Cunégonde. Mon cher Martin, encore une fois, Pangloss avait raison, tout est bien.", "en": "The trusty Cacambo had already engaged the captain of the Turkish ship that was to carry Sultan Achmet back to Constantinople, to take Candide and Martin on board. Accordingly, they both embarked, after paying their obeisance to his miserable Highness. As they were going on board. Candide said to Martin: “You see we supped in company with six dethroned kings, and to one of them I gave charity. Perhaps there may be a great many other princes still more unfortunate. For my part, I have lost only a hundred sheep, and am now going to fly to the arms of Cunegund. My dear Martin, I must insist on it, that Pangloss was in the right. All is for the best.”"}, {"fr": "Je le souhaite, dit Martin.", "en": "“I wish it may be,” said Martin."}, {"fr": "Mais, dit Candide, voilà une aventure bien peu vraisemblable que nous avons eue à Venise. On n’avait jamais vu ni ouï conter que six rois détrônés soupassent ensemble au cabaret.", "en": "“But this was an odd adventure we met with at Venice. I do not think there ever was an instance before, of six dethroned monarchs supping together at a public inn.”"}, {"fr": "Cela n’est pas plus extraordinaire, dit Martin, que la plupart des choses qui nous sont arrivées. Il est très-commun que des rois soient détrônés ; et à l’égard de l’honneur que nous avons eu de souper avec eux, c’est une bagatelle qui ne mérite pas notre attention. Qu’importe avec qui l’on soupe, pourvu qu’on fasse bonne chère ? »", "en": "“This is no more extraordinary,” said Martin, “than most of what has happened to us. It is a very common thing for kings to be dethroned; and as for our having the honour to sup with six of them, it is a mere accident, not deserving our attention. What does it matter with whom one sups, provided one has good fare?”"}, {"fr": "À peine Candide fut-il dans le vaisseau qu’il sauta au cou de son ancien valet, de son ami Cacambo. « Eh bien ! lui dit-il, que fait Cunégonde ? Est-elle toujours un prodige de beauté ? M’aime-t-elle toujours ? Comment se porte-t-elle ? Tu lui as, sans doute, acheté un palais à Constantinople ?", "en": "As soon as Candide set his foot on board the vessel, he flew to his old friend and servant Cacambo; and throwing his arms about his neck, embraced him with transports of joy. “Well,” said he, “what news of Cunegund? Does she still continue the paragon of beauty? Does she love me still? How is she? You have, doubtless, purchased a palace for her at Constantinople?”"}, {"fr": "— Mon cher maître, répondit Cacambo, Cunégonde lave les écuelles sur le bord de la Propontide, chez un prince qui a très-peu d’écuelles ; elle est esclave dans la maison d’un ancien souverain, nommé Ragotski, à qui le Grand Turc donne trois écus par jour dans son asile ; mais, ce qui est bien plus triste, c’est qu’elle a perdu sa beauté, et qu’elle est devenue horriblement laide.", "en": "“My dear master,” replied Cacambo, “Cunegund washes dishes on the banks of the Propontis, in the house of a prince who has very few to wash. She is at present a slave in the family of an ancient sovereign, named Ragotsky, whom the Grand Turk allows three crowns a day to maintain him in his exile; but the most melancholy circumstance of all is, that she has lost her beauty and turned horribly ugly.”"}, {"fr": "Ah ! belle ou laide, dit Candide, je suis honnête homme, et mon devoir est de l’aimer toujours. Mais comment peut-elle être réduite à un état si abject avec les cinq ou six millions que tu avais emportés ?", "en": "“Ugly or handsome,” said Candide, “I am a man of honour; and, as such, am obliged to love her still. But how could she possibly have been reduced to so abject a condition, when I sent five or six millions to her by you?”"}, {"fr": "Bon, dit Cacambo, ne m’en a-t-il pas fallu donner deux au señor don Fernando d’Ibaraa, y Figueora, y Mascarenès, y Lampourdos, y Souza, gouverneur de Buénos-Ayres, pour avoir la permission de reprendre Mlle Cunégonde ? Et un pirate ne nous a-t-il pas bravement dépouillés de tout le reste ? Ce pirate ne nous a-t-il pas menés au cap de Matapan, à Milo, à Nicarie, à Samos, à Petra, aux Dardanelles, à Marmara, à Scutari ? Cunégonde et la vieille servent chez ce prince dont je vous ai parlé, et moi, je suis esclave du sultan détrôné.", "en": "“Lord bless me,” said Cacambo, “was not I obliged to give two millions to Señor Don Fernando d’Ibaraa y Figueora y Mascarenas y Lampourdos y Souza, Governor of Buenos Ayres, for liberty to take Miss Cunegund away with me? and then did not a brave fellow of a pirate very gallantly strip us of all the rest? and then did not this same pirate carry us with him to Cape Matapan, to Milo, to Nicaria, to Samos, to Petra, to the Dardanelles, to Marmora, to Scutari? Cunegund and the old woman are now servants to the prince I have told you of; and I myself am slave to the dethroned Sultan.”"}, {"fr": "Que d’épouvantables calamités enchaînées les unes aux autres ! dit Candide. Mais, après tout, j’ai encore quelques diamants ; je délivrerai aisément Cunégonde. C’est bien dommage qu’elle soit devenue si laide. »", "en": "“What a chain of terrible calamities!” exclaimed Candide. “But, after all, I have still some diamonds left, with which I can easily procure Cunegund’s liberty. It is a pity she is grown so very ugly.”"}, {"fr": "Ensuite, se tournant vers Martin : « Que pensez-vous, dit-il, qui soit le plus à plaindre, de l’empereur Achmet, de l’empereur Ivan, du roi Charles-Édouard, ou de moi ?", "en": "Then turning to Martin, “What think you, friend,” said he, “whose condition is most to be pitied, the Emperor Achmet’s, the Emperor Ivan’s, King Charles Edward’s, or mine?”"}, {"fr": "Je n’en sais rien, dit Martin ; il faudrait que je fusse dans vos cœurs pour le savoir.", "en": "“Faith, I cannot resolve your question,” said Martin, “unless I had been in the breasts of you all.”"}, {"fr": "Ah ! dit Candide, si Pangloss était ici, il le saurait, et nous l’apprendrait.", "en": "“Ah!” cried Candide, “was Pangloss here now, he would have known, and satisfied me at once.”"}, {"fr": "Je ne sais, dit Martin, avec quelles balances votre Pangloss aurait pu peser les infortunes des hommes, et apprécier leurs douleurs. Tout ce que je présume c’est qu’il y a des millions d’hommes sur la terre cent fois plus à plaindre que le roi Charles-Édouard, l’empereur Ivan, et le sultan Achmet.", "en": "“I know not,” said Martin, “in what balance your Pangloss could have weighed the misfortunes of mankind, and have set a just estimation on their sufferings. All that I pretend to know of the matter is that there are millions of men on the earth whose conditions are an hundred times more pitiable than those of King Charles Edward, the Emperor Ivan, or Sultan Achmet.”"}, {"fr": "Cela pourrait bien être, dit Candide. »", "en": "“Why, that may be,” answered Candide."}, {"fr": "On arriva en peu de jours sur le canal de la mer Noire. Candide commença par racheter Cacambo fort cher ; et, sans perdre de temps, il se jeta dans une galère, avec ses compagnons, pour aller sur le rivage de la Propontide chercher Cunégonde, quelque laide qu’elle pût être.", "en": "In a few days they reached the Bosphorus; and the first thing Candide did was to pay a high ransom for Cacambo: then, without losing time, he and his companions went on board a galley, in order to search for his Cunegund, on the banks of the Propontis, notwithstanding she was grown so ugly."}, {"fr": "Il y avait dans la chiourme deux forçats qui ramaient fort mal, et à qui le levanti patron appliquait de temps en temps quelques coups de nerf de bœuf sur leurs épaules nues ; Candide, par un mouvement naturel, les regarda plus attentivement que les autres galériens, et s’approcha d’eux avec pitié. Quelques traits de leurs visages défigurés lui parurent avoir un peu de ressemblance avec Pangloss et avec ce malheureux jésuite, ce baron, ce frère de Mlle Cunégonde. Cette idée l’émut et l’attrista. Il les considéra encore plus attentivement. « En vérité, dit-il à Cacambo, si je n’avais pas vu pendre maître Pangloss, et si je n’avais pas eu le malheur de tuer le baron, je croirais que ce sont eux qui rament dans cette galère. »", "en": "There were two slaves among the crew of the galley, who rowed very ill, and to whose bare backs the master of the vessel frequently applied a lash of oxhide. Candide, from natural sympathy, looked at these two slaves more attentively than at any of the rest, and drew near them with a look of pity. Their features, though greatly disfigured, appeared to him to bear a strong resemblance with those of Pangloss and the unhappy Baron Jesuit, Miss Cunegund’s brother. This idea affected him with grief and compassion: he examined them more attentively than before. “In troth,” said he, turning to Martin, “if I had not seen my master Pangloss fairly hanged, and had not myself been unlucky enough to run the Baron through the body, I could believe these are they rowing in the galley.”"}, {"fr": "Au nom du baron et de Pangloss les deux forçats poussèrent un grand cri, s’arrêtèrent sur leur banc, et laissèrent tomber leurs rames. Le levanti patron accourait sur eux, et les coups de nerf de bœuf redoublaient. « Arrêtez ! arrêtez ! seigneur, s’écria Candide ; je vous donnerai tant d’argent que vous voudrez.", "en": "No sooner had Candide uttered the names of the Baron and Pangloss than the two slaves gave a great cry, ceased rowing, and let fall their oars out of their hands. The master of the vessel, seeing this, ran up to them, and redoubled the discipline of the lash. “Hold, hold,” cried Candide, “I will give you what money you ask for these two persons.”"}, {"fr": "Quoi ! c’est Candide ! disait l’un des forçats.", "en": ""}, {"fr": "Quoi ! c’est Candide ! disait l’autre.", "en": "“Good heavens! it is Candide,” said one of the men. “Candide!” cried the other."}, {"fr": "Est-ce un songe ? dit Candide ; veillé-je ? suis-je dans cette galère ? Est-ce là monsieur le baron, que j’ai tué ? Est-ce là maître Pangloss, que j’ai vu pendre ?", "en": "“Do I dream,” said Candide, “or am I awake? Am I actually on board this galley? Is this my lord Baron, whom I killed? and that my master Pangloss, whom I saw hanged?”"}, {"fr": "C’est nous-mêmes, c’est nous-mêmes, répondaient-ils.", "en": "“It is I! it is I!” cried they both together."}, {"fr": "Quoi ! c’est là ce grand philosophe ? disait Martin.", "en": "“What! is this your great philosopher?” said Martin."}, {"fr": "Eh ! monsieur le levanti patron, dit Candide, combien voulez-vous d’argent pour la rançon de M. de Thunder-ten-tronckh, un des premiers barons de l’empire, et de M. Pangloss, le plus profond métaphysicien d’Allemagne ?", "en": "“My dear Sir,” said Candide to the master of the galley, “how much do you ask for the ransom of the Baron of Thunder-ten-tronckh, who is one of the first barons of the empire, and of Mr. Pangloss, the most profound metaphysician in Germany?”"}, {"fr": "Chien de chrétien, répondit le levanti patron, puisque ces deux chiens de forçats chrétiens sont des barons et des métaphysiciens, ce qui est sans doute une grande dignité dans leur pays, tu m’en donneras cinquante mille sequins.", "en": "“Why then, Christian cur,” replied the Turkish captain, “since these two dogs of Christian slaves are barons and metaphysicians, who no doubt are of high rank in their own country, thou shalt give me fifty thousand sequins.”"}, {"fr": "Vous les aurez, monsieur ; remenez-moi comme un éclair à Constantinople, et vous serez payé sur-le-champ. Mais non, menez-moi chez Mlle Cunégonde. » Le levanti patron, sur la première offre de Candide, avait déjà tourné la proue vers la ville, et il faisait ramer plus vite qu’un oiseau ne fend les airs.", "en": "“You shall have them, Sir: carry me back as quick as thought to Constantinople, and you shall receive the money immediately. No! carry me first to Miss Cunegund.” The captain, upon Candide’s first proposal, had already tacked about, and he made the crew apply their oars so effectively that the vessel flew through the water quicker than a bird cleaves the air."}, {"fr": "Candide embrassa cent fois le baron et Pangloss. « Et comment ne vous ai-je pas tué, mon cher baron ? et mon cher Pangloss, comment êtes-vous en vie après avoir été pendu ? et pourquoi êtes-vous tous deux aux galères en Turquie ?", "en": "Candide bestowed a thousand embraces on the Baron and Pangloss. “And so then, my dear Baron, I did not kill you? and you, my dear Pangloss, are come to life again after your hanging? But how came you slaves on board a Turkish galley?”"}, {"fr": "Est-il bien vrai que ma chère sœur soit dans ce pays ? disait le baron.", "en": "“And is it true that my dear sister is in this country?” said the Baron."}, {"fr": "Oui, répondait Cacambo.", "en": ""}, {"fr": "Je revois donc mon cher Candide ! s’écriait Pangloss. » Candide leur présentait Martin et Cacambo. Ils s’embrassaient tous ; ils parlaient tous à la fois. La galère volait, ils étaient déjà dans le port. On fit venir un juif, à qui Candide vendit pour cinquante mille sequins un diamant de la valeur de cent mille, et qui lui jura par Abraham qu’il n’en pouvait donner davantage. Il paya incontinent la rançon du baron et de Pangloss. Celui-ci se jeta aux pieds de son libérateur, et les baigna de larmes ; l’autre le remercia par un signe de tête, et lui promit de lui rendre cet argent à la première occasion. « Mais est-il bien possible que ma sœur soit en Turquie ? disait-il.", "en": "“And do I once again behold my dear Candide?” said Pangloss. Candide presented Martin and Cacambo to them; they embraced each other, and all spoke together. The galley flew like lightning, and now they were got back to the port. Candide instantly sent for a Jew, to whom he sold for fifty thousand sequins a diamond richly worth one hundred thousand, though the fellow swore to him all the time, by Abraham, that he gave him the most he could possibly afford. He no sooner got the money into his hands than he paid it down for the ransom of the Baron and Pangloss. The latter flung himself at the feet of his deliverer, and bathed him with his tears: the former thanked him with a gracious nod, and promised to return him the money at the first opportunity. “But is it possible,” said he, “that my sister should be in Turkey?”"}, {"fr": "Rien n’est si possible, reprit Cacambo, puisqu’elle écure la vaisselle chez un prince de Transylvanie. » On fit aussitôt venir deux juifs : Candide vendit encore des diamants ; et ils repartirent tous dans une autre galère pour aller délivrer Cunégonde.", "en": "“Nothing is more possible,” answered Cacambo; “for she scours the dishes in the house of a Transylvanian prince.” Candide sent directly for two Jews, and sold more diamonds to them; and then he set out with his companions in another galley, to deliver Cunegund from slavery."}, {"fr": "« Pardon, encore une fois, dit Candide au baron ; pardon, mon révérend père, de vous avoir donné un grand coup d’épée au travers du corps.", "en": "“Pardon,” said Candide to the Baron; “once more let me intreat your pardon, Reverend Father, for running you through the body.”"}, {"fr": "— N’en parlons plus, dit le baron ; je fus un peu trop vif, je l’avoue ; mais puisque vous voulez savoir par quel hasard vous m’avez vu aux galères, je vous dirai qu’après avoir été guéri de ma blessure par le frère apothicaire du collège, je fus attaqué et enlevé par un parti espagnol ; on me mit en prison à Buénos-Ayres dans le temps que ma sœur venait d’en partir. Je demandai à retourner à Rome auprès du père général. Je fus nommé pour aller servir d’aumônier à Constantinople auprès de monsieur l’ambassadeur de France. Il n’y avait pas huit jours que j’étais entré en fonction, quand je trouvai sur le soir un jeune icoglan très-bien fait. Il faisait fort chaud : le jeune homme voulut se baigner ; je pris cette occasion de me baigner aussi. Je ne savais pas que ce fût un crime capital pour un chrétien d’être trouvé tout nu avec un jeune musulman. Un cadi me fit donner cent coups de bâton sous la plante des pieds, et me condamna aux galères. Je ne crois pas qu’on ait fait une plus horrible injustice. Mais je voudrais bien savoir pourquoi ma sœur est dans la cuisine d’un souverain de Transylvanie réfugié chez les Turcs.", "en": "“Say no more about it,” replied the Baron; “I was a little too hasty I must own: but as you seem to be anxious to know by what accident I came to be a slave on board the galley where you saw me, I will inform you. After I had been cured of the wound you gave me, by the apothecary of the College, I was attacked and carried off by a party of Spanish troops, who clapped me up in prison in Buenos Ayres, at the very time my sister was setting out from there. I asked leave to return to Rome, to the general of my Order, who appointed me chaplain to the French Ambassador at Constantinople. I had not been a week in my new office, when I happened to meet one evening with a young Icoglan, extremely handsome and well made. The weather was very hot; the young man had an inclination to bathe. I took the opportunity to bathe likewise. I did not know it was a crime for a Christian to be found naked in company with a young Turk. A cadi ordered me to receive a hundred blows on the soles of my feet, and sent me to the galleys. I do not believe that there was ever an act of more flagrant injustice. But I would fain know how my sister came to be a scullion to a Transylvanian prince who has taken refuge among the Turks?”"}, {"fr": "— Mais vous, mon cher Pangloss, dit Candide, comment se peut-il que je vous revoie ?", "en": "“But how happens it that I behold you again, my dear Pangloss?” said Candide."}, {"fr": "— Il est vrai, dit Pangloss, que vous m’avez vu pendre ; je devais naturellement être brûlé ; mais vous vous souvenez qu’il plut à verse lorsqu’on allait me cuire : l’orage fut si violent qu’on désespéra d’allumer le feu ; je fus pendu, parce qu’on ne put mieux faire : un chirurgien acheta mon corps, m’emporta chez lui, et me disséqua. Il me fit d’abord une incision cruciale depuis le nombril jusqu’à la clavicule. On ne pouvait pas avoir été plus mal pendu que je l’avais été. L’exécuteur des hautes œuvres de la sainte Inquisition, lequel était sous-diacre, brûlait à la vérité les gens à merveille, mais il n’était pas accoutumé à pendre : la corde était mouillée et glissa mal, elle fut mal nouée ; enfin je respirais encore : l’incision cruciale me fit jeter un si grand cri que mon chirurgien tomba à la renverse ; et, croyant qu’il disséquait le diable, il s’enfuit en mourant de peur, et tomba encore sur l’escalier en fuyant. Sa femme accourut au bruit, d’un cabinet voisin : elle me vit sur la table étendu avec mon incision cruciale ; elle eut encore plus de peur que son mari, s’enfuit, et tomba sur lui. Quand ils furent un peu revenus à eux, j’entendis la chirurgienne qui disait au chirurgien : « Mon bon, de quoi vous avisez-vous aussi de disséquer un hérétique ? Ne savez-vous pas que le diable est toujours dans le corps de ces gens-là ? Je vais vite chercher un prêtre pour l’exorciser. » Je frémis à ce propos, et je ramassai le peu de forces qui me restaient pour crier : « Ayez pitié de moi ! » Enfin le barbier portugais s’enhardit : il recousit ma peau ; sa femme même eut soin de moi ; je fus sur pied au bout de quinze jours. Le barbier me trouva une condition, et me fit laquais d’un chevalier de Malte qui allait à Venise ; mais mon maître n’ayant pas de quoi me payer, je me mis au service d’un marchand vénitien, et je le suivis à Constantinople.", "en": "“It is true,” answered Pangloss, “you saw me hanged, though I ought properly to have been burnt; but you may remember that it rained extremely hard when they were going to roast me. The storm was so violent that they found it impossible to light the fire; so they hanged me because they could do no better. A surgeon purchased my body, carried it home, and prepared to dissect me. He began by making a crucial incision from my navel to the clavicle. It is impossible for any one to have been more lamely hanged than I had been. The executioner of the Holy Inquisition was a subdeacon, and knew how to burn people very well, but as for hanging, he was a novice at it, being quite out of the way of his practice; the cord being wet, and not slipping properly, the noose did not join. In short, I still continued to breathe; the crucial incision made me scream to such a degree that my surgeon fell flat upon his back; and imagining it was the devil he was dissecting, ran away, and in his fright tumbled downstairs. His wife hearing the noise flew from the next room, and, seeing me stretched upon the table with my crucial incision, was still more terrified than her husband. She took to her heels and fell over him. When they had a little recovered themselves, I heard her say to her husband, ‘My dear, how could you think of dissecting an heretic? Don’t you know that the devil is always in them? I’ll run directly to a priest to come and drive the evil spirit out.’ I trembled from head to foot at hearing her talk in this manner, and exerted what little strength I had left to cry out, ‘Have mercy on me!’ At length the Portuguese barber took courage, sewed up my wound, and his wife nursed me; and I was upon my legs in a fortnight’s time. The barber got me a place as lackey to a Knight of Malta who was going to Venice; but finding my master had no money to pay me my wages, I entered into the service of a Venetian merchant, and went with him to Constantinople."}, {"fr": "« Un jour il me prit fantaisie d’entrer dans une mosquée ; il n’y avait qu’un vieux iman et une jeune dévote très-jolie qui disait ses patenôtres ; sa gorge était toute découverte : elle avait entre ses deux tétons un beau bouquet de tulipes, de roses, d’anémones, de renoncules, d’hyacinthes, et d’oreilles d’ours ; elle laissa tomber son bouquet ; je le ramassai, et je le lui remis avec un empressement très-respectueux. Je fus si longtemps à le lui remettre que l’iman se mit en colère, et voyant que j’étais chrétien, il cria à l’aide. On me mena chez le cadi, qui me fit donner cent coups de latte sous la plante des pieds, et m’envoya aux galères. Je fus enchaîné précisément dans la même galère et au même banc que monsieur le baron. Il y avait dans cette galère quatre jeunes gens de Marseille, cinq prêtres napolitains, et deux moines de Corfou, qui nous dirent que de pareilles aventures arrivaient tous les jours. Monsieur le baron prétendait qu’il avait essuyé une plus grande injustice que moi ; je prétendais, moi, qu’il était beaucoup plus permis de remettre un bouquet sur la gorge d’une femme que d’être tout nu avec un icoglan. Nous disputions sans cesse, et nous recevions vingt coups de nerf de bœuf par jour, lorsque l’enchaînement des évènements de cet univers vous a conduit dans notre galère, et que vous nous avez rachetés.", "en": "“One day I happened to enter a mosque, where I saw no one but an old imam and a very pretty young female devotee, who was saying her prayers; her neck was quite bare, and in her bosom she had a beautiful nosegay of tulips, roses, anemones, ranunculuses, hyacinths, and auriculas. She let fall her nosegay. I ran immediately to take it up, and presented it to her with a most respectful bow. I was so long in delivering it, that the imam began to be angry; and, perceiving I was a Christian, he cried out for help; they carried me before the cadi, who ordered me to receive one hundred bastinadoes, and sent me to the galleys. I was chained in the very galley, and to the very same bench with my lord the Baron. On board this galley there were four young men belonging to Marseilles, five Neapolitan priests, and two monks of Corfu, who told us that the like adventures happened every day. The Baron pretended that he had been worse used than myself; and I insisted that there was far less harm in taking up a nosegay, and putting it into a woman’s bosom, than to be found stark naked with a young Icoglan. We were continually in dispute, and received twenty lashes a day with a thong, when the concatenation of sublunary events brought you on board our galley to ransom us from slavery.”"}, {"fr": "— Eh bien ! mon cher Pangloss, lui dit Candide, quand vous avez été pendu, disséqué, roué de coups, et que vous avez ramé aux galères, avez-vous toujours pensé que tout allait le mieux du monde ?", "en": "“Well, my dear Pangloss,” said Candide to him, “when you were hanged, dissected, whipped, and tugging at the oar, did you continue to think that every thing in this world happens for the best?”"}, {"fr": "— Je suis toujours de mon premier sentiment, répondit Pangloss ; car enfin je suis philosophe : il ne me convient pas de me dédire, Leibnitz ne pouvant pas avoir tort, et l’harmonie préétablie étant d’ailleurs la plus belle chose du monde, aussi bien que le plein et la matière subtile. »", "en": "“I have always abided by my first opinion,” answered Pangloss; “for, after all, I am a philosopher; and it would not become me to retract my sentiments; especially, as Leibnitz could not be in the wrong; and that pre-established harmony is the finest thing in the world, as well as the plenum and the materia subtilis.”"}, {"fr": "Pendant que Candide, le baron, Pangloss, Martin, et Cacambo, contaient leurs aventures, qu’ils raisonnaient sur les évènements contingents ou non contingents de cet univers, qu’ils disputaient sur les effets et les causes, sur le mal moral et sur le mal physique, sur la liberté et la nécessité, sur les consolations que l’on peut éprouver lorsqu’on est aux galères en Turquie, ils abordèrent sur le rivage de la Propontide, à la maison du prince de Transylvanie. Les premiers objets qui se présentèrent furent Cunégonde et la vieille, qui étendaient des serviettes sur des ficelles pour les faire sécher.", "en": "While Candide, the Baron, Pangloss, Martin, and Cacambo were relating their several adventures, and reasoning on the contingent or non-contingent events of this world; while they were disputing on causes and effects, on moral and physical evil, on free wall and necessity, and on the consolation that may be felt by a person when a slave and chained to an oar in a Turkish galley, they arrived at the house of the Transylvanian prince on the coasts of the Propontis. The first objects they beheld there were Miss Cunegund and the old woman, who were hanging some table-cloths on a line to dry."}, {"fr": "Le baron pâlit à cette vue. Le tendre amant Candide, en voyant sa belle Cunégonde rembrunie, les yeux éraillés, la gorge sèche, les joues ridées, les bras rouges et écaillés, recula trois pas, saisi d’horreur, et avança ensuite par bon procédé. Elle embrassa Candide et son frère ; on embrassa la vieille : Candide les racheta toutes deux.", "en": "The Baron turned pale at the sight. Even the tender Candide, that affectionate lover, upon seeing his fair Cunegund all sun-burnt, with blear eyes, a withered neck, wrinkled face and arms, all covered with a red scurf, started back with horror; but, recovering himself, he advanced towards her out of good manners. She embraced Candide and her brother; they embraced the old woman, and Candide ransomed them both."}, {"fr": "Il y avait une petite métairie dans le voisinage ; la vieille proposa à Candide de s’en accommoder, en attendant que toute la troupe eût une meilleure destinée. Cunégonde ne savait pas qu’elle était enlaidie, personne ne l’en avait avertie : elle fit souvenir Candide de ses promesses avec un ton si absolu que le bon Candide n’osa pas la refuser. Il signifia donc au baron qu’il allait se marier avec sa sœur. « Je ne souffrirai jamais, dit le baron, une telle bassesse de sa part, et une telle insolence de la vôtre ; cette infamie ne me sera jamais reprochée : les enfants de ma sœur ne pourraient entrer dans les chapitres d’Allemagne. Non, jamais ma sœur n’épousera qu’un baron de l’empire. » Cunégonde se jeta à ses pieds, et les baigna de larmes ; il fut inflexible. « Maître fou, lui dit Candide, je t’ai réchappé des galères, j’ai payé ta rançon, j’ai payé celle de ta sœur ; elle lavait ici des écuelles, elle est laide, j’ai la bonté d’en faire ma femme ; et tu prétends encore t’y opposer ! je te retuerais si j’en croyais ma colère.", "en": "There was a small farm in the neighbourhood, which the old woman proposed to Candide to make a shift with till the company should meet with a more favourable destiny. Cunegund, not knowing that she was grown ugly, as no one had informed her of it, reminded Candide of his promise in so peremptory a manner that the simple lad did not dare to refuse her; he then acquainted the Baron that he was going to marry his sister. “I will never suffer,” said the Baron, “my sister to be guilty of an action so derogatory to her birth and family; nor will I bear this insolence on your part: no, I never will be reproached that my nephews are not qualified for the first ecclesiastical dignities in Germany; nor shall a sister of mine ever be the wife of any person below the rank of a baron of the Empire.” Cunegund flung herself at her brother’s feet, and bedewed them with her tears, but he still continued inflexible. “Thou foolish fellow,” said Candide, “have I not delivered thee from the galleys, paid thy ransom, and thy sister’s too who was a scullion, and is very ugly, and yet I condescend to marry her? and shalt thou make claim to oppose the match? If I were to listen only to the dictates of my anger, I should kill thee again.”"}, {"fr": "Tu peux me tuer encore, dit le baron, mais tu n’épouseras pas ma sœur de mon vivant. »", "en": "“Thou mayest kill me again,” said the Baron, “but thou shalt not marry my sister while I am living.”"}, {"fr": "Candide, dans le fond de son cœur, n’avait aucune envie d’épouser Cunégonde ; mais l’impertinence extrême du baron le déterminait à conclure le mariage, et Cunégonde le pressait si vivement qu’il ne pouvait s’en dédire. Il consulta Pangloss, Martin, et le fidèle Cacambo. Pangloss fit un beau mémoire par lequel il prouvait que le baron n’avait nul droit sur sa sœur, et qu’elle pouvait, selon toutes les lois de l’empire, épouser Candide de la main gauche. Martin conclut à jeter le baron dans la mer ; Cacambo décida qu’il fallait le rendre au levanti patron, et le remettre aux galères, après quoi on l’enverrait à Rome au père général par le premier vaisseau. L’avis fut trouvé fort bon ; la vieille l’approuva ; on n’en dit rien à sa sœur ; la chose fut exécutée pour quelque argent, et on eut le plaisir d’attraper un jésuite, et de punir l’orgueil d’un baron allemand.", "en": "Candide had, in truth, no great inclination to marry Cunegund; but the extreme impertinence of the baron determined him to conclude the match; and Cunegund pressed him so warmly that he could not recant. He consulted Pangloss, Martin, and the faithful Cacambo. Pangloss composed a fine memorial, by which he proved that the Baron had no right over his sister; and that she might, according to all the laws of the Empire, marry Candide with the left hand. Martin concluded that they should throw the Baron into the sea: Cacambo decided that he must be delivered to the Turkish captain and sent to the galleys; after which he should be conveyed by the first ship to the Father General at Rome. This advice was found to be very good; the old woman approved of it, and not a syllable was said to his sister; the business was executed for a little money: and they had the pleasure of tricking a Jesuit and punishing the pride of a German baron."}, {"fr": "Il était tout naturel d’imaginer qu’après tant de désastres, Candide, marié avec sa maîtresse et vivant avec le philosophe Pangloss, le philosophe Martin, le prudent Cacambo, et la vieille, ayant d’ailleurs rapporté tant de diamants de la patrie des anciens Incas, mènerait la vie du monde la plus agréable ; mais il fut tant friponné par les juifs, qu’il ne lui resta plus rien que sa petite métairie ; sa femme, devenant tous les jours plus laide, devint acariâtre et insupportable ; la vieille était infirme, et fut encore de plus mauvaise humeur que Cunégonde. Cacambo, qui travaillait au jardin, et qui allait vendre des légumes à Constantinople, était excédé de travail, et maudissait sa destinée. Pangloss était au désespoir de ne pas briller dans quelque université d’Allemagne. Pour Martin, il était fermement persuadé qu’on est également mal partout ; il prenait les choses en patience. Candide, Martin, et Pangloss, disputaient quelquefois de métaphysique et de morale.", "en": "It was altogether natural to imagine that after undergoing so many disasters, Candide married to his mistress, and living with the philosopher Pangloss, the philosopher Martin, the prudent Cacambo, and the old woman, having besides brought home so many diamonds from the country of the ancient Incas, would lead the most agreeable life in the world. But he had been so much cheated by the Jews that he had nothing else left but his little farm; his wife, every day growing more and more ugly, became ill-natured and insupportable; the old woman was infirm, and more bad-tempered yet than Cunegund. Cacambo, who worked in the garden, and carried the produce of it to sell at Constantinople, was past his labour, and cursed his fate. Pangloss despaired of making a figure in any of the German universities. And as to Martin, he was firmly persuaded that a person is equally ill-situated everywhere. He took things with patience. Candide, Martin, and Pangloss disputed sometimes about metaphysics and morality. Boats were often seen passing under the windows of the farm fraught with effendis, pashas, and cadis, that were going into banishment to Lemnos, Mytilene, and Erzeroum. And other cadis, pashas, and effendis were seen coming back to succeed the place of the exiles, and were driven out in their turns. They saw several heads very curiously stuffed with straw, being carried as presents to the Sublime Porte. Such sights gave occasion to frequent dissertations; and when no disputes were carried on, the irksomeness was so excessive that the old woman ventured one day to say to them:"}, {"fr": "On voyait souvent passer sous les fenêtres de la métairie des bateaux chargés d’effendis, de bachas, de cadis, qu’on envoyait en exil à Lemnos, à Mytilène, à Erzeroum ; on voyait venir d’autres cadis, d’autres bachas, d’autres effendis, qui prenaient la place des expulsés, et qui étaient expulsés à leur tour ; on voyait des têtes proprement empaillées qu’on allait présenter à la sublime Porte. Ces spectacles faisaient redoubler les dissertations ; et quand on ne disputait pas, l’ennui était si excessif, que la vieille osa un jour leur dire : « Je voudrais savoir lequel est le pire, ou d’être violée cent fois par des pirates nègres, d’avoir une fesse coupée, de passer par les baguettes chez les Bulgares, d’être fouetté et pendu dans un auto-da-fé, d’être disséqué, de ramer en galère, d’éprouver enfin toutes les misères par lesquelles nous avons tous passé, ou bien de rester ici à ne rien faire ?", "en": "“I would be glad to know which is worst, to be ravished a hundred times by negro pirates, to have one buttock cut off, to run the gauntlet among the Bulgarians, to be whipped and hanged at an auto-da-fé, to be dissected, to be chained to an oar in a galley, and in short to experience all the miseries through which every one of us hath passed,—or to remain here doing nothing?”"}, {"fr": "C’est une grande question », dit Candide.", "en": "“This,” said Candide, “is a big question.”"}, {"fr": "Ce discours fit naître de nouvelles réflexions, et Martin surtout conclut que l’homme était né pour vivre dans les convulsions de l’inquiétude, ou dans la léthargie de l’ennui. Candide n’en convenait pas, mais il n’assurait rien. Pangloss avouait qu’il avait toujours horriblement souffert ; mais ayant soutenu une fois que tout allait à merveille, il le soutenait toujours, et n’en croyait rien.", "en": "This discourse gave birth to new reflections, and Martin especially concluded that man was born to live in the convulsions of disquiet, or in the lethargy of idleness. Though Candide did not absolutely agree to this; yet he was sure of nothing. Pangloss avowed that he had undergone dreadful sufferings; but having once maintained that everything went on as well as possible, he still maintained it, and at the same time believed nothing of it."}, {"fr": "Une chose acheva de confirmer Martin dans ses détestables
