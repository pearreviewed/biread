/* A fixed height, not min-height: it gives the flex chain below a definite
   height, so the book can size itself against the space actually left over
   after the header — whatever height the header wraps to. Sizing the book
   against the viewport instead pushes its bottom margin, and with it the page
   number off the bottom of a short window. */
body {
  height: 100vh; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 15%, #2c2418 0%, #1c160f 55%, #120d08 100%);
  display: flex; flex-direction: column; font-family: 'Charis SIL', Charter, Cambria, Georgia, serif; color: #ded2b8;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid rgba(200,175,130,.85); outline-offset: 2px; }

/* A warm text selection, in the reader's own accent — highlighting a phrase to
   correct it (or just to read) should sit in the book, not flash browser-blue. */
::selection { background: rgba(180,150,100,.5); }
::-moz-selection { background: rgba(180,150,100,.5); }

/* ---------- header ---------- */
#app-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 30px; border-bottom: 1px solid rgba(180,150,100,.14); flex-wrap: wrap; }
.header-left { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #8f7d5e; white-space: nowrap; }
.booktitle { font-size: 18px; color: #cbbc9b; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
/* The counter is the page finder: it already says where you are, so it is also
   what takes you elsewhere. Sized alike so swapping one for the other does not
   shift the header, and wide enough for a two-digit "12 / 38" on one line —
   `nowrap` is load-bearing: without it a two-digit count wraps inside the box,
   the counter grows to two lines, and the whole header jumps taller past page 9. */
.counter, .counter-input { font-family: inherit; font-size: 13px; letter-spacing: .18em; min-width: 72px; width: 72px; text-align: right; white-space: nowrap; padding: 3px 6px; border-radius: 6px; }
.counter { color: #7d6e52; background: none; border: 1px solid transparent; }
.counter:hover { color: #c8b891; border-color: rgba(180,150,100,.28); }
.counter:empty { visibility: hidden; }
.counter-input { color: #f4ead0; background: rgba(120,95,55,.16); border: 1px solid rgba(200,175,130,.55); outline: none; }

/* Copy a link to the current page. The address bar already tracks the page, so
   this is the discoverable way to hand it to another device. */
.link-btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: none; color: #7d6e52; position: relative; }
.link-btn:hover, .link-btn.active { color: #c8b891; border-color: rgba(180,150,100,.28); }
.link-btn.copied { color: #b9c99a; }
.link-btn.copied::after { content: 'Link copied'; position: absolute; top: calc(100% + 6px); right: 0; white-space: nowrap; font-size: 12px; letter-spacing: .04em; color: #cdbf9d; background: #211b14; border-radius: 6px; padding: 4px 8px; box-shadow: 0 8px 22px rgba(0,0,0,.5); animation: xfade .16s ease-out; }

/* Link + download are a "take it with you" pair at the far edge, set a little
   apart from the controls that work the book in place. The gap goes before the
   pair (on the link, which leads it); the two stay tight together. */
#link-btn { margin-left: 8px; }
/* .link-btn sets display:flex, which would otherwise defeat the `hidden`
   attribute that keeps the download out of a plain build (no format embedded). */
.dl-btn[hidden] { display: none; }
.edits-btn[hidden] { display: none; }
/* Placed after .link-btn.copied::after so it wins for the edits button. */
.edits-btn.copied::after { content: 'Edits link copied'; }

.btn-pill { font-size: 14px; color: #e4d7ba; background: rgba(120,95,55,.16); border: 1px solid rgba(180,150,100,.28); border-radius: 999px; padding: 7px 16px; }
.segmented-row { display: flex; align-items: center; gap: 6px; }
.segmented { display: flex; align-items: stretch; border: 1px solid rgba(180,150,100,.28); border-radius: 999px; overflow: hidden; }
.segmented button { font-size: 14px; border: none; padding: 7px 15px; background: transparent; color: #c8b891; transition: background .2s ease, color .2s ease; }
.segmented button[aria-pressed="true"] { background: rgba(180,150,100,.26); color: #f4ead0; }
.segmented button[aria-disabled="true"] { color: rgba(228,215,186,.34); cursor: default; opacity: .6; }
.seg-divider { width: 1px; align-self: stretch; background: rgba(180,150,100,.28); }
.info-btn { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(180,150,100,.5); background: transparent; color: #d8c8a4; font-family: Georgia, serif; font-style: italic; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.info-btn.active { background: rgba(180,150,100,.22); }

.nav-controls { display: flex; align-items: center; border: 1px solid rgba(180,150,100,.28); border-radius: 999px; overflow: hidden; }
.nav-controls button { font-size: 14px; color: #e4d7ba; background: transparent; border: none; padding: 7px 12px; letter-spacing: .02em; }
.nav-controls button.active { background: rgba(180,150,100,.2); }
.bm-star { display: flex; align-items: center; }
.bm-star svg { display: block; transition: fill .18s ease; }

.fontsize-control { display: flex; align-items: center; border: 1px solid rgba(180,150,100,.28); border-radius: 999px; overflow: hidden; }
.fontsize-control button { color: #e4d7ba; background: transparent; border: none; padding: 7px 13px; }
.fontsize-control button:first-child { font-size: 13px; }
.fontsize-control button:last-child { font-size: 17px; padding: 5px 13px; }

/* ---------- crossing to the builder ---------- */
/* Rare, one-way, and not something you flip while reading — so a quiet link in
   the desk's bottom-left corner rather than a header control. Present only when
   the book carries a builder URL; `[hidden]` needs the explicit rule because
   `display: flex` would otherwise defeat the attribute. */
#builder-link { position: fixed; left: 22px; bottom: 16px; z-index: 30; display: flex; align-items: center; gap: 6px; padding: 4px 6px; color: #7d6e52; font-size: 13px; letter-spacing: .02em; text-decoration: none; transition: color .15s ease; }
#builder-link:hover { color: #c8b891; }
#builder-link svg { display: block; }
#builder-link[hidden] { display: none; }
@media (max-width: 640px) { #builder-link { display: none; } }

/* ---------- book ---------- */
#stage-wrap { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; perspective: 2400px; padding: 14px 24px 20px; }
#stage-wrap.mobile { perspective: 1800px; padding: 12px 16px 16px; }

/* The spread is sized in JS (sizeBook): the largest 7:5 box that fits the stage
   both ways. On a wide window it fills the height and centres with a little desk
   either side; on a tall one it fills the width; on a huge screen it is capped.
   Height is always taken from the final width, so no cap can flatten the ratio —
   which a bare max-width used to do, squaring the book off on big screens. Width
   still follows height on a short window, and the type scales with the book, so
   the line length stays roughly constant. */
.book-desk { position: relative; margin: 0 auto; border-radius: 5px; cursor: pointer; background: #e9ddc0; transition: opacity .18s ease; box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 34px 70px -24px rgba(0,0,0,.72), 0 10px 26px rgba(0,0,0,.45); }
.book-mobile { position: relative; width: min(560px,92vw); height: 100%; max-height: 1200px; margin: 0 auto; border-radius: 5px; cursor: pointer; transition: opacity .18s ease; }

/* Set by markOverflow() when a rendered page turns out taller than its box —
   an over-long paragraph, or a published column longer than the translation
   pagination measured. Ordinary pages never scroll. */
.page.overflowing, .page-mobile.overflowing { overflow-y: auto; scrollbar-width: thin; }

.gutter { position: absolute; top: 0; bottom: 0; left: calc(50% - 32px); width: 64px; pointer-events: none; z-index: 4; background: linear-gradient(90deg, rgba(55,35,12,0) 0%, rgba(55,35,12,.06) 38%, rgba(45,28,10,.1) 48.5%, rgba(45,28,10,.2) 50%, rgba(45,28,10,.1) 51.5%, rgba(55,35,12,.06) 62%, rgba(55,35,12,0) 100%); }

/* Offscreen twin of the book, used to lay out a page before it is shown.
   It carries the real classes so measurement can never drift from the CSS. */
#measure-host { position: fixed; left: -10000px; top: 0; visibility: hidden; pointer-events: none; z-index: -1; }

.chapter-heading { margin-bottom: 14px; }
.ch-eyebrow { font-size: calc(var(--fpx) * 0.6); letter-spacing: .32em; text-transform: uppercase; color: #8a7551; font-weight: 600; }
.ch-title { font-size: calc(var(--fpx) * 1.32); line-height: 1.12; margin: 7px 0 0; color: #2a1f12; font-weight: 600; }
.ch-rule { height: 1px; background: linear-gradient(90deg,#b7a67f,transparent); margin: 16px 0 0; }

p.pair { margin: 0 -12px 0.5em; padding: 2px 12px; font-size: var(--fpx); line-height: 1.5; text-align: justify; text-indent: 1.4em; hyphens: auto; border-radius: 4px; background: transparent; transition: filter .34s ease; }
/* Hover targets. Only the unit highlights — no paragraph tint; that was
   removed from the design deliberately. */
.unit { border-radius: 3px; cursor: help; transition: background .12s ease; }
.unit:hover, .unit.pinned { background: rgba(180,150,100,.26); }

.tip { position: fixed; z-index: 70; max-width: 300px; background: #211b14; color: #efe6d2; border-radius: 8px; padding: 9px 12px; box-shadow: 0 12px 32px rgba(0,0,0,.55); pointer-events: none; animation: xfade .12s ease-out; }
.tip-surface { font-size: 15px; color: #f4ead0; }
.tip-pos { font-size: 12px; font-style: italic; color: #9a8a6a; margin-top: 1px; }
.tip-gloss { font-size: 14px; line-height: 1.4; margin-top: 6px; }
.tip-form { font-size: 12.5px; color: #c3b590; margin-top: 4px; }
.tip-form-label { color: #9a8a6a; }

/* A paragraph resumed from the previous page is not a new paragraph. */
p.pair.continued { text-indent: 0; }
p.pair-fr { color: #332a1d; }
/* The AI column is explicitly selectable so a reader can highlight a phrase to
   correct it — a page turn happens on a click, not a drag (see onBookClick). */
p.pair-en { color: #4b4335; -webkit-user-select: text; user-select: text; }
p.pair-en.blurred { filter: blur(5px); }
.xfade { animation: xfade .32s ease; }

/* The same folio sits at the outer bottom corner of both pages, so a glance
   confirms the French left and the translated right are one page in two
   languages, not two facing pages. The outer top corner names each page's
   language: FR on the left, the target code on the right. */
.page-num { position: absolute; bottom: calc(var(--fpx) * 1.05); font-size: 13px; letter-spacing: .2em; color: #9c8a66; transition: opacity .34s ease; }
.page-num-left { left: calc(var(--fpx) * 2.9); }
.page-num-right { right: calc(var(--fpx) * 2.9); }
.page-num-mobile { position: absolute; bottom: calc(var(--fpx)); right: calc(var(--fpx) * 1.5); font-size: 13px; letter-spacing: .2em; color: #9c8a66; }
.page-corner { position: absolute; top: calc(var(--fpx) * 1.05); font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: #9c8a66; transition: opacity .34s ease; }
.page-corner-left { left: calc(var(--fpx) * 2.9); }
.page-corner-right { right: calc(var(--fpx) * 2.9); }
/* With blur on, the translation side gives nothing away: its language tag and
   its folio fade out with the text, so the hidden page has no tells. */
.page-corner.blurred, .page-num.blurred { opacity: 0; }

.mobile-pair { padding: 4px 12px; margin: 0 -12px; }
.mobile-pair .pair-fr { margin: 0 0 .35em; padding: 0; }
.mobile-pair .pair-en { margin: 0; padding: 0; font-style: italic; font-size: calc(var(--fpx) - 1px); }
.mobile-divider { height: 1px; background: rgba(120,90,45,.18); margin: 16px 0 14px; }

/* ---------- page turn ---------- */
.leaf { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; z-index: 6; pointer-events: none; transition: transform .58s cubic-bezier(.42,.10,.22,1); }
.leaf-mobile { position: absolute; inset: 0; transform-style: preserve-3d; z-index: 6; pointer-events: none; transition: transform .55s cubic-bezier(.42,.10,.22,1); }
.leaf-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf-shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; animation: pageShade .58s ease-in-out; backface-visibility: hidden; }

/* ---------- marginal furniture ---------- */
.ribbon { position: absolute; top: -4px; width: 22px; height: 42px; z-index: 7; cursor: pointer; filter: drop-shadow(0 4px 5px rgba(0,0,0,.34)); }
.ribbon-inner { width: 100%; height: 100%; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%); background: linear-gradient(100deg, #7c3a3d 0%, #85434a 38%, #8b4c4d 50%, #834348 62%, #78383c 100%); box-shadow: inset 0 0 5px rgba(60,20,22,.16); }


/* ---------- overlays ---------- */
.popover { background: #211b14; color: #efe6d2; border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,.55); padding: 12px 8px; z-index: 60; position: fixed; top: calc(var(--header-h, 66px) + 8px); right: 30px; width: 280px; max-height: 60vh; overflow-y: auto; animation: xfade .16s ease-out; }
.popover.mobile { left: 16px; right: 16px; width: auto; }
/* The download menu is short — two rows at most — so it need not be as wide. */
.popover.dl-menu { width: 208px; }
.popover.dl-menu.mobile { width: auto; }
.popover-title { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #8f7d5e; padding: 2px 12px 8px; }
.popover-row { display: block; width: 100%; text-align: left; background: transparent; border: none; border-radius: 6px; padding: 8px 12px; color: #e7dcc2; }
.popover-row.active { background: rgba(180,150,100,.16); }
.popover-row .sub { font-size: 15px; font-style: italic; margin-top: 1px; }

/* ---------- revise ---------- */
/* The floating control by a selection in the AI column, and the key panel. Both
   speak the reader's dark-panel language; no number ever appears in either. */
.revise { position: fixed; z-index: 72; width: 280px; max-width: calc(100vw - 16px); background: #211b14; color: #efe6d2; border-radius: 9px; box-shadow: 0 14px 36px rgba(0,0,0,.55); padding: 10px; animation: xfade .12s ease-out; }
.revise-note, .revise-edit { width: 100%; font-family: inherit; font-size: 14px; color: #f4ead0; background: rgba(120,95,55,.16); border: 1px solid rgba(200,175,130,.4); border-radius: 6px; padding: 6px 8px; outline: none; }
.revise-edit { line-height: 1.4; resize: vertical; }
.revise-note::placeholder, .revise-edit::placeholder { color: #9a8a6a; }
.revise-row { display: flex; gap: 8px; margin-top: 8px; }
.revise-btn { flex: 1; font-family: inherit; font-size: 13px; color: #e4d7ba; background: rgba(120,95,55,.16); border: 1px solid rgba(180,150,100,.34); border-radius: 999px; padding: 6px 12px; }
.revise-btn:hover:not(:disabled) { background: rgba(180,150,100,.26); }
.revise-btn.primary { color: #1c160f; background: #d8c39a; border-color: transparent; font-weight: 600; }
.revise-btn:disabled { opacity: .5; cursor: default; }
.revise-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.revise-link { background: none; border: none; color: #a2926f; font-size: 12px; padding: 2px; text-decoration: underline; }
.revise-link:hover { color: #c8b891; }
.revise-status { margin-top: 8px; font-size: 12.5px; font-style: italic; color: #a99a78; }
.revise-status.error { color: #d29c86; font-style: normal; }

/* A corrected paragraph carries a small revert mark in the outer margin. It is
   absolutely positioned, so it is invisible to pagination's height measurement. */
p.pair-en.revised { position: relative; }
.revise-undo { position: absolute; top: 3px; right: -17px; width: 16px; height: 16px; padding: 0; line-height: 15px; text-align: center; font-size: 12px; border: none; border-radius: 50%; background: rgba(180,150,100,.24); color: #8a7551; }
.revise-undo:hover { background: rgba(180,150,100,.42); color: #3a3125; }

.revise-key-input { width: 100%; margin-top: 12px; font-family: inherit; font-size: 14px; color: #f4ead0; background: rgba(120,95,55,.16); border: 1px solid rgba(200,175,130,.4); border-radius: 6px; padding: 7px 9px; outline: none; }
.revise-key-input::placeholder { color: #9a8a6a; }
.revise-remember { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 13px; color: #c3b590; cursor: pointer; accent-color: #b79a5f; }
/* When Rewrite-without-a-key raises the panel, it sits above the control that
   is still holding the selection behind it, so the consent copy stays readable
   and the note the reader typed survives into the rewrite. */
.info-panel.revise-key { z-index: 80; }
.info-panel.revise-key .revise-row { margin-top: 14px; }

<script type="application/json" id="book-data">{"titleFr": "Candide, ou l'Optimisme", "slug": "candide-ou-l-optimisme", "publishedAvailable": false, "publishedNote": "Your translation keeps pace with the French as closely as two editions allow. It has its own notes and front matter, which stay behind. A few passages have no counterpart here.", "pairs": [{"fr": "Il y avait en Vestphalie, dans le château de M. le baron de Thunder-ten-tronckh, un jeune garçon à qui la nature avait donné les mœurs les plus douces. Sa physionomie annonçait son âme. Il avait le jugement assez droit, avec l’esprit le plus simple ; c’est, je crois, pour cette raison qu’on le nommait Candide. Les anciens domestiques de la maison soupçonnaient qu’il était fils de la sœur de monsieur le baron et d’un bon et honnête gentilhomme du voisinage, que cette demoiselle ne voulut jamais épouser parce qu’il n’avait pu prouver que soixante et onze quartiers, et que le reste de son arbre généalogique avait été perdu par l’injure du temps.", "en": "In the country of Westphalia, in the castle of the most noble Baron of Thunder-ten-tronckh, lived a youth whom nature had endowed with a most sweet disposition. His face was the true index of his mind. He had a solid judgment joined to the most unaffected simplicity; and hence, I presume, he had his name of Candide. The old servants of the house suspected him to have been the son of the Baron’s sister, by a mighty good sort of a gentleman of the neighbourhood, whom that young lady refused to marry, because he could produce no more than threescore and eleven quarterings in his arms; the rest of the genealogical tree belonging to the family having been lost through the injuries of time."}, {"fr": "Monsieur le baron était un des plus puissants seigneurs de la Vestphalie, car son château avait une porte et des fenêtres. Sa grande salle même était ornée d’une tapisserie. Tous les chiens de ses basses-cours composaient une meute dans le besoin ; ses palefreniers étaient ses piqueurs ; le vicaire du village était son grand aumônier. Ils l’appelaient tous Monseigneur, et ils riaient quand il faisait des contes.", "en": "The Baron was one of the most powerful lords in Westphalia; for his castle had not only a gate, but even windows; and his great hall was hung with tapestry. He used to hunt with his mastiffs and spaniels instead of greyhounds; his groom served him for huntsman; and the parson of the parish officiated as grand almoner. He was called “My Lord” by all his people, and he never told a story but every one laughed at it."}, {"fr": "Madame la baronne, qui pesait environ trois cent cinquante livres, s’attirait par là une très-grande considération, et faisait les honneurs de la maison avec une dignité qui la rendait encore plus respectable. Sa fille Cunégonde, âgée de dix-sept ans, était haute en couleur, fraîche, grasse, appétissante. Le fils du baron paraissait en tout digne de son père. Le précepteur Pangloss était l’oracle de la maison, et le petit Candide écoutait ses leçons avec toute la bonne foi de son âge et de son caractère.", "en": "My lady Baroness weighed three hundred and fifty pounds, consequently was a person of no small consideration; and then she did the honours of the house with a dignity that commanded universal respect. Her daughter Cunegund was about seventeen years of age, fresh coloured, comely, plump, and desirable. The Baron’s son seemed to be a youth in every respect worthy of his father. Pangloss the preceptor was the oracle of the family, and little Candide listened to his instructions with all the simplicity natural to his age and disposition."}, {"fr": "Pangloss enseignait la métaphysico-théologo-cosmolo-nigologie. Il prouvait admirablement qu’il n’y a point d’effet sans cause, et que, dans ce meilleur des mondes possibles, le château de monseigneur le baron était le plus beau des châteaux, et madame la meilleure des baronnes possibles.", "en": "Master Pangloss taught the metaphysico-theologo-cosmolo-nigology. He could prove to admiration that there is no effect without a cause; and that, in this best of all possible worlds, the Baron’s castle was the most magnificent of all castles, and my lady the best of all possible baronesses."}, {"fr": "« Il est démontré, disait-il, que les choses ne peuvent être autrement : car tout étant fait pour une fin, tout est nécessairement pour la meilleure fin. Remarquez bien que les nez ont été faits pour porter des lunettes ; aussi avons-nous des lunettes. Les jambes sont visiblement instituées pour être chaussées, et nous avons des chausses. Les pierres ont été formées pour être taillées et pour en faire des châteaux ; aussi monseigneur a un très-beau château : le plus grand baron de la province doit être le mieux logé ; et les cochons étant faits pour être mangés, nous mangeons du porc toute l’année. Par conséquent, ceux qui ont avancé que tout est bien ont dit une sottise : il fallait dire que tout est au mieux. »", "en": "“It is demonstrable,” said he, “that things cannot be otherwise than they are; for as all things have been created for some end, they must necessarily be created for the best end. Observe, for instance, the nose is formed for spectacles, therefore we wear spectacles. The legs are visibly designed for stockings, accordingly we wear stockings. Stones were made to be hewn, and to construct castles, therefore my lord has a magnificent castle; for the greatest baron in the province ought to be the best lodged. Swine were intended to be eaten; therefore we eat pork all the year round: and they who assert that everything is right do not express themselves correctly; they should say, that everything is best.”"}, {"fr": "Candide écoutait attentivement, et croyait innocemment : car il trouvait Mlle Cunégonde extrêmement belle, quoiqu’il ne prît jamais la hardiesse de le lui dire. Il concluait qu’après le bonheur d’être né baron de Thunder-ten-tronckh, le second degré de bonheur était d’être Mlle Cunégonde ; le troisième, de la voir tous les jours ; et le quatrième, d’entendre maître Pangloss, le plus grand philosophe de la province, et par conséquent de toute la terre.", "en": "Candide listened attentively, and believed implicitly; for he thought Miss Cunegund excessively handsome, though he never had the courage to tell her so. He concluded that next to the happiness of being Baron of Thunder-ten-tronckh, the next was that of being Miss Cunegund, the next that of seeing her every day, and the last that of hearing the doctrine of Master Pangloss, the greatest philosopher of the whole province, and consequently of the whole world."}, {"fr": "Un jour, Cunégonde, en se promenant auprès du château, dans le petit bois qu’on appelait parc, vit entre des broussailles le docteur Pangloss qui donnait une leçon de physique expérimentale à la femme de chambre de sa mère, petite brune très-jolie et très-docile. Comme Mlle Cunégonde avait beaucoup de disposition pour les sciences, elle observa, sans souffler, les expériences réitérées dont elle fut témoin ; elle vit clairement la raison suffisante du docteur, les effets et les causes, et s’en retourna tout agitée, toute pensive, toute remplie du désir d’être savante, songeant qu’elle pourrait bien être la raison suffisante du jeune Candide, qui pouvait aussi être la sienne.", "en": "One day, when Miss Cunegund went to take a walk in a little neighbouring wood, which was called a park, she saw, through the bushes, the sage Doctor Pangloss giving a lecture in experimental physics to her mother’s chambermaid, a little brown wench, very pretty, and very tractable. As Miss Cunegund had a great disposition for the sciences, she observed with the utmost attention the experiments which were repeated before her eyes; she perfectly well understood the force of the doctor’s reasoning upon causes and effects. She retired greatly flurried, quite pensive, and filled with the desire of knowledge, imagining that she might be a sufficing reason for young Candide, and he for her."}, {"fr": "Elle rencontra Candide en revenant au château, et rougit ; Candide rougit aussi. Elle lui dit bonjour d’une voix entrecoupée ; et Candide lui parla sans savoir ce qu’il disait. Le lendemain, après le dîner, comme on sortait de table, Cunégonde et Candide se trouvèrent derrière un paravent ; Cunégonde laissa tomber son mouchoir, Candide le ramassa ; elle lui prit innocemment la main ; le jeune homme baisa innocemment la main de la jeune demoiselle avec une vivacité, une sensibilité, une grâce toute particulière ; leurs bouches se rencontrèrent, leurs yeux s’enflammèrent, leurs genoux tremblèrent, leurs mains s’égarèrent. M. le baron de Thunder-ten-tronckh passa auprès du paravent, et, voyant cette cause et cet effet, chassa Candide du château à grands coups de pied dans le derrière. Cunégonde s’évanouit : elle fut souffletée par madame la baronne dès qu’elle fut revenue à elle-même ; et tout fut consterné dans le plus beau et le plus agréable des châteaux possibles.", "en": "On her way back she happened to meet Candide; she blushed, he blushed also: she wished him a good morning in a faltering tone; he returned the salute, without knowing what he said. The next day, as they were rising from dinner, Cunegund and Candide slipped behind the screen; she dropped her handkerchief, the young man picked it up. She innocently took hold of his hand, and he as innocently kissed hers with a warmth, a sensibility, a grace—all very extraordinary; their lips met; their eyes sparkled; their knees trembled; their hands strayed. The Baron of Thunder-ten-tronckh chanced to come by; he beheld the cause and effect, and, without hesitation, saluted Candide with some notable kicks on the breech, and drove him out of doors. Miss Cunegund fainted away, and, as soon as she came to herself, the Baroness boxed her ears. Thus a general consternation was spread over this most magnificent and most agreeable of all possible castles."}, {"fr": "Candide, chassé du paradis terrestre, marcha longtemps sans savoir où, pleurant, levant les yeux au ciel, les tournant souvent vers le plus beau des châteaux qui renfermait la plus belle des baronnettes ; il se coucha sans souper au milieu des champs entre deux sillons ; la neige tombait à gros flocons. Candide, tout transi, se traîna le lendemain vers la ville voisine, qui s’appelle Valdberghoff-trarbk-dikdorff, n’ayant point d’argent, mourant de faim et de lassitude. Il s’arrêta tristement à la porte d’un cabaret. Deux hommes habillés de bleu le remarquèrent : « Camarade, dit l’un, voilà un jeune homme très-bien fait, et qui a la taille requise ; ils s’avancèrent vers Candide, et le prièrent à dîner très-civilement.", "en": "Candide, thus driven out of this terrestrial paradise, wandered a long time, without knowing where he went; sometimes he raised his eyes, all bedewed with tears, towards heaven, and sometimes he cast a melancholy look towards the magnificent castle where dwelt the fairest of young baronesses. He laid himself down to sleep in a furrow, heartbroken and supperless. The snow fell in great flakes, and, in the morning when he awoke, he was almost frozen to death; however, he made shift to crawl to the next town, which was called Waldberghoff-trarbk-dikdorff, without a penny in his pocket, and half dead with hunger and fatigue. He took up his stand at the door of an inn. He had not been long there, before two men dressed in blue fixed their eyes steadfastly upon him. “Faith, comrade,” said one of them to the other, “yonder is a well-made young fellow, and of the right size.” Thereupon they made up to Candide, and with the greatest civility and politeness invited him to dine with them."}, {"fr": "Messieurs, leur dit Candide avec une modestie charmante, vous me faites beaucoup d’honneur, mais je n’ai pas de quoi payer mon écot.", "en": "“Gentlemen,” replied Candide, with a most engaging modesty, “you do me much honour, but, upon my word, I have no money.”"}, {"fr": "Ah ! monsieur, lui dit un des bleus, les personnes de votre figure et de votre mérite ne paient jamais rien : n’avez-vous pas cinq pieds cinq pouces de haut ?", "en": "“Money, Sir!” said one of the men in blue to him, “young persons of your appearance and merit never pay anything; why, are not you five feet five inches high?”"}, {"fr": "Oui, messieurs, c’est ma taille, dit-il en faisant la révérence.", "en": "“Yes, gentlemen, that is really my size,” replied he, with a low bow."}, {"fr": "Ah ! monsieur, mettez-vous à table ; non-seulement nous vous défrayerons, mais nous ne souffrirons jamais qu’un homme comme vous manque d’argent ; les hommes ne sont faits que pour se secourir les uns les autres.", "en": "“Come then, Sir, sit down along with us; we will not only pay your reckoning, but will never suffer such a clever young fellow as you to want money. Mankind were born to assist one another.”"}, {"fr": "Vous avez raison, dit Candide ; c’est ce que M. Pangloss m’a toujours dit, et je vois bien que tout est au mieux. » On le prie d’accepter quelques écus, il les prend et veut faire son billet ; on n’en veut point, on se met à table. « N’aimez-vous pas tendrement ?…", "en": "“You are perfectly right, gentlemen,” said Candide; “that is precisely the doctrine of Master Pangloss; and I am convinced that everything is for the best.” His generous companions next entreated him to accept of a few crowns, which he readily complied with, at the same time offering them his note for the payment, which they refused, and sat down to table."}, {"fr": "Oh ! oui, répond-il, j’aime tendrement Mlle Cunégonde.", "en": "“Have you not a great affection for——” “Oh yes!” he replied, “I have a great affection for the lovely Miss Cunegund.”"}, {"fr": "Non, dit l’un de ces messieurs, nous vous demandons si vous n’aimez pas tendrement le roi des Bulgares ?", "en": "“May be so,” replied one of the men, “but that is not the question! We are asking you whether you have not a great affection for the King of the Bulgarians?” “For the King of the Bulgarians?” said Candide. “Not at all. Why, I never saw him in my life.”"}, {"fr": "Point du tout, dit-il, car je ne l’ai jamais vu.", "en": ""}, {"fr": "Comment ! c’est le plus charmant des rois, et il faut boire à sa santé.", "en": "“Is it possible! Oh, he is a most charming king! Come, we must drink his health.”"}, {"fr": "Oh ! très-volontiers, messieurs. » Et il boit. « C’en est assez, lui dit-on, vous voilà l’appui, le soutien, le défenseur, le héros des Bulgares ; votre fortune est faite, et votre gloire est assurée. On lui met sur-le-champ les fers aux pieds, et on le mène au régiment. On le fait tourner à droite, à gauche, hausser la baguette, remettre la baguette, coucher en joue, tirer, doubler le pas, et on lui donne trente coups de bâton ; le lendemain, il fait l’exercice un peu moins mal, et il ne reçoit que vingt coups ; le surlendemain, on ne lui en donne que dix, et il est regardé par ses camarades comme un prodige.", "en": "“With all my heart, gentlemen,” Candide said, and he tossed off his glass. “Bravo!” cried the blues; “you are now the support, the defender, the hero of the Bulgarians; your fortune is made; you are on the high road to glory.” So saying, they put him in irons, and carried him away to the regiment. There he was made to wheel about to the right, to the left, to draw his ramrod, to return his ramrod, to present, to fire, to march, and they gave him thirty blows with a cane; the next day he performed his exercise a little better, and they gave him but twenty; the day following he came off with ten, and was looked upon as a young fellow of surprising genius by all his comrades."}, {"fr": "Candide, tout stupéfait, ne démêlait pas encore trop bien comment il était un héros. Il s’avisa un beau jour de printemps de s’aller promener, marchant tout droit devant lui, croyant que c’était un privilège de l’espèce humaine, comme de l’espèce animale, de se servir de ses jambes à son plaisir. Il n’eut pas fait deux lieues que voilà quatre autres héros de six pieds qui l’atteignent, qui le lient, qui le mènent dans un cachot. On lui demanda juridiquement ce qu’il aimait le mieux d’être fustigé trente-six fois par tout le régiment, ou de recevoir à la fois douze balles de plomb dans la cervelle. Il eut beau dire que les volontés sont libres, et qu’il ne voulait ni l’un ni l’autre, il fallut faire un choix : il se détermina, en vertu du don de Dieu qu’on nomme liberté, à passer trente-six fois par les baguettes ; il essuya deux promenades. Le régiment était composé de deux mille hommes ; cela lui composa quatre mille coups de baguette, qui, depuis la nuque du cou jusqu’au cul, lui découvrirent les muscles et les nerfs. Comme on allait procéder à la troisième course, Candide, n’en pouvant plus, demanda en grâce qu’on voulût bien avoir la bonté de lui casser la tête ; il obtint cette faveur ; on lui bande les yeux ; on le fait mettre à genoux. Le roi des Bulgares passe dans ce moment, s’informe du crime du patient ; et comme ce roi avait un grand génie, il comprit, par tout ce qu’il apprit de Candide, que c’était un jeune métaphysicien fort ignorant des choses de ce monde, et il lui accorda sa grâce avec une clémence qui sera louée dans tous les journaux et dans tous les siècles. Un brave chirurgien guérit Candide en trois semaines avec les émollients enseignés par Dioscoride. Il avait déjà un peu de peau, et pouvait marcher, quand le roi des Bulgares livra bataille au roi des Abares.", "en": "Candide was struck with amazement, and could not for the soul of him conceive how he came to be a hero. One fine spring morning, he took it into his head to take a walk, and he marched straight forward, conceiving it to be a privilege of the human species, as well as of the brute creation, to make use of their legs how and when they pleased. He had not gone above two leagues when he was overtaken by four other heroes, six feet high, who bound him neck and heels, and carried him to a dungeon. A court-martial sat upon him, and he was asked which he liked best, either to run the gauntlet six and thirty times through the whole regiment, or to have his brains blown out with a dozen musket-balls. In vain did he remonstrate to them that the human will is free, and that he chose neither; they obliged him to make a choice, and he determined, in virtue of that divine gift called free will, to run the gauntlet six and thirty times. He had gone through his discipline twice, and the regiment being composed of two thousand men, they composed for him exactly four thousand strokes, which laid bare all his muscles and nerves, from the nape of his neck to his rump. As they were preparing to make him set out the third time, our young hero, unable to support it any longer, begged as a favour they would be so obliging as to shoot him through the head. The favour being granted, a bandage was tied over his eyes, and he was made to kneel down. At that very instant, his Bulgarian Majesty, happening to pass by, inquired into the delinquent’s crime, and being a prince of great penetration, he found, from what he heard of Candide, that he was a young metaphysician, entirely ignorant of the world; and therefore, out of his great clemency, he condescended to pardon him, for which his name will be celebrated in every journal, and in every age. A skilful surgeon made a cure of Candide in three weeks, by means of emollient unguents prescribed by Dioscorides. His sores were now skinned over, and he was able to march, when the King of the Bulgarians gave battle to the King of the Abares."}, {"fr": "Rien n’était si beau, si leste, si brillant, si bien ordonné que les deux armées. Les trompettes, les fifres, les hautbois, les tambours, les canons, formaient une harmonie telle qu’il n’y en eut jamais en enfer. Les canons renversèrent d’abord à peu près six mille hommes de chaque côté ; ensuite la mousqueterie ôta du meilleur des mondes environ neuf à dix mille coquins qui en infectaient la surface. La baïonnette fut aussi la raison suffisante de la mort de quelques milliers d’hommes. Le tout pouvait bien se monter à une trentaine de mille âmes. Candide, qui tremblait comme un philosophe, se cacha du mieux qu’il put pendant cette boucherie héroïque.", "en": "Never was anything so gallant, so well accoutred, so brilliant, and so finely disposed as the two armies. The trumpets, fifes, hautboys, drums, and cannon, made such harmony as never was heard in hell itself. The entertainment began by a discharge of cannon, which, in the twinkling of an eye, laid flat about six thousand men on each side. The musket bullets swept away, out of the best of all possible worlds, nine or ten thousand scoundrels that infested its surface. The bayonet was next the sufficient reason for the deaths of several thousands. The whole might amount to thirty thousand souls. Candide trembled like a philosopher, and concealed himself as well as he could during this heroic butchery."}, {"fr": "Enfin, tandis que les deux rois faisaient chanter des Te Deum, chacun dans son camp, il prit le parti d’aller raisonner ailleurs des effets et des causes. Il passa par-dessus des tas de morts et de mourants, et gagna d’abord un village voisin ; il était en cendres : c’était un village abare que les Bulgares avaient brûlé, selon les lois du droit public. Ici des vieillards criblés de coups regardaient mourir leurs femmes égorgées, qui tenaient leurs enfants à leurs mamelles sanglantes ; là des filles, éventrées après avoir assouvi les besoins naturels de quelques héros, rendaient les derniers soupirs ; d’autres, à demi brûlées, criaient qu’on achevât de leur donner la mort. Des cervelles étaient répandues sur la terre à côté de bras et de jambes coupés.", "en": "At length, while the two kings were causing Te Deum to be sung in each of their camps, Candide took a resolution to go and reason somewhere else upon causes and effects. After passing over heaps of dead or dying men, the first place he came to was a neighbouring village, in the Abarian territories, which had been burnt to the ground by the Bulgarians in accordance with international law. Here lay a number of old men covered with wounds, who beheld their wives dying with their throats cut, and hugging their children to their breasts all stained with blood. There several young virgins, whose bellies had been ripped open after they had satisfied the natural necessities of the Bulgarian heroes, breathed their last; while others, half burnt in the flames, begged to be dispatched out of the world. The ground about them was covered with the brains, arms, and legs of dead men."}, {"fr": "Candide s’enfuit au plus vite dans un autre village : il appartenait à des Bulgares, et les héros abares l’avaient traité de même. Candide, toujours marchant sur des membres palpitants ou à travers des ruines, arriva enfin hors du théâtre de la guerre, portant quelques petites provisions dans son bissac, et n’oubliant jamais Mlle Cunégonde. Ses provisions lui manquèrent quand il fut en Hollande ; mais ayant entendu dire que tout le monde était riche dans ce pays-là, et qu’on y était chrétien, il ne douta pas qu’on ne le traitât aussi bien qu’il l’avait été dans le château de monsieur le baron, avant qu’il en eût été chassé pour les beaux yeux de Mlle Cunégonde.", "en": "Candide made all the haste he could to another village, which belonged to the Bulgarians, and there he found that the heroic Abares had enacted the same tragedy. From thence continuing to walk over palpitating limbs, or through ruined buildings, at length he arrived beyond the theatre of war, with a little provision in his pouch, and Miss Cunegund’s image in his heart. When he arrived in Holland his provisions failed him; but having heard that the inhabitants of that country were all rich and Christians, he made himself sure of being treated by them in the same manner as at the Baron’s castle, before he had been driven from thence through the power of Miss Cunegund’s bright eyes."}, {"fr": "Il demanda l’aumône à plusieurs graves personnages, qui lui répondirent tous que, s’il continuait à faire ce métier, on l’enfermerait dans une maison de correction pour lui apprendre à vivre.", "en": "He asked charity of several grave-looking people, who one and all answered him that if he continued to follow this trade, they would have him sent to the house of correction, where he should be taught to earn his bread."}, {"fr": "Il s’adressa ensuite à un homme qui venait de parler tout seul une heure de suite sur la charité dans une grande assemblée. Cet orateur, le regardant de travers, lui dit : « Que venez-vous faire ici ? y êtes-vous pour la bonne cause ?", "en": "He next addressed himself to a person who had just been haranguing a numerous assembly for a whole hour on the subject of charity. The orator, squinting at him under his broad-brimmed hat, asked him sternly, what brought him thither? and whether he was for the good cause?"}, {"fr": "Il n’y a point d’effet sans cause, répondit modestement Candide ; tout est enchaîné nécessairement, et arrangé pour le mieux. Il a fallu que je fusse chassé d’auprès de Mlle Cunégonde, que j’aie passé par les baguettes, et il faut que je demande mon pain, jusqu’à ce que je puisse en gagner ; tout cela ne pouvait être autrement.", "en": "“Sir,” said Candide, in a submissive manner, “I conceive there can be no effect with a cause; everything is necessarily concatenated and arranged for the best. It was necessary that I should be banished the presence of Miss Cunegund; that I should afterwards run the gauntlet; and it is necessary I should beg my bread, till I am able to earn it: all this could not have been otherwise.”"}, {"fr": "Mon ami, lui dit l’orateur, croyez-vous que le pape soit l’antechrist ?", "en": "“Hark ye, friend,” said the orator, “do you hold the Pope to be Antichrist?”"}, {"fr": "Je ne l’avais pas encore entendu dire, répondit Candide ; mais qu’il le soit, ou qu’il ne le soit pas, je manque de pain.", "en": "“Truly, I never heard anything about it,” said Candide; “but whether he is or not, I am in want of something to eat.”"}, {"fr": "Tu ne mérites pas d’en manger, dit l’autre ; va, coquin ; va, misérable, ne m’approche de ta vie. » La femme de l’orateur ayant mis la tête à la fenêtre, et avisant un homme qui doutait que le pape fût antechrist, lui répandit sur le chef un plein… Ô Ciel ! à quel excès se porte le zèle de la religion dans les dames !", "en": "“Thou deservest not to eat or to drink,” replied the orator, “wretch, monster that thou art! hence! avoid my sight, nor ever come near me again while thou livest.” The orator’s wife happened to put her head out of the window at that instant, when, seeing a man who doubted whether the Pope was Antichrist, she discharged upon his head a chamber-pot full of ——. Good heavens, to what excess does religious zeal transport the female kind!"}, {"fr": "Un homme qui n’avait point été baptisé, un bon anabaptiste, nommé Jacques, vit la manière cruelle et ignominieuse dont on traitait ainsi un de ses frères, un être à deux pieds sans plumes, qui avait une âme ; il l’amena chez lui, le nettoya, lui donna du pain et de la bière, lui fit présent de deux florins, et voulut même lui apprendre à travailler dans ses manufactures aux étoffes de Perse qu’on fabrique en Hollande. Candide, se prosternant presque devant lui, s’écriait : « Maître Pangloss me l’avait bien dit que tout est au mieux dans ce monde, car je suis infiniment plus touché de votre extrême générosité que de la dureté de ce monsieur à manteau noir, et de madame son épouse. »", "en": "A man who had never been christened, an honest Anabaptist, named James, was witness to the cruel and ignominious treatment showed to one of his brethren, to a rational, two-footed, unfledged being. Moved with pity, he carried him to his own house, cleaned him up, gave him meat and drink, and made him a present of two florins, at the same time proposing to instruct him in his own trade of weaving Persian silks which are fabricated in Holland. Candide threw himself at his feet, crying: “Now I am convinced that Master Pangloss told me truth, when he said that everything was for the best in this world; for I am infinitely more affected by your extraordinary generosity than by the inhumanity of that gentleman in the black cloak and his wife.”"}, {"fr": "Le lendemain, en se promenant, il rencontra un gueux tout couvert de pustules, les yeux morts, le bout du nez rongé, la bouche de travers, les dents noires, et parlant de la gorge, tourmenté d’une toux violente, et crachant une dent à chaque effort.", "en": "The next day, as Candide was walking out, he met a beggar all covered with scabs, his eyes were sunk in his head, the end of his nose was eaten off, his mouth drawn on one side, his teeth as black as coal, snuffling and coughing most violently, and every time he attempted to spit, out dropped a tooth."}, {"fr": "Candide, plus ému encore de compassion que d’horreur, donna à cet épouvantable gueux les deux florins qu’il avait reçus de son honnête anabaptiste Jacques. Le fantôme le regarda fixement, versa des larmes, et sauta à son cou. Candide, effrayé, recule. « Hélas ! dit le misérable à l’autre misérable, ne reconnaissez-vous plus votre cher Pangloss ?", "en": "Candide, divided between compassion and horror, but giving way to the former, bestowed on this shocking figure the two florins which the honest Anabaptist James had just before given to him. The spectre looked at him very earnestly, shed tears, and threw his arms about his neck. Candide started back aghast. “Alas!” said the one wretch to the other, “don’t you know your dear Pangloss?”"}, {"fr": "Qu’entends-je ? Vous, mon cher maître ! vous, dans cet état horrible ! Quel malheur vous est-il donc arrivé ? Pourquoi n’êtes-vous plus dans le plus beau des châteaux ? Qu’est devenue Mlle Cunégonde, la perle des filles, le chef-d’œuvre de la nature ?", "en": "“What do I hear? Is it you, my dear master! you I behold in this piteous plight? What dreadful misfortune has befallen you? What has made you leave the most magnificent and delightful of all castles? What is become of Miss Cunegund, the mirror of young ladies, and nature’s masterpiece?”"}, {"fr": "Je n’en peux plus, dit Pangloss. » Aussitôt Candide le mena dans l’étable de l’anabaptiste, où il lui fit manger un peu de pain ; et quand Pangloss fut refait : « Eh bien ! lui dit-il, Cunégonde ?", "en": "“Oh Lord!” cried Pangloss, “I am so weak I cannot stand.” Thereupon Candide instantly led him to the Anabaptist’s stable, and procured him something to eat. As soon as Pangloss had a little refreshed himself. Candide began to repeat his inquiries concerning Miss Cunegund."}, {"fr": "Elle est morte, reprit l’autre. » Candide s’évanouit à ce mot : son ami rappela ses sens avec un peu de mauvais vinaigre qui se trouva par hasard dans l’étable. Candide rouvre les yeux. « Cunégonde est morte ! Ah ! meilleur des mondes, où êtes-vous ? Mais de quelle maladie est-elle morte ? Ne serait-ce point de m’avoir vu chasser du beau château de monsieur son père à grands coups de pied ?", "en": "“She is dead,” replied the other. Candide immediately fainted away: his friend recovered him by the help of a little bad vinegar which he found by chance in the stable. Candide opened his eyes. “Dead! Miss Cunegund dead!” he said. “Ah, where is the best of worlds now? But of what illness did she die? Was it for grief upon seeing her father kick me out of his magnificent castle?”"}, {"fr": "Non, dit Pangloss, elle a été éventrée par des soldats bulgares, après avoir été violée autant qu’on peut l’être ; ils ont cassé la tête à monsieur le baron, qui voulait la défendre ; madame la baronne a été coupée en morceaux ; mon pauvre pupille, traité précisément comme sa sœur ; et quant au château, il n’est pas resté pierre sur pierre, pas une grange, pas un mouton, pas un canard, pas un arbre ; mais nous avons été bien vengés, car les Abares en ont fait autant dans une baronnie voisine qui appartenait à un seigneur bulgare. »", "en": "“No,” replied Pangloss; “her belly was ripped open by the Bulgarian soldiers, after they had ravished her as much as it was possible for damsel to be ravished: they knocked the Baron her father on the head for attempting to defend her; my lady her mother was cut in pieces; my poor pupil was served just in the same manner as his sister; and as for the castle, they have not left one stone upon another; they have destroyed all the ducks, and the sheep, the barns, and the trees: but we have had our revenge, for the Abares have done the very same thing in a neighbouring barony, which belonged to a Bulgarian lord.”"}, {"fr": "À ce discours, Candide s’évanouit encore ; mais revenu à soi, et ayant dit tout ce qu’il devait dire, il s’enquit de la cause et de l’effet, et de la raison suffisante qui avait mis Pangloss dans un si piteux état. « Hélas ! dit l’autre, c’est l’amour : l’amour, le consolateur du genre humain, le conservateur de l’univers, l’âme de tous les êtres sensibles, le tendre amour.", "en": "At hearing this, Candide fainted away a second time; but, having come to himself again, he said all that it became him to say; he inquired into the cause and effect, as well as into the sufficing reason, that had reduced Pangloss to so miserable a condition. “Alas!” replied the other, “it was love: love, the comfort of the human species; love, the preserver of the universe, the soul of all sensible beings; love! tender love!”"}, {"fr": "Hélas ! dit Candide, je l’ai connu cet amour, ce souverain des cœurs, cette âme de notre âme ; il ne m’a jamais valu qu’un baiser et vingt coups de pied au cul. Comment cette belle cause a-t-elle pu produire en vous un effet si abominable ? »", "en": "“Alas,” replied Candide, “I have had some knowledge of love myself, this sovereign of hearts, this soul of souls; yet it never cost me more than a kiss, and twenty kicks on the backside. But how could this beautiful cause produce in you so hideous an effect?”"}, {"fr": "Pangloss répondit en ces termes : « Ô mon cher Candide ! vous avez connu Paquette, cette jolie suivante de notre auguste baronne ; j’ai goûté dans ses bras les délices du paradis, qui ont produit ces tourments d’enfer dont vous me voyez dévoré ; elle en était infectée, elle en est peut-être morte. Paquette tenait ce présent d’un cordelier très-savant qui avait remonté à la source, car il l’avait eu d’une vieille comtesse, qui l’avait reçu d’un capitaine de cavalerie, qui le devait à une marquise, qui le tenait d’un page, qui l’avait reçu d’un jésuite qui, étant novice, l’avait eu en droite ligne d’un des compagnons de Christophe Colomb. Pour moi, je ne le donnerai à personne, car je me meurs.", "en": "Pangloss made answer in these terms: “O my dear Candide, you must remember Pacquette, that pretty wench, who waited on our noble Baroness; in her arms I tasted the pleasures of paradise, which produced these hell-torments with which you see me devoured. She was infected with the disease, and perhaps is since dead of it; she received this present of a learned cordelier, who derived it from the fountain-head; he was indebted for it to an old countess, who had it of a captain of horse, who had it of a marchioness, who had it of a page; the page had it of a Jesuit, who, during his novitiate, had it in a direct line from one of the fellow-adventurers of Christopher Columbus; for my part I shall give it to nobody, I am a dying man.”"}, {"fr": "— Ô Pangloss ! s’écria Candide, voilà une étrange généalogie ! n’est-ce pas le diable qui en fut la souche ?", "en": "“O Pangloss,” cried Candide, “what a strange genealogy is this! Is not the devil the root of it?”"}, {"fr": "— Point du tout, répliqua ce grand homme ; c’était une chose indispensable dans le meilleur des mondes, un ingrédient nécessaire ; car si Colomb n’avait pas attrapé dans une île de l’Amérique cette maladie qui empoisonne la source de la génération, qui souvent même empêche la génération, et qui est évidemment l’opposé du grand but de la nature, nous n’aurions ni le chocolat ni la cochenille ; il faut encore observer que jusqu’aujourd’hui, dans notre continent, cette maladie nous est particulière, comme la controverse. Les Turcs, les Indiens, les Persans, les Chinois, les Siamois, les Japonais, ne la connaissent pas encore ; mais il y a une raison suffisante pour qu’ils la connaissent à leur tour dans quelques siècles. En attendant, elle a fait un merveilleux progrès parmi nous, et surtout dans ces grandes armées composées d’honnêtes stipendiaires bien élevés, qui décident du destin des États ; on peut assurer que, quand trente mille hommes combattent en bataille rangée contre des troupes égales en nombre, il y a environ vingt mille vérolés de chaque côté.", "en": "“Not at all,” replied the great man, “it was a thing unavoidable, a necessary ingredient in the best of worlds; for if Columbus had not, in an island of America, caught this disease, which contaminates the source of generation, and frequently impedes propagation itself, and is evidently opposite to the great end of nature, we should have had neither chocolate nor cochineal. It is also to be observed that, even to the present time, in this continent of ours, this malady, like our religious controversies, is peculiar to ourselves. The Turks, the Indians, the Persians, the Chinese, the Siamese, and the Japanese are entirely unacquainted with it; but there is a sufficing reason for them to know it in a few centuries. In the meantime, it is making prodigious progress among us, especially in those armies composed of well-disciplined hirelings, who determine the fate of nations; for we may safely affirm that, when an army of thirty thousand men fights another equal in number, there are about twenty thousand of them poxed on each side.”"}, {"fr": "— Voilà qui est admirable, dit Candide ; mais il faut vous faire guérir.", "en": "“Very surprising, indeed,” said Candide, “but you must get cured.”"}, {"fr": "— Et comment le puis-je ? dit Pangloss ; je n’ai pas le sou, mon ami, et dans toute l’étendue de ce globe on ne peut ni se faire saigner, ni prendre un lavement sans payer, ou sans qu’il y ait quelqu’un qui paie pour nous. »", "en": "“How can I?” said Pangloss: “my dear friend, I have not a penny in the world; and you know one cannot be bled, or have a clyster, without a fee.”"}, {"fr": "Ce dernier discours détermina Candide ; il alla se jeter aux pieds de son charitable anabaptiste Jacques, et lui fit une peinture si touchante de l’état où son ami était réduit, que le bon-homme n’hésita pas à recueillir le docteur Pangloss ; il le fit guérir à ses dépens. Pangloss, dans la cure, ne perdit qu’un œil et une oreille. Il écrivait bien, et savait parfaitement l’arithmétique. L’anabaptiste Jacques en fit son teneur de livres. Au bout de deux mois, étant obligé d’aller à Lisbonne pour les affaires de son commerce, il mena dans son vaisseau ses deux philosophes. Pangloss lui expliqua comment tout était on ne peut mieux. Jacques n’était pas de cet avis. « Il faut bien, disait-il, que les hommes aient un peu corrompu la nature, car ils ne sont point nés loups, et ils sont devenus loups. Dieu ne leur a donné ni canons de vingt-quatre, ni baïonnettes ; et ils se sont fait des baïonnettes et des canons pour se détruire. Je pourrais mettre en ligne de compte les banqueroutes, et la justice qui s’empare des biens des banqueroutiers pour en frustrer les créanciers.", "en": "This last speech had its effect on Candide; he flew to the charitable Anabaptist James, he flung himself at his feet, and gave him so touching a picture of the miserable situation of his friend, that the good man, without any further hesitation, agreed to take Dr. Pangloss into his house, and to pay for his cure. The cure was effected with only the loss of one eye and an ear. As he wrote a good hand and understood accounts tolerably well, the Anabaptist made him his book-keeper. At the expiration of two months, being obliged to go to Lisbon, about some mercantile affairs, he took the two philosophers with him in the same ship; Pangloss, during the voyage, explained to him how everything was so constituted that it could not be better. James did not quite agree with him on this point. “Mankind,” said he, “must, in some things, have deviated from their original innocence; for they were not born wolves, and yet they worry one another like those beasts of prey. God never gave them twenty-four pounders nor bayonets, and yet they have made cannon and bayonets to destroy one another. To this account I might add, not only bankruptcies, but the law, which seizes on the effects of bankrupts, only to cheat the creditors.”"}, {"fr": "Tout cela était indispensable, répliquait le docteur borgne, et les malheurs particuliers font le bien général ; de sorte que plus il y a de malheurs particuliers, et plus tout est bien. » Tandis qu’il raisonnait, l’air s’obscurcit, les vents soufflèrent des quatre coins du monde, et le vaisseau fut assailli de la plus horrible tempête, à la vue du port de Lisbonne.", "en": "“All this was indispensably necessary,” replied the one-eyed doctor; “for private misfortunes are public benefits; so that the more private misfortunes there are, the greater is the general good.” While he was arguing in this manner, the sky was overcast, the winds blew from the four quarters of the compass, and the ship was assailed by a most terrible tempest, within sight of the port of Lisbon."}, {"fr": "La moitié des passagers affaiblis, expirants de ces angoisses inconcevables que le roulis d’un vaisseau porte dans les nerfs et dans toutes les humeurs du corps agitées en sens contraires, n’avait pas même la force de s’inquiéter du danger. L’autre moitié jetait des cris et faisait des prières ; les voiles étaient déchirées, les mâts brisés, le vaisseau entr’ouvert. Travaillait qui pouvait, personne ne s’entendait, personne ne commandait. L’anabaptiste aidait un peu à la manœuvre ; il était sur le tillac ; un matelot furieux le frappe rudement et l’étend sur les planches ; mais du coup qu’il lui donna, il eut lui-même une si violente secousse, qu’il tomba hors du vaisseau, la tête la première. Il restait suspendu et accroché à une partie de mât rompu. Le bon Jacques court à son secours, l’aide à remonter, et de l’effort qu’il fait il est précipité dans la mer à la vue du matelot, qui le laissa périr sans daigner seulement le regarder. Candide approche, voit son bienfaiteur qui reparaît un moment, et qui est englouti pour jamais. Il veut se jeter après lui dans la mer : le philosophe Pangloss l’en empêche, en lui prouvant que la rade de Lisbonne avait été formée exprès pour que cet anabaptiste s’y noyât. Tandis qu’il le prouvait a priori, le vaisseau s’entr’ouvre ; tout périt, à la réserve de Pangloss, de Candide, et de ce brutal de matelot qui avait noyé le vertueux anabaptiste : le coquin nagea heureusement jusqu’au rivage, où Pangloss et Candide furent portés sur une planche.", "en": "One half of the passengers, weakened and half dead with the inconceivable anguish which the rolling of a vessel at sea occasions to the nerves and all the humours of the body, tossed about in opposite directions, were lost to all sense of the danger that surrounded them. The other made loud outcries, or betook themselves to their prayers; the sails were blown into shivers, and the masts were brought by the board. The vessel leaked. Every one was busily employed, but nobody could be either heard or obeyed. The Anabaptist, being upon deck, lent a helping hand as well as the rest, when a brutish sailor gave him a blow, and laid him speechless; but, with the violence of the blow, the tar himself tumbled head foremost overboard, and fell upon a piece of the broken mast, which he immediately grasped. Honest James flew to his assistance, and hauled him in again, but, in the attempt, was thrown overboard himself in sight of the sailor, who left him to perish without taking the least notice of him. Candide, who beheld all that passed, and saw his benefactor one moment rising above water, and the next swallowed up by the merciless waves, was preparing to jump after him; but was prevented by the philosopher Pangloss, who demonstrated to him that the coast of Lisbon had been made on purpose for the Anabaptist to be drowned there. While he was proving his argument à priori, the ship foundered, and the whole crew perished, except Pangloss, Candide, and the brute of a sailor who had been the means of drowning the good Anabaptist. The villain swam ashore; but Pangloss and Candide got to land upon a plank."}, {"fr": "Quand ils furent revenus un peu à eux, ils marchèrent vers Lisbonne ; il leur restait quelque argent, avec lequel ils espéraient se sauver de la faim après avoir échappé à la tempête.", "en": "As soon as they had recovered a little, they walked towards Lisbon; with what little money they had left they thought to save themselves from starving after having escaped drowning."}, {"fr": "À peine ont-ils mis le pied dans la ville, en pleurant la mort de leur bienfaiteur, qu’ils sentent la terre trembler sous leurs pas ; la mer s’élève en bouillonnant dans le port, et brise les vaisseaux qui sont à l’ancre. Des tourbillons de flammes et de cendres couvrent les rues et les places publiques ; les maisons s’écroulent, les toits sont renversés sur les fondements, et les fondements se dispersent ; trente mille habitants de tout âge et de tout sexe sont écrasés sous des ruines. Le matelot disait en sifflant et en jurant : « Il y aura quelque chose à gagner ici.", "en": "Scarce had they done lamenting the loss of their benefactor and set foot in the city, when they perceived the earth to tremble under their feet, and the sea, swelling and foaming in the harbour, dash in pieces the vessels that were riding at anchor. Large sheets of flames and cinders covered the streets and public places; the houses tottered, and were tumbled topsy-turvy, even to their foundations, which were themselves destroyed, and thirty thousand inhabitants of both sexes, young and old, were buried beneath the ruins. The sailor, whistling and swearing, cried, “Damn it, there’s something to be got here.”"}, {"fr": "Quelle peut être la raison suffisante de ce phénomène ? disait Pangloss.", "en": "“What can be the sufficing reason of this phenomenon?” said Pangloss."}, {"fr": "Voici le dernier jour du monde ! s’écriait Candide. » Le matelot court incontinent au milieu des débris, affronte la mort pour trouver de l’argent, en trouve, s’en empare, s’enivre, et ayant cuvé son vin, achète les faveurs de la première fille de bonne volonté qu’il rencontre sur les ruines des maisons détruites, et au milieu des mourants et des morts. Pangloss le tirait cependant par la manche : « Mon ami, lui disait-il, cela n’est pas bien, vous manquez à la raison universelle, vous prenez mal votre temps.", "en": "“It is certainly the day of judgment,” said Candide. The sailor, defying death in the pursuit of plunder, rushed into the midst of the ruin, where he found some money, with which he got drunk, and after he had slept himself sober, he purchased the favours of the first good-natured wench that came his way, amidst the ruins of demolished houses, and the groans of half-buried and expiring persons. Pangloss pulled him by the sleeve."}, {"fr": "Tête et sang, répondit l’autre, je suis matelot et né à Batavia ; j’ai marché quatre fois sur le crucifix dans quatre voyages au Japon ; tu as bien trouvé ton homme avec ta raison universelle ! »", "en": "“Friend,” said he, “this is not right, you trespass against the universal reason, and have mistaken your time.” “Death and zounds!” answered the other, “I am a sailor, and born at Batavia, and have trampled four times upon the crucifix in as many voyages to Japan: you are come to a good hand with your universal reason.”"}, {"fr": "Quelques éclats de pierre avaient blessé Candide ; il était étendu dans la rue et couvert de débris. Il disait à Pangloss : « Hélas ! procure-moi un peu de vin et d’huile ; je me meurs.", "en": "Candide, who had been wounded by some pieces of stone that fell from the houses, lay stretched in the street, almost covered with rubbish. “For God’s sake,” said he, “get me a little wine and oil. I am dying.”"}, {"fr": "Ce tremblement de terre n’est pas une chose nouvelle, répondit Pangloss ; la ville de Lima éprouva les mêmes secousses en Amérique l’année passée ; mêmes causes, mêmes effets ; il y a certainement une traînée de soufre sous terre depuis Lima jusqu’à Lisbonne.", "en": "“This concussion of the earth is no new thing,” replied Pangloss, “the city of Lima, in America, experienced the same last year; the same cause, the same effects: there is certainly a train of sulphur all the way under ground from Lima to Lisbon.”"}, {"fr": "Rien n’est plus probable, dit Candide ; mais, pour Dieu, un peu d’huile et de vin.", "en": "“Nothing more probable,” said Candide; “but, for the love of God, a little oil and wine.”"}, {"fr": "Comment, probable ? répliqua le philosophe, je soutiens que la chose est démontrée. » Candide perdit connaissance, et Pangloss lui apporta un peu d’eau d’une fontaine voisine.", "en": "“Probable!” replied the philosopher, “I maintain that the thing is demonstrable.” Candide fainted away, and Pangloss fetched him some water from a neighbouring spring."}, {"fr": "Le lendemain, ayant trouvé quelques provisions de bouche en se glissant à travers des décombres, ils réparèrent un peu leurs forces. Ensuite ils travaillèrent comme les autres à soulager les habitants échappés à la mort. Quelques citoyens, secourus par eux, leur donnèrent un aussi bon dîner qu’on le pouvait dans un tel désastre : il est vrai que le repas était triste ; les convives arrosaient leur pain de leurs larmes ; mais Pangloss les consola, en les assurant que les choses ne pouvaient être autrement : « Car, dit-il, tout ceci est ce qu’il y a de mieux ; car s’il y a un volcan à Lisbonne, il ne pouvait être ailleurs ; car il est impossible que les choses ne soient pas où elles sont, car tout est bien. »", "en": "The next day, in searching among the ruins, they found some eatables with which they repaired their exhausted strength. After this, they assisted the inhabitants in relieving the distressed and wounded. Some, whom they had humanely assisted, gave them as good a dinner as could be expected under such terrible circumstances. The repast, indeed, was mournful, and the company moistened their bread with their tears; but Pangloss endeavoured to comfort them under this affliction by affirming that things could not be otherwise than they were. “For,” said he, “all this is for the very best end; for if there is a volcano at Lisbon, it could be on no other spot; for it is impossible for things not to be as they are, for everything is for the best.”"}, {"fr": "Un petit homme noir, familier de l’Inquisition, lequel était à côté de lui, prit poliment la parole et dit : « Apparemment que monsieur ne croit pas au péché originel ; car si tout est au mieux, il n’y a donc eu ni chute ni punition.", "en": "By his side sat a little man dressed in black, who was one of the familiars of the Inquisition. This person, taking him up with great politeness, said, “Possibly, my good Sir, you do not believe in original sin; for if everything is best, there could have been no such thing as the fall or punishment of man.”"}, {"fr": "Je demande très-humblement pardon à Votre Excellence, répondit Pangloss encore plus poliment, car la chute de l’homme et la malédiction entraient nécessairement dans le meilleur des mondes possibles.", "en": "“I humbly ask your Excellency’s pardon,” answered Pangloss, still more politely; “for the fall of man, and the curse consequent thereupon necessarily entered into the system of the best of worlds.”"}, {"fr": "Monsieur ne croit donc pas à la liberté ? dit le familier.", "en": "“That is as much as to say, Sir,” rejoined the familiar, “you do not believe in free will.”"}, {"fr": "Votre Excellence m’excusera, dit Pangloss ; la liberté peut subsister avec la nécessité absolue ; car il était nécessaire que nous fussions libres ; car enfin la volonté déterminée… » Pangloss était au milieu de sa phrase, quand le familier fit un signe de tête à son estafier qui lui servait à boire du vin de Porto ou d’Oporto.", "en": "“Your Excellency will be so good as to excuse me,” said Pangloss; “free will is consistent with absolute necessity; for it was necessary we should be free, for in that the will——” Pangloss was in the midst of his proposition, when the familiar made a sign to the attendant who was helping him to a glass of port wine."}, {"fr": "Après le tremblement de terre qui avait détruit les trois quarts de Lisbonne, les sages du pays n’avaient pas trouvé un moyen plus efficace pour prévenir une ruine totale que de donner au peuple un bel auto-da-fé ; il était décidé par l’université de Coïmbre que le spectacle de quelques personnes brûlées à petit feu, en grande cérémonie, est un secret infaillible pour empêcher la terre de trembler.", "en": "How the Portuguese Made a Superb Auto-da-Fé to Prevent Any Future Earthquakes, and How Candide Underwent Public Flagellation After the earthquake which had destroyed three-quarters of the city of Lisbon, the sages of that country could think of no means more effectual to preserve the kingdom from utter ruin, than to entertain the people with an auto-da-fé, it having been decided by the University of Coimbra that burning a few people alive by a slow fire, and with great ceremony, is an infallible secret to prevent earthquakes."}, {"fr": "On avait en conséquence saisi un Biscayen convaincu d’avoir épousé sa commère, et deux Portugais qui en mangeant un poulet en avaient arraché le lard : on vint lier après le dîner le docteur Pangloss et son disciple Candide, l’un pour avoir parlé, et l’autre pour l’avoir écouté avec un air d’approbation : tous deux furent menés séparément dans des appartements d’une extrême fraîcheur, dans lesquels on n’était jamais incommodé du soleil : huit jours après ils furent tous deux revêtus d’un san-benito, et on orna leurs têtes de mitres de papier : la mitre et le san-benito de Candide étaient peints de flammes renversées, et de diables qui n’avaient ni queues ni griffes ; mais les diables de Pangloss portaient griffes et queues, et les flammes étaient droites. Ils marchèrent en procession ainsi vêtus, et entendirent un sermon très-pathétique, suivi d’une belle musique en faux-bourdon. Candide fut fessé en cadence, pendant qu’on chantait ; le Biscayen et les deux hommes qui n’avaient point voulu manger de lard furent brûlés, et Pangloss fut pendu, quoique ce ne soit pas la coutume. Le même jour la terre trembla de nouveau avec un fracas épouvantable.", "en": "In consequence thereof they had seized on a Biscayan for marrying his godmother, and on two Portuguese for taking out the bacon of a larded pullet they were eating. After dinner, they came and secured Dr. Pangloss, and his pupil Candide; the one for speaking his mind, and the other for seeming to approve what he had said. They were conducted to separate apartments, extremely cool, where they were never incommoded with the sun. Eight days afterwards they were each dressed in a sanbenito, and their heads were adorned with paper mitres. The mitre and sanbenito worn by Candide were painted with flames reversed, and with devils that had neither tails nor claws; but Dr. Pangloss’s devils had both tails and claws, and his flames were upright. In these habits they marched in procession, and heard a very pathetic sermon, which was followed by a chant, beautifully intoned. Candide was flogged in regular cadence, while the chant was being sung; the Biscayan, and the two men who would not eat bacon, were burnt, and Pangloss was hanged, although this is not a common custom at these solemnities. The same day there was another earthquake, which made most dreadful havoc."}, {"fr": "Candide, épouvanté, interdit, éperdu, tout sanglant, tout palpitant, se disait à lui-même : « Si c’est ici le meilleur des mondes possibles, que sont donc les autres ? Passe encore si je n’étais que fessé, je l’ai été chez les Bulgares ; mais, ô mon cher Pangloss, le plus grand des philosophes ! faut-il vous avoir vu pendre, sans que je sache pourquoi ! Ô mon cher anabaptiste, le meilleur des hommes ! faut-il que vous ayez été noyé dans le port ! ô mademoiselle Cunégonde ! la perle des filles, faut-il qu’on vous ait fendu le ventre ! »", "en": "Candide, amazed, terrified, confounded, astonished, and trembling from head to foot, said to himself, “If this is the best of all possible worlds, what are the others? If I had only been whipped, I could have put up with it, as I did among the Bulgarians; but, O my dear Pangloss! thou greatest of philosophers! that ever I should live to see thee hanged, without knowing for what! O my dear Anabaptist, thou best of men, that it should be thy fate to be drowned in the very harbour! O Miss Cunegund, you mirror of young ladies! that it should be your fate to have your belly ripped open.”"}, {"fr": "Il s’en retournait, se soutenant à peine, prêché, fessé, absous et béni, lorsqu’une vieille l’aborda, et lui dit : « Mon fils, prenez courage, suivez-moi. »", "en": "He was making the best of his way from the place where he had been preached to, whipped, absolved, and received benediction, when he was accosted by an old woman, who said to him, “Take courage, my son, and follow me.”"}, {"fr": "Candide ne prit point courage, mais il suivit la vieille dans une masure : elle lui donna un pot de pommade pour se frotter, lui laissa à manger et à boire ; elle lui montra un petit lit assez propre ; il y avait auprès du lit un habit complet. « Mangez, buvez, dormez, lui dit-elle, et que Notre-Dame d’Atocha, monseigneur saint Antoine de Padoue, et monseigneur saint Jacques de Compostelle prennent soin de vous ! je reviendrai demain. » Candide, toujours étonné de tout ce qu’il avait vu, de tout ce qu’il avait souffert, et encore plus de la charité de la vieille, voulut lui baiser la main. « Ce n’est pas ma main qu’il faut baiser, dit la vieille ; je reviendrai demain. Frottez-vous de pommade, mangez et dormez. »", "en": "Candide followed the old woman, though without taking courage, to a decayed house where she gave him a pot of pomatum to anoint his sores, showed him a very neat bed, with a suit of clothes hanging up by it; and set victuals and drink before him. “There,” said she, “eat, drink, and sleep, and may our blessed Lady of Atocha, and the great St. Anthony of Padua, and the illustrious St. James of Compostella, take you under their protection. I shall be back to-morrow.” Candide, struck with amazement at what he had seen, at what he had suffered, and still more with the charity of the old woman, would have shown his acknowledgment by kissing her hand. “It is not my hand you ought to kiss,” said the old woman, “I shall be back to-morrow. Anoint your back, eat, and take your rest.”"}, {"fr": "Candide, malgré tant de malheurs, mangea et dormit. Le lendemain la vieille lui apporte à déjeuner, visite son dos, le frotte elle-même d’une autre pommade ; elle lui apporte ensuite à dîner ; elle revient sur le soir et apporte à souper. Le surlendemain elle fit encore les mêmes cérémonies. « Qui êtes-vous ? lui disait toujours Candide ; qui vous a inspiré tant de bonté ? quelles grâces puis-je vous rendre ? » La bonne femme ne répondait jamais rien. Elle revint sur le soir, et n’apporta point à souper : « Venez avec moi, dit-elle, et ne dites mot. » Elle le prend sous le bras, et marche avec lui dans la campagne environ un quart de mille : ils arrivent à une maison isolée, entourée de jardins et de canaux. La vieille frappe à une petite porte. On ouvre ; elle mène Candide, par un escalier dérobé, dans un cabinet doré, le laisse sur un canapé de brocart, referme la porte, et s’en va. Candide croyait rêver, et regardait toute sa vie comme un songe funeste, et le moment présent comme un songe agréable.", "en": "Candide, notwithstanding so many disasters, ate and slept. The next morning, the old woman brought him his breakfast; examined his back, and rubbed it herself with another ointment. She returned at the proper time, and brought him his dinner; and at night she visited him again with his supper. The next day she observed the same ceremonies. “Who are you?” said Candide to her. “What god has inspired you with so much goodness? What return can I ever make you?” The good old beldame kept a profound silence. In the evening she returned, but without his supper. “Come along with me,” said she, “but do not speak a word.” She took him by the arm, and walked with him about a quarter of a mile into the country, till they came to a lonely house surrounded with moats and gardens. The old woman knocked at a little door, which was immediately opened, and she showed him up a pair of back stairs into a small, but richly furnished apartment. There she made him sit down on a brocaded sofa, shut the door upon him, and left him. Candide thought himself in a trance; he looked upon his whole life hitherto as a frightful dream, and the present moment as a very agreeable one."}, {"fr": "La vieille reparut bientôt ; elle soutenait avec peine une femme tremblante, d’une taille majestueuse, brillante de pierreries, et couverte d’un voile. « Ôtez ce voile, dit la vieille à Candide. » Le jeune homme approche ; il lève le voile d’une main timide. Quel moment ! quelle surprise ! il croit voir Mlle Cunégonde ; il la voyait en effet, c’était elle-même. La force lui manque, il ne peut proférer une parole, il tombe à ses pieds. Cunégonde tombe sur le canapé. La vieille les accable d’eaux spiritueuses, ils reprennent leurs sens, ils se parlent ; ce sont d’abord de
