en embraced, and let fall a shower of tears. “Is it you then, Reverend Father? You are the brother of the fair Cunegund? you who were slain by the Bulgarians! you the Baron’s son! you a Jesuit in Paraguay! I must confess this is a strange world we live in. O Pangloss! Pangloss! what joy would this have given you, if you had not been hanged.”"}, {"fr": "Le commandant fit retirer les esclaves nègres et les Paraguains qui servaient à boire dans des gobelets de cristal de roche. Il remercia Dieu et saint Ignace mille fois ; il serrait Candide entre ses bras, leurs visages étaient baignés de pleurs. « Vous seriez bien plus étonné, plus attendri, plus hors de vous-même, dit Candide, si je vous disais que Mlle Cunégonde, votre sœur, que vous avez crue éventrée, est pleine de santé.", "en": "The Commandant dismissed the negro slaves, and the Paraguayans who were presenting them with liquor in crystal goblets. He returned thanks to God and St. Ignatius a thousand times; he clasped Candide in his arms, and both their faces were bathed in tears. “You will be more surprised, more affected, more transported,” said Candide, “when I tell you that Miss Cunegund, your sister, whose belly was supposed to have been ripped open, is in perfect health.”"}, {"fr": "Où ?", "en": ""}, {"fr": "Dans votre voisinage, chez M. le gouverneur de Buénos-Ayres ; et je venais pour vous faire la guerre. » Chaque mot qu’ils prononcèrent dans cette longue conversation accumulait prodige sur prodige. Leur âme tout entière volait sur leur langue, était attentive dans leurs oreilles, et étincelante dans leurs yeux. Comme ils étaient Allemands, ils tinrent table longtemps, en attendant le révérend père provincial ; et le commandant parla ainsi à son cher Candide :", "en": "“In your neighbourhood, with the Governor of Buenos Ayres; and I myself was going to fight against you.” Every word they uttered during this long conversation was productive of some new matter of astonishment. Their souls fluttered on their tongues, listened in their ears, and sparkled in their eyes. Like true Germans, they continued a long time at table, waiting for the Reverend Father Provincial; and the Commandant spoke to his dear Candide as follows:"}, {"fr": "« J’aurai toute ma vie présent à la mémoire le jour horrible où je vis tuer mon père et ma mère, et violer ma sœur. Quand les Bulgares furent retirés, on ne trouva point cette sœur adorable, et on mit dans une charrette ma mère, mon père, et moi, deux servantes et trois petits garçons égorgés, pour nous aller enterrer dans une chapelle de jésuites, à deux lieues du château de mes pères. Un jésuite nous jeta de l’eau bénite ; elle était horriblement salée ; il en entra quelques gouttes dans mes yeux : le père s’aperçut que ma paupière faisait un petit mouvement : il mit la main sur mon cœur, et le sentit palpiter : je fus secouru, et au bout de trois semaines il n’y paraissait pas. Vous savez, mon cher Candide, que j’étais fort joli ; je le devins encore davantage ; aussi le révérend père Croust, supérieur de la maison, prit pour moi la plus tendre amitié : il me donna l’habit de novice ; quelque temps après je fus envoyé à Rome. Le père général avait besoin d’une recrue de jeunes jésuites allemands. Les souverains du Paraguai reçoivent le moins qu’ils peuvent de jésuites espagnols ; ils aiment mieux les étrangers, dont ils se croient plus maîtres. Je fus jugé propre par le révérend père général pour aller travailler dans cette vigne. Nous partîmes, un Polonais, un Tyrolien, et moi. Je fus honoré, en arrivant, du sous-diaconat et d’une lieutenance ; je suis aujourd’hui colonel et prêtre. Nous recevrons vigoureusement les troupes du roi d’Espagne ; je vous réponds qu’elles seront excommuniées et battues. La Providence vous envoie ici pour nous seconder. Mais est-il bien vrai que ma chère sœur Cunégonde soit dans le voisinage, chez le gouverneur de Buénos-Ayres ? » Candide l’assura par serment que rien n’était plus vrai. Leurs larmes recommencèrent à couler.", "en": "“Never while I live shall I lose the remembrance of that horrible day on which I saw my father and mother barbarously butchered before my eyes, and my sister ravished. When the Bulgarians retired, we found no sign of my dear sister; but the bodies of my father, mother, and myself, with two servant maids, and three little boys with their throats cut, were thrown into a cart, to be buried in a chapel belonging to the Jesuits, within two leagues of our family seat. A Jesuit sprinkled us with some holy water, which was confoundedly salt, and a few drops of it went into my eyes: the father perceived that my eyelids stirred a little; he put his hand on my breast, and felt my heart beat; upon which he gave me proper assistance, and at the end of three weeks I was perfectly recovered. You know, my dear Candide, I was very handsome; I became still more so, and the Reverend Father Croust, Superior of the House, took a great fancy to me; he gave me a novice’s habit, and some years afterwards I was sent to Rome. Our general stood in need of new levies of young German Jesuits. The sovereigns of Paraguay admit as few Spanish Jesuits as possible; they prefer those of other nations, as being more obedient to command. The Reverend Father General looked upon me as a proper person to work in that vineyard. I set out in company with a Pole and a Tyrolese. Upon my arrival, I was honoured with a subdeaconship and a lieutenancy. Now I am colonel and priest. We shall give a warm reception to the King of Spain’s troops; I can assure you, they will be well excommunicated and beaten. Providence has sent you hither to assist us. But is it true that my dear sister Cunegund is in the neighbourhood with the Governor of Buenos Ayres?” Candide swore that nothing could be more true; and the tears began again to trickle down their cheeks."}, {"fr": "Le baron ne pouvait se lasser d’embrasser Candide ; il l’appelait son frère, son sauveur. « Ah ! peut-être, lui dit-il, nous pourrons ensemble, mon cher Candide, entrer en vainqueurs dans la ville, et reprendre ma sœur Cunégonde.", "en": "The Baron knew no end of embracing Candide: he called him his brother, his deliverer. “Perhaps,” said he, “my dear Candide, we shall be fortunate enough to enter the town sword in hand, and rescue my sister Cunegund.”"}, {"fr": "C’est tout ce que je souhaite, dit Candide ; car je comptais l’épouser, et je l’espère encore.", "en": "“Ah! that would crown my wishes,” replied Candide, “for I intended to marry her; and I hope I shall still be able to do so.”"}, {"fr": "Vous, insolent ! répondit le baron, vous auriez l’impudence d’épouser ma sœur, qui a soixante et douze quartiers ! Je vous trouve bien effronté d’oser me parler d’un dessein si téméraire ! » Candide, pétrifié d’un tel discours, lui répondit : « Mon révérend père, tous les quartiers du monde n’y font rien ; j’ai tiré votre sœur des bras d’un juif et d’un inquisiteur ; elle m’a assez d’obligations, elle veut m’épouser. Maître Pangloss m’a toujours dit que les hommes sont égaux ; et assurément je l’épouserai.", "en": "“Insolent fellow!” replied the Baron. “You! you have the impudence to marry my sister, who bears seventy-two quarterings! I think you have an insufferable degree of assurance to dare so much as to mention such an audacious design to me.” Candide, thunder-struck at the oddness of this speech, answered, “Reverend Father, all the quarterings in the world are of no significance. I have delivered your sister from a Jew and an Inquisitor; she is under many obligations to me, and she is resolved to give me her hand. Master Pangloss always told me that mankind are by nature equal. Therefore, you may depend upon it, that I will marry your sister.”"}, {"fr": "C’est ce que nous verrons, coquin ! » dit le jésuite baron de Thunder-ten-tronckh ; et en même temps il lui donna un grand coup du plat de son épée sur le visage. Candide dans l’instant tire la sienne, et l’enfonce jusqu’à la garde dans le ventre du baron jésuite ; mais en la retirant toute fumante, il se mit à pleurer : « Hélas ! mon Dieu ! dit-il, j’ai tué mon ancien maître, mon ami, mon beau-frère ; je suis le meilleur homme du monde, et voilà déjà trois hommes que je tue ; et dans ces trois il y a deux prêtres. »", "en": "“We shall see about that, villain!” said the Jesuit Baron of Thunder-ten-tronckh, and struck him across the face with the flat side of his sword. Candide, in an instant, drew his rapier, and plunged it up to the hilt in the Jesuit’s body; but, in pulling it out reeking hot, he burst into tears. “Good God!” cried he, “I have killed my old master, my friend, my brother-in-law; I am the mildest man in the world, and yet I have already killed three men; and of these three two were priests.”"}, {"fr": "Cacambo, qui faisait sentinelle à la porte de la feuillée, accourut. « Il ne nous reste qu’à vendre cher notre vie, lui dit son maître ; on va, sans doute, entrer dans la feuillée ; il faut mourir les armes à la main. » Cacambo, qui en avait bien vu d’autres, ne perdit point la tête ; il prit la robe de jésuite que portait le baron, la mit sur le corps de Candide, lui donna le bonnet carré du mort, et le fit monter à cheval. Tout cela se fit en un clin d’œil. « Galopons, mon maître ; tout le monde vous prendra pour un jésuite qui va donner des ordres ; et nous aurons passé les frontières avant qu’on puisse courir après nous. » Il volait déjà en prononçant ces paroles, et en criant en espagnol : « Place, place pour le révérend père colonel ! »", "en": "Cacambo, standing sentry near the door of the arbour, instantly ran up. “Nothing remains,” said his master, “but to sell our lives as dearly as possible; they will undoubtedly look into the arbour; we must die sword in hand.” Cacambo, who had seen many of these kind of adventures, was not discouraged! He stripped the Baron of his Jesuit’s habit, and put it upon Candide, then gave him the dead man’s three-cornered cap, and made him mount on horseback. All this was done as quick as thought. “Gallop, master,” cried Cacambo; “everybody will take you for a Jesuit going to give orders; and we shall have passed the frontiers before they are able to overtake us.” He flew as he spoke these words, crying out aloud in Spanish, “Make way make way for the Reverend Father Colonel.”"}, {"fr": "Candide et son valet furent au delà des barrières, et personne ne savait encore dans le camp la mort du jésuite allemand. Le vigilant Cacambo avait eu soin de remplir sa valise de pain, de chocolat, de jambon, de fruits, et de quelques mesures de vin. Ils s’enfoncèrent avec leurs chevaux andalous dans un pays inconnu où ils ne découvrirent aucune route. Enfin une belle prairie entrecoupée de ruisseaux se présenta devant eux. Nos deux voyageurs font repaître leurs montures. Cacambo propose à son maître de manger, et lui en donne l’exemple. « Comment veux-tu, disait Candide, que je mange du jambon, quand j’ai tué le fils de monsieur le baron, et que je me vois condamné à ne revoir la belle Cunégonde de ma vie ? À quoi me servira de prolonger mes misérables jours, puisque je dois les traîner loin d’elle dans les remords et dans le désespoir ? Et que dira le Journal de Trévoux. »", "en": "Candide and his servant had already passed the frontiers before it was known that the German Jesuit was dead. The wary Cacambo had taken care to fill his wallet with bread, chocolate, ham, fruit, and a few bottles of wine. They penetrated with their Andalusian horses into a strange country where they could discover no beaten path. At length, a beautiful meadow, intersected with streams, opened to their view. Our two travellers allowed their steeds to graze. Cacambo urged his master to take some food, and he set him an example. “How can you desire me to eat ham, when I have killed the son of my Lord the Baron, and am doomed never more to see the beautiful Cunegund? What will it avail me to prolong a wretched life that might be spent far from her in remorse and despair; and then, what will the Journal of Trevoux say?”"}, {"fr": "En parlant ainsi, il ne laissa pas de manger. Le soleil se couchait. Les deux égarés entendirent quelques petits cris qui paraissaient poussés par des femmes. Ils ne savaient si ces cris étaient de douleur ou de joie ; mais ils se levèrent précipitamment avec cette inquiétude et cette alarme que tout inspire dans un pays inconnu. Ces clameurs partaient de deux filles toutes nues qui couraient légèrement au bord de la prairie, tandis que deux singes les suivaient en leur mordant les fesses. Candide fut touché de pitié ; il avait appris à tirer chez les Bulgares, et il aurait abattu une noisette dans un buisson sans toucher aux feuilles. Il prend son fusil espagnol à deux coups, tire, et tue les deux singes. « Dieu soit loué, mon cher Cacambo ! j’ai délivré d’un grand péril ces deux pauvres créatures : si j’ai commis un péché en tuant un inquisiteur et un jésuite, je l’ai bien réparé en sauvant la vie à deux filles. Ce sont peut-être deux demoiselles de condition, et cette aventure nous peut procurer de très-grands avantages dans le pays. »", "en": "While he was making these reflections, he still continued eating. The sun was now on the point of setting, when the ears of our two wanderers were assailed with cries which seemed to be uttered by a female voice. They could not tell whether these were cries of grief or joy: however, they instantly started up, full of that uneasiness and apprehension which a strange place inspires. The cries proceeded from two young women who were tripping stark naked on the edge of the prairie, while two monkeys followed close at their heels biting their buttocks. Candide was touched with compassion; he had learned to shoot while he was among the Bulgarians, and he could hit a filbert in a hedge without touching a leaf. Accordingly, he took up his double-barrelled Spanish musket, pulled the trigger, and laid the two monkeys lifeless on the ground. “God be praised, my dear Cacambo, I have rescued two poor girls from a most perilous situation: if I have committed a sin in killing an Inquisitor and a Jesuit, I made ample amends by saving the lives of these two girls. Who knows but they may be young ladies of a good family, and that this assistance I have been so happy to give them may procure us great advantage in this country.”"}, {"fr": "Il allait continuer, mais sa langue devint percluse quand il vit ces deux filles embrasser tendrement les deux singes, fondre en larmes sur leurs corps, et remplir l’air des cris les plus douloureux. « Je ne m’attendais pas à tant de bonté d’âme, » dit-il enfin à Cacambo ; lequel lui répliqua : « Vous avez fait là un beau chef-d’œuvre, mon maître ; vous avez tué les deux amants de ces demoiselles.", "en": "He was about to continue, when he felt himself struck speechless at seeing the two girls embracing the dead bodies of the monkeys in the tenderest manner, bathing their wounds with their tears, and rending the air with the most doleful lamentations. “Really,” said he to Cacambo, “I should not have expected to see such a prodigious share of good nature.” “Master,” replied Cacambo, “you have made a precious piece of work of it; do you know that you have killed the lovers of these two ladies!”"}, {"fr": "Leurs amants ! serait-il possible ? Vous vous moquez de moi, Cacambo ; le moyen de vous croire ?", "en": "“Their lovers! Cacambo, you are jesting! it cannot be! I can never believe it.”"}, {"fr": "Mon cher maître, repartit Cacambo, vous êtes toujours étonné de tout ; pourquoi trouvez-vous si étrange que dans quelques pays il y ait des singes qui obtiennent les bonnes grâces des dames ? Ils sont des quarts d’homme, comme je suis un quart d’Espagnol.", "en": "“Dear Sir,” replied Cacambo, “you are surprised at everything; why should you think it so strange that there should be a country where monkeys insinuate themselves into the good graces of the ladies? They are the fourth part of a man as I am the fourth part of a Spaniard.”"}, {"fr": "Hélas ! reprit Candide, je me souviens d’avoir entendu dire à maître Pangloss qu’autrefois pareils accidents étaient arrivés, et que ces mélanges avaient produit des égypans, des faunes, des satyres ; que plusieurs grands personnages de l’antiquité en avaient vu ; mais je prenais cela pour des fables.", "en": "“Alas!” replied Candide, “I remember to have heard Master Pangloss say that such accidents as these frequently came to pass in former times, and that these commixtures are productive of centaurs, fauns, and satyrs; and that many of the ancients had seen such monsters: but I looked upon the whole as fabulous.”"}, {"fr": "Vous devez être convaincu à présent, dit Cacambo, que c’est une vérité, et vous voyez comment en usent les personnes qui n’ont pas reçu une certaine éducation ; tout ce que je crains, c’est que ces dames ne nous fassent quelque méchante affaire. »", "en": "“Now you are convinced,” said Cacambo, “that it is very true, and you see what use is made of those creatures by persons who have not had a proper education: all I am afraid of is that these same ladies will play us some ugly trick.”"}, {"fr": "Ces réflexions solides engagèrent Candide à quitter la prairie, et à s’enfoncer dans un bois. Il y soupa avec Cacambo ; et tous deux, après avoir maudit l’inquisiteur de Portugal, le gouverneur de Buénos-Ayres, et le baron, s’endormirent sur de la mousse. À leur réveil, ils sentirent qu’ils ne pouvaient remuer ; la raison en était que pendant la nuit les Oreillons, habitants du pays, à qui les deux dames les avaient dénoncés, les avaient garrottés avec des cordes d’écorces d’arbre. Ils étaient entourés d’une cinquantaine d’Oreillons tout nus, armés de flèches, de massues, et de haches de caillou : les uns faisaient bouillir une grande chaudière ; les autres préparaient des broches, et tous criaient : « C’est un jésuite, c’est un jésuite ! nous serons vengés, et nous ferons bonne chère ; mangeons du jésuite, mangeons du jésuite ! »", "en": "These judicious reflections operated so far on Candide, as to make him quit the meadow and strike into a thicket. There he and Cacambo supped, and after heartily cursing the Grand Inquisitor, the Governor of Buenos Ayres, and the Baron, they fell asleep on the ground. When they awoke, they were surprised to find that they could not move; the reason was that the Oreillons who inhabit that country, and to whom the two girls had denounced them, had bound them with cords made of the bark of trees. They were surrounded by fifty naked Oreillons armed with bows and arrows, clubs, and hatchets of flint; some were making a fire under a large cauldron; and others were preparing spits, crying out one and all, “A Jesuit! a Jesuit! We shall be revenged; we shall have excellent cheer; let us eat this Jesuit; let us eat him up.”"}, {"fr": "« Je vous l’avais bien dit, mon cher maître, s’écria tristement Cacambo, que ces deux filles nous joueraient d’un mauvais tour. » Candide, apercevant la chaudière et les broches, s’écria : « Nous allons certainement être rôtis ou bouillis. Ah ! que dirait maître Pangloss, s’il voyait comme la pure nature est faite ? Tout est bien ; soit, mais j’avoue qu’il est bien cruel d’avoir perdu Mlle Cunégonde et d’être mis à la broche par des Oreillons. » Cacambo ne perdait jamais la tête. « Ne désespérez de rien, dit-il au désolé Candide ; j’entends un peu le jargon de ces peuples, je vais leur parler.", "en": "“I told you, master,” cried Cacambo mournfully, “that those two wenches would play us some scurvy trick.” Candide, seeing the cauldron and the spits, cried out, “I suppose they are going either to boil or roast us. Ah! what would Master Pangloss say if he were to see how pure nature is formed! Everything is right: it may be so: but I must confess it is something hard to be bereft of Miss Cunegund, and to be spitted by these Oreillons.” Cacambo, who never lost his presence of mind in distress, said to the disconsolate Candide, “Do not despair; I understand a little of the jargon of these people; I will speak to them.”"}, {"fr": "Ne manquez pas, dit Candide, de leur représenter quelle est l’inhumanité affreuse de faire cuire des hommes, et combien cela est peu chrétien. »", "en": "“Ay, pray do,” said Candide, “and be sure you make them sensible of the horrid barbarity of boiling and roasting human creatures, and how little of Christianity there is in such practices.”"}, {"fr": "« Messieurs, dit Cacambo, vous comptez donc manger aujourd’hui un jésuite ? c’est très-bien fait ; rien n’est plus juste que de traiter ainsi ses ennemis. En effet le droit naturel nous enseigne à tuer notre prochain, et c’est ainsi qu’on en agit dans toute la terre. Si nous n’usons pas du droit de le manger, c’est que nous avons d’ailleurs de quoi faire bonne chère ; mais vous n’avez pas les mêmes ressources que nous : certainement il vaut mieux manger ses ennemis que d’abandonner aux corbeaux et aux corneilles le fruit de sa victoire. Mais, messieurs, vous ne voudriez pas manger vos amis. Vous croyez aller mettre un jésuite en broche, et c’est votre défenseur, c’est l’ennemi de vos ennemis que vous allez rôtir. Pour moi, je suis né dans votre pays ; monsieur que vous voyez est mon maître, et bien loin d’être jésuite, il vient de tuer un jésuite, il en porte les dépouilles ; voilà le sujet de votre méprise. Pour vérifier ce que je vous dis, prenez sa robe, portez-la à la première barrière du royaume de los padres ; informez-vous si mon maître n’a pas tué un officier jésuite. Il vous faudra peu de temps ; vous pourrez toujours nous manger, si vous trouvez que je vous ai menti. Mais, si je vous ai dit la vérité, vous connaissez trop les principes du droit public, les mœurs et les lois, pour ne nous pas faire grâce. »", "en": "“Gentlemen,” said Cacambo, “you think perhaps you are going to feast upon a Jesuit; if so, it is mighty well; nothing can be more agreeable to justice than thus to treat your enemies. Indeed, the law of nature teaches us to kill our neighbour, and accordingly we find this practised all over the world; and if we do not indulge ourselves in eating human flesh, it is because we have much better fare; but you have not such resources as we have; it is certainly much better judged to feast upon your enemies than to abandon to the fowls of the air the fruits of your victory. But surely, gentlemen, you would not choose to eat your friends. You imagine you are going to roast a Jesuit, whereas my master is your friend, your defender, and you are going to spit the very man who has been destroying your enemies: as to myself, I am your countryman; this gentleman is my master, and so far from being a Jesuit, he has very lately killed one of that order, whose spoils he now wears, and which have probably occasioned your mistake. To convince you of the truth of what I say, take the habit he now has on, and carry it to the first barrier of the Jesuits’ kingdom, and inquire whether my master did not kill one of their officers. There will be little or no time lost by this, and you may still reserve our bodies in your power to feast on, if you should find what we have told you to be false. But, on the contrary, if you find it to be true, I am persuaded you are too well acquainted with the principles of the laws of society, humanity, and justice, not to use us courteously.”"}, {"fr": "Les Oreillons trouvèrent ce discours très-raisonnable ; ils députèrent deux notables pour aller en diligence s’informer de la vérité ; les deux députés s’acquittèrent de leur commission en gens d’esprit, et revinrent bientôt apporter de bonnes nouvelles. Les Oreillons délièrent leurs deux prisonniers, leur firent toutes sortes de civilités, leur offrirent des filles, leur donnèrent des rafraîchissements, et les reconduisirent jusqu’aux confins de leurs États, en criant avec allégresse : « Il n’est point jésuite, il n’est point jésuite ! »", "en": "This speech appeared very reasonable to the Oreillons; they deputed two of their people with all expedition to inquire into the truth of this affair. The two delegates acquitted themselves of their commission like men of sense, and soon returned with good tidings. Upon this the Oreillons released their two prisoners, showed them all sorts of civilities, offered them girls, gave them refreshments, and reconducted them to the confines of their country, crying before them all the way, in token of joy, “He is no Jesuit, he is no Jesuit.”"}, {"fr": "Candide ne se lassait point d’admirer le sujet de sa délivrance. « Quel peuple ! disait-il, quels hommes ! quelles mœurs ! si je n’avais pas eu le bonheur de donner un grand coup d’épée au travers du corps du frère de Mlle Cunégonde, j’étais mangé sans rémission. Mais, après tout, la pure nature est bonne, puisque ces gens-ci, au lieu de me manger, m’ont fait mille honnêtetés dès qu’ils ont su que je n’étais pas jésuite. »", "en": "Candide could not help admiring the cause of his deliverance. “What men! what manners!” cried he: “if I had not fortunately run my sword up to the hilt in the body of Miss Cunegund’s brother, I should have infallibly been eaten alive. But, after all, pure nature is an excellent thing; since these people, instead of eating me, showed me a thousand civilities, as soon as they knew I was not a Jesuit.”"}, {"fr": "Quand ils furent aux frontières des Oreillons : « Vous voyez, dit Cacambo à Candide, que cet hémisphère-ci ne vaut pas mieux que l’autre ; croyez-moi, retournons en Europe par le plus court chemin.", "en": "When they got to the frontiers of the Oreillons, Cacambo said to Candide, “You see, this hemisphere is no better than the other: take my advice, and let us return to Europe by the shortest way possible.”"}, {"fr": "Comment y retourner, dit Candide ; et où aller ? Si je vais dans mon pays, les Bulgares et les Abares y égorgent tout ; si je retourne en Portugal, j’y suis brûlé ; si nous restons dans ce pays-ci, nous risquons à tout moment d’être mis en broche. Mais comment se résoudre à quitter la partie du monde que Mlle Cunégonde habite ?", "en": "“But how can we get back?” said Candide; “and whither shall we go? To my own country? the Bulgarians and the Abares are laying that waste with fire and sword. Or shall we go to Portugal? there I shall be burnt; and if we abide here, we are every moment in danger of being spitted. But how can I bring myself to quit that part of the world where Miss Cunegund has her residence?”"}, {"fr": "Tournons vers la Cayenne, dit Cacambo, nous y trouverons des Français, qui vont par tout le monde ; ils pourront nous aider. Dieu aura peut-être pitié de nous. »", "en": "“Let us turn towards Cayenne,” said Cacambo; “there we shall meet with some Frenchmen; for you know those gentry ramble all over the world; perhaps they will assist us, and God will look with pity on our distress.”"}, {"fr": "Il n’était pas facile d’aller à la Cayenne : ils savaient bien à peu près de quel côté il fallait marcher ; mais des montagnes, des fleuves, des précipices, des brigands, des sauvages, étaient partout de terribles obstacles. Leurs chevaux moururent de fatigue ; leurs provisions furent consumées ; ils se nourrirent un mois entier de fruits sauvages, et se trouvèrent enfin auprès d’une petite rivière bordée de cocotiers, qui soutinrent leur vie et leurs espérances.", "en": "It was not so easy to get to Cayenne. They knew pretty nearly whereabouts it lay; but the mountains, rivers, precipices, robbers, savages, were dreadful obstacles in the way. Their horses died with fatigue, and their provisions were at an end. They subsisted a whole month upon wild fruit, till at length they came to a little river bordered with cocoa-nut palms, the sight of which at once sustained life and hope."}, {"fr": "Cacambo, qui donnait toujours d’aussi bons conseils que la vieille, dit à Candide : « Nous n’en pouvons plus, nous avons assez marché ; j’aperçois un canot vide sur le rivage, emplissons-le de cocos, jetons-nous dans cette petite barque, laissons-nous aller au courant ; une rivière mène toujours à quelque endroit habité. Si nous ne trouvons pas des choses agréables, nous trouverons du moins des choses nouvelles.", "en": "Cacambo, who was always giving as good advice as the old woman herself, said to Candide, “You see there is no holding out any longer; we have travelled enough on foot. I see an empty canoe near the river-side; let us fill it with cocoa-nuts, get into it, and go down with the stream; a river always leads to some inhabited place. If we do not meet with agreeable things, we shall at least meet with something new.”"}, {"fr": "Allons, dit Candide, recommandons-nous à la Providence. »", "en": "“Agreed,” replied Candide; “let us recommend ourselves to Providence.”"}, {"fr": "Ils voguèrent quelques lieues entre des bords, tantôt fleuris, tantôt arides, tantôt unis, tantôt escarpés. La rivière s’élargissait toujours ; enfin elle se perdait sous une voûte de rochers épouvantables qui s’élevaient jusqu’au ciel. Les deux voyageurs eurent la hardiesse de s’abandonner aux flots sous cette voûte. Le fleuve, resserré en cet endroit, les porta avec une rapidité et un bruit horrible. Au bout de vingt-quatre heures ils revirent le jour ; mais leur canot se fracassa contre les écueils ; il fallut se traîner de rocher en rocher pendant une lieue entière ; enfin ils découvrirent un horizon immense, bordé de montagnes inaccessibles. Le pays était cultivé pour le plaisir comme pour le besoin ; partout l’utile était agréable : les chemins étaient couverts ou plutôt ornés de voitures d’une forme et d’une matière brillante, portant des hommes et des femmes d’une beauté singulière, traînés rapidement par de gros moutons rouges qui surpassaient en vitesse les plus beaux chevaux d’Andalousie, de Tétuan, et de Méquinez.", "en": "They rowed a few leagues down the river, the banks of which were in some places covered with flowers; in others barren; in some parts smooth and level, and in others steep and rugged. The stream widened as they went further on, till at length it passed under one of the frightful rocks whose summits seemed to reach the clouds. Here our two travellers had the courage to commit themselves to the stream beneath this vault, which, contracting in this part, hurried them along with a dreadful noise and rapidity. At the end of four-and-twenty hours, they saw daylight again; but their canoe was dashed to pieces against the rocks. They were obliged to creep along, from rock to rock, for the space of a league, till at last a spacious plain presented itself to their sight, bound by inaccessible mountains. The country appeared cultivated equally for pleasure, and to produce the necessaries of life. The useful and agreeable were here equally blended. The roads were covered, or rather adorned, with carriages formed of glittering materials, in which were men and women of a surprising beauty, drawn with great rapidity by red sheep of a very large size, which far surpassed in speed the finest coursers of Andalusia, Tetuan, or Mequinez."}, {"fr": "« Voilà pourtant, dit Candide, un pays qui vaut mieux que la Vestphalie. » Il mit pied à terre avec Cacambo auprès du premier village qu’il rencontra. Quelques enfants du village, couverts de brocarts d’or tout déchirés, jouaient au palet à l’entrée du bourg ; nos deux hommes de l’autre monde s’amusèrent à les regarder : leurs palets étaient d’assez larges pièces rondes, jaunes, rouges, vertes, qui jetaient un éclat singulier. Il prit envie aux voyageurs d’en ramasser quelques-uns ; c’était de l’or, c’était des émeraudes, des rubis, dont le moindre aurait été le plus grand ornement du trône du Mogol. « Sans doute, dit Cacambo, ces enfants sont les fils du roi du pays qui jouent au petit palet. » Le magister du village parut dans ce moment pour les faire rentrer à l’école. « Voilà, dit Candide, le précepteur de la famille royale. »", "en": "“Here is a country, however,” said Candide, “preferable to Westphalia.” He and Cacambo landed near the first village they saw, at the entrance of which they perceived some children covered with tattered garments of the richest brocade, playing at quoits. Our two inhabitants of the other hemisphere amused themselves greatly with what they saw. The quoits were large round pieces, yellow, red, and green, which cast a most glorious lustre. Our travellers picked some of them up, and they proved to be gold, emeralds, rubies, and diamonds, the least of which would have been the greatest ornament to the superb throne of the great Mogul. “Without doubt,” said Cacambo, “those children must be the king’s sons, that are playing at quoits.”"}, {"fr": "Les petits gueux quittèrent aussitôt le jeu, en laissant à terre leurs palets, et tout ce qui avait servi à leurs divertissements. Candide les ramasse, court au précepteur, et les lui présente humblement, lui faisant entendre par signes que leurs altesses royales avaient oublié leur or et leurs pierreries. Le magister du village, en souriant, les jeta par terre, regarda un moment la figure de Candide avec beaucoup de surprise, et continua son chemin.", "en": "As he was uttering those words, the schoolmaster of the village appeared, who came to call them to school. “There,” said Candide, “is the preceptor of the royal family.” The little ragamuffins immediately quitted their game, leaving the quoits on the ground with all their other playthings. Candide gathered them up, ran to the schoolmaster, and, with a most respectful bow, presented them to him, giving him to understand by signs that their Royal Highnesses had forgotten their gold and precious stones. The schoolmaster, with a smile, flung them upon the ground, then having examined Candide from head to foot with an air of great surprise, went on his way."}, {"fr": "Les voyageurs ne manquèrent pas de ramasser l’or, les rubis, et les émeraudes. « Où sommes-nous ? s’écria Candide. Il faut que les enfants des rois de ce pays soient bien élevés, puisqu’on leur apprend à mépriser l’or et les pierreries. » Cacambo était aussi surpris que Candide. Ils approchèrent enfin de la première maison du village ; elle était bâtie comme un palais d’Europe. Une foule de monde s’empressait à la porte, et encore plus dans le logis ; une musique très-agréable se faisait entendre, et une odeur délicieuse de cuisine se faisait sentir. Cacambo s’approcha de la porte, et entendit qu’on parlait péruvien ; c’était sa langue maternelle ; car tout le monde sait que Cacambo était né au Tucuman, dans un village où l’on ne connaissait que cette langue. « Je vous servirai d’interprète, dit-il à Candide ; entrons, c’est ici un cabaret. »", "en": "Our travellers took care, however, to gather up the gold, the rubies, and the emeralds. “Where are we?” cried Candide. “The king’s children in this country must have an excellent education, since they are taught to show such a contempt for gold and precious stones.” Cacambo was as much surprised as his master. They at length drew near the first house in the village, which was built after the manner of a European palace. There was a crowd of people round the door, and a still greater number in the house. The sound of the most delightful musical instruments was heard, and the most agreeable smell came from the kitchen. Cacambo went up to the door, and heard those within talking in the Peruvian language, which was his mother tongue; for every one knows that Cacambo was born in a village of Tucuman where no other language is spoken. “I will be your interpreter here,” said he to Candide; “let us go in; this is an eating-house.”"}, {"fr": "Aussitôt deux garçons et deux filles de l’hôtellerie, vêtus de drap d’or, et les cheveux renoués avec des rubans, les invitent à se mettre à la table de l’hôte. On servit quatre potages garnis chacun de deux perroquets, un contour bouilli qui pesait deux cents livres, deux singes rôtis d’un goût excellent, trois cents colibris dans un plat, et six cents oiseaux-mouches dans un autre ; des ragoûts exquis, des pâtisseries délicieuses ; le tout dans des plats d’une espèce de cristal de roche. Les garçons et les filles de l’hôtellerie versaient plusieurs liqueurs faites de cannes de sucre.", "en": "Immediately two waiters, and two servant-girls, dressed in cloth of gold, and their hair braided with ribbons of tissue, accosted the strangers, and invited them to sit down to the ordinary. Their dinner consisted of four dishes of different soups, each garnished with two young paroquets, a large dish of bouille that weighed two hundredweight, two roasted monkeys of a delicious flavour, three hundred humming-birds in one dish, and six hundred fly-birds in another; some excellent ragouts, delicate tarts, and the whole served up in dishes of rock-crystal. Several sorts of liquors, extracted from the sugar-cane, were handed about by the servants who attended."}, {"fr": "Les convives étaient pour la plupart des marchands et des voituriers, tous d’une politesse extrême, qui firent quelques questions à Cacambo avec la discrétion la plus circonspecte, et qui répondirent aux siennes d’une manière à le satisfaire.", "en": "Most of the company were chapmen and wagoners, all extremely polite: they asked Cacambo a few questions, with the utmost discretion and circumspection; and replied to his in a most obliging and satisfactory manner."}, {"fr": "Quand le repas fut fini, Cacambo crut, ainsi que Candide, bien payer son écot en jetant sur la table de l’hôte deux de ces larges pièces d’or qu’il avait ramassées ; l’hôte et l’hôtesse éclatèrent de rire, et se tinrent longtemps les côtés. Enfin ils se remirent. « Messieurs, dit l’hôte, nous voyons bien que vous êtes des étrangers ; nous ne sommes pas accoutumés à en voir. Pardonnez-nous si nous nous sommes mis à rire quand vous nous avez offert en paiement les cailloux de nos grands chemins. Vous n’avez pas sans doute de la monnaie du pays, mais il n’est pas nécessaire d’en avoir pour dîner ici. Toutes les hôtelleries établies pour la commodité du commerce sont payées par le gouvernement. Vous avez fait mauvaise chère ici, parce que c’est un pauvre village, mais partout ailleurs vous serez reçus comme vous méritez de l’être. » Cacambo expliquait à Candide tous les discours de l’hôte, et Candide les écoutait avec la même admiration et le même égarement que son ami Cacambo les rendait. « Quel est donc ce pays, disaient-ils l’un et l’autre, inconnu à tout le reste de la terre, et où toute la nature est d’une espèce si différente de la nôtre ? C’est probablement le pays où tout va bien ; car il faut absolument qu’il y en ait un de cette espèce. Et, quoi qu’en dît maître Pangloss, je me suis souvent aperçu que tout allait assez mal en Vestphalie. »", "en": "As soon as dinner was over, both Candide and Cacambo thought they would pay very handsomely for their entertainment by laying down two of those large gold pieces which they had picked off the ground; but the landlord and landlady burst into a fit of laughing and held their sides for some time before they were able to speak. “Gentlemen,” said the landlord, “I plainly perceive you are strangers, and such we are not accustomed to see; pardon us, therefore, for laughing when you offered us the common pebbles of our highways for payment of your reckoning. To be sure, you have none of the coin of this kingdom; but there is no necessity to have any money at all to dine in this house. All the inns, which are established for the convenience of those who carry on the trade of this nation, are maintained by the government. You have found but very indifferent entertainment here, because this is only a poor village; but in almost every other of these public houses you will meet with a reception worthy of persons of your merit.” Cacambo explained the whole of this speech of the landlord to Candide, who listened to it with the same astonishment with which his friend communicated it. “What sort of a country is this,” said the one to the other, “that is unknown to all the world, and in which Nature had everywhere so different an appearance from what she has in ours? Possibly this is that part of the globe where everything is right, for there must certainly be some such place; and, for all that Master Pangloss could say, I often perceived that things went very ill in Westphalia.”"}, {"fr": "Cacambo témoigna à son hôte toute sa curiosité ; l’hôte lui dit : « Je suis fort ignorant, et je m’en trouve bien ; mais nous avons ici un vieillard retiré de la cour qui est le plus savant homme du royaume, et le plus communicatif. » Aussitôt il mène Cacambo chez le vieillard. Candide ne jouait plus que le second personnage, et accompagnait son valet. Ils entrèrent dans une maison fort simple, car la porte n’était que d’argent, et les lambris des appartements n’étaient que d’or, mais travaillés avec tant de goût que les plus riches lambris ne l’effaçaient pas. L’antichambre n’était à la vérité incrustée que de rubis et d’émeraudes ; mais l’ordre dans lequel tout était arrangé réparait bien cette extrême simplicité.", "en": "Cacambo vented all his curiosity upon the landlord by a thousand different questions. The honest man answered him thus: “I am very ignorant, Sir, but I am contented with my ignorance; however, we have in this neighbourhood an old man retired from court, who is the most learned and communicative person in the whole kingdom.” He then directed Cacambo to the old man; Candide acted now only a second character, and attended his servant. They entered a quite plain house, for the door was nothing but silver, and the ceiling was only of beaten gold, but wrought in so elegant a taste as to vie with the richest. The antechamber, indeed, was only incrusted with rubies and emeralds; but the order in which everything was disposed made amends for this great simplicity."}, {"fr": "Le vieillard reçut les deux étrangers sur un sofa matelassé de plumes de colibri, et leur fit présenter des liqueurs dans des vases de diamant ; après quoi il satisfit à leur curiosité en ces termes :", "en": "The old man received the strangers on a sofa, which was stuffed with humming-birds’ feathers; and ordered his servants to present them with liquors in golden goblets, after which he satisfied their curiosity in the following terms:"}, {"fr": "« Je suis âgé de cent soixante et douze ans, et j’ai appris de feu mon père, écuyer du roi, les étonnantes révolutions du Pérou dont il avait été témoin. Le royaume où nous sommes est l’ancienne patrie des Incas, qui en sortirent très-imprudemment pour aller subjuguer une partie du monde, et qui furent enfin détruits par les Espagnols. « Les princes de leur famille qui restèrent dans leur pays natal furent plus sages ; ils ordonnèrent, du consentement de la nation, qu’aucun habitant ne sortirait jamais de notre petit royaume ; et c’est ce qui nous a conservé notre innocence et notre félicité. Les Espagnols ont eu une connaissance confuse de ce pays, ils l’ont appelé Eldorado ; et un Anglais, nommé le chevalier Raleigh, en a même approché il y a environ cent années ; mais, comme nous sommes entourés de rochers inabordables et de précipices, nous avons toujours été jusqu’à présent à l’abri de la rapacité des nations de l’Europe, qui ont une fureur inconcevable pour les cailloux et pour la fange de notre terre, et qui, pour en avoir, nous tueraient tous jusqu’au dernier. »", "en": "“I am now one hundred and seventy-two years old; and I learnt of my late father who was equerry to the king the amazing revolutions of Peru, to which he had been an eye-witness. This kingdom is the ancient patrimony of the Incas, who very imprudently quitted it to conquer another part of the world, and were at length conquered and destroyed themselves by the Spaniards. “Those princes of their family who remained in their native country acted more wisely. They ordained, with the consent of their whole nation, that none of the inhabitants of our little kingdom should ever quit it; and to this wise ordinance we owe the preservation of our innocence and happiness. The Spaniards had some confused notion of this country, to which they gave the name of El Dorado; and Sir Walter Raleigh, an Englishman, actually came very near it, about a hundred years ago: but the inaccessible rocks and precipices with which our country is surrounded on all sides have hitherto secured us from the rapacious fury of the people of Europe, who have an unaccountable fondness for the pebbles and dirt of our land, for the sake of which they would murder us all to the very last man.”"}, {"fr": "La conversation fut longue ; elle roula sur la forme du gouvernement, sur les mœurs, sur les femmes, sur les spectacles publics, sur les arts. Enfin Candide, qui avait toujours du goût pour la métaphysique, fit demander par Cacambo si dans le pays il y avait une religion.", "en": "The conversation lasted some time and turned chiefly on the form of government, the customs, the women, the public diversions, and the arts. At length. Candide, who had always had a taste for metaphysics, asked whether the people of that country had any religion."}, {"fr": "Le vieillard rougit un peu. « Comment donc ! dit-il, en pouvez-vous douter ? Est-ce que vous nous prenez pour des ingrats ? » Cacambo demanda humblement quelle était la religion d’Eldorado. Le vieillard rougit encore : « Est-ce qu’il peut y avoir deux religions ? dit-il. Nous avons, je crois, la religion de tout le monde ; nous adorons Dieu du soir jusqu’au matin.", "en": "The old man reddened a little at this question. “Can you doubt it?” said he. “Do you take us for wretches lost to all sense of gratitude?” Cacambo asked in a respectful manner what was the established religion of El Dorado. The old man blushed again. “Can there be two religions then?” he said. “Ours, I apprehend, is the religion of the whole world; we worship God from morning till night.”"}, {"fr": "N’adorez-vous qu’un seul Dieu ? dit Cacambo, qui servait toujours d’interprète aux doutes de Candide.", "en": "“Do you worship but one God?” said Cacambo, who still acted as the interpreter of Candide’s doubts."}, {"fr": "Apparemment, dit le vieillard, qu’il n’y en a ni deux, ni trois, ni quatre. Je vous avoue que les gens de votre monde font des questions bien singulières. » Candide ne se lassait pas de faire interroger ce bon vieillard ; il voulut savoir comment on priait Dieu dans Eldorado. « Nous ne le prions point, dit le bon et respectable sage ; nous n’avons rien à lui demander, il nous a donné tout ce qu’il nous faut ; nous le remercions sans cesse. » Candide eut la curiosité de voir des prêtres ; il fit demander où ils étaient. Le bon vieillard sourit. « Mes amis, dit-il, nous sommes tous prêtres ; le roi et tous les chefs de famille chantent des cantiques d’actions de grâces solennellement tous les matins, et cinq ou six mille musiciens les accompagnent.", "en": "“Certainly,” said the old man; “there are not two, nor three, nor four Gods. I must confess the people of your world ask very extraordinary questions.” However, Candide could not refrain from making many more inquiries of the old man; he wanted to know in what manner they prayed to God in El Dorado. “We do not pray to him at all,” said the reverend sage; “we have nothing to ask of him, he has given us all we want, and we give him thanks incessantly.” Candide had a curiosity to see some of their priests, and desired Cacambo to ask the old man where they were. At this he, smiling, said, “My friends, we are all of us priests; the King and all the heads of families sing solemn hymns of thanksgiving every morning, accompanied by five or six thousand musicians.”"}, {"fr": "Quoi ! vous n’avez point de moines qui enseignent, qui disputent, qui gouvernent, qui cabalent, et qui font brûler les gens qui ne sont pas de leur avis ?", "en": "“What!” said Cacambo, “have you no monks among you, to dispute, to govern, to intrigue, and to burn people who are not of the same opinion with themselves?”"}, {"fr": "Il faudrait que nous fussions fous, dit le vieillard ; nous sommes tous ici du même avis, et nous n’entendons pas ce que vous voulez dire avec vos moines. » Candide à tous ces discours demeurait en extase, et disait en lui-même : « Ceci est bien différent de la Vestphalie et du château de monsieur le baron : si notre ami Pangloss avait vu Eldorado, il n’aurait plus dit que le château de Thunder-ten-tronckh était ce qu’il y avait de mieux sur la terre ; il est certain qu’il faut voyager. »", "en": "“Do you take us for fools?” said the old man. “Here we are all of one opinion, and know not what you mean by your monks.” During the whole of this discourse Candide was in raptures, and he said to himself: “What a prodigious difference is there between this place and Westphalia, and this house and the Baron’s castle! If our friend Pangloss had seen El Dorado, he would no longer have said that the castle of Thunder-ten-tronckh was the finest of all possible edifices: there is nothing like seeing the world, that’s certain.”"}, {"fr": "Après cette longue conversation, le bon vieillard fit atteler un carrosse à six moutons, et donna douze de ses domestiques aux deux voyageurs pour les conduire à la cour. « Excusez-moi, leur dit-il, si mon âge me prive de l’honneur de vous accompagner. Le roi vous recevra d’une manière dont vous ne serez pas mécontents, et vous pardonnerez sans doute aux usages du pays, s’il y en a quelques-uns qui vous déplaisent. »", "en": "This long conversation being ended, the old man ordered six sheep to be harnessed, and put to the coach, and sent twelve of his servants to escort the travellers to Court. “Excuse me,” said he, “for not waiting on you in person; my age deprives me of that honour. The King will receive you in such a manner that you will have no reason to complain; and doubtless you will make a proper allowance for the customs of the country, if they should not happen altogether to please you.”"}, {"fr": "Candide et Cacambo montent en carrosse ; les six moutons volaient, et en moins de quatre heures on arriva au palais du roi, situé à un bout de la capitale. Le portail était de deux cent vingt pieds de haut, et de cent de large ; il est impossible d’exprimer quelle en était la matière. On voit assez quelle supériorité prodigieuse elle devait avoir sur ces cailloux et sur ce sable que nous nommons or et pierreries.", "en": "Candide and Cacambo got into the coach, the six sheep flew, and in less than a quarter of an hour they arrived at the King’s palace, which was situated at the further end of the capital. At the entrance was a portal two hundred and twenty feet high, and one hundred wide; but it is impossible for words to express the materials of which it was built. The reader, however, will readily conceive they must have a prodigious superiority over the pebbles and sand which we call gold and precious stones."}, {"fr": "Vingt belles filles de la garde reçurent Candide et Cacambo à la descente du carrosse, les conduisirent aux bains, les vêtirent de robes d’un tissu de duvet de colibri ; après quoi les grands officiers et les grandes officières de la couronne les menèrent à l’appartement de Sa Majesté au milieu de deux files, chacune de mille musiciens, selon l’usage ordinaire. Quand ils approchèrent de la salle du trône, Cacambo demanda à un grand officier comment il fallait s’y prendre pour saluer Sa Majesté : si on se jetait à genoux ou ventre à terre ; si on mettait les mains sur la tête ou sur le derrière ; si on léchait la poussière de la salle ; en un mot, quelle était la cérémonie. « L’usage, dit le grand officier, est d’embrasser le roi et de le baiser des deux côtés. » Candide et Cacambo sautèrent au cou de Sa Majesté, qui les reçut avec toute la grâce imaginable, et qui les pria poliment à souper.", "en": "Twenty beautiful young virgins-in-waiting received Candide and Cacambo at their alighting from the coach, conducted them to the bath, and clad them in robes woven of the down of humming-birds; after this they were introduced by the great officers of the crown of both sexes to the King’s apartment, between two files of musicians, each file consisting of a thousand, according to the custom of the country. When they drew near to the presence chamber, Cacambo asked one of the officers in what manner they were to pay their obeisance to his Majesty: whether it was the custom to fall upon their knees, or to prostrate themselves upon the ground? whether they were to put their hands upon their heads, or behind their backs? whether they were to lick the dust off the floor? in short, what was the ceremony usual on such occasions? “The custom,” said the great officer, “is to embrace the King, and kiss him on each cheek.” Candide and Cacambo accordingly threw their arms round his Majesty’s neck; and he received them in the most gracious manner imaginable, and very politely asked them to sup with him."}, {"fr": "En attendant, on leur fit voir la ville, les édifices publics élevés jusqu’aux nues, les marchés ornés de mille colonnes, les fontaines d’eau pure, les fontaines d’eau rose, celles de liqueurs de cannes de sucre qui coulaient continuellement dans de grandes places pavées d’une espèce de pierreries qui répandaient une odeur semblable à celle du girofle et de la cannelle. Candide demanda à voir la cour de justice, le parlement ; on lui dit qu’il n’y en avait point, et qu’on ne plaidait jamais. Il s’informa s’il y avait des prisons, et on lui dit que non. Ce qui le surprit davantage, et qui lui fit le plus de plaisir, ce fut le palais des sciences, dans lequel il vit une galerie de deux mille pas, toute pleine d’instruments de mathématiques et de physique.", "en": "While supper was preparing, orders were given to show them the city, where they saw public structures that reared their lofty heads to the clouds; the marketplaces decorated with a thousand columns; fountains of spring water, besides others of rose water, and of liquors drawn from the sugar-cane, incessantly flowing in the great squares; these were paved with a kind of precious stone that emitted an odour like that of cloves and cinnamon. Candide asked to see the high court of justice, the parliament; but was answered that they have none in that country, being utter strangers to lawsuits. He then inquired, if they had any prisons; they replied, “None.” But what gave him at once the greatest surprise and pleasure was the Palace of Sciences, where he saw a gallery two thousand feet long, filled with the various apparatus of mathematics and natural philosophy."}, {"fr": "Après avoir parcouru toute l’après-dînée à peu près la millième partie de la ville, on les ramena chez le roi. Candide se mit à table entre Sa Majesté, son valet Cacambo, et plusieurs dames. Jamais on ne fit meilleure chère, et jamais on n’eut plus d’esprit à souper qu’en eut Sa Majesté. Cacambo expliquait les bons mots du roi à Candide, et, quoique traduits, ils paraissaient toujours des bons mots. De tout ce qui étonnait Candide, ce n’était pas ce qui l’étonna le moins.", "en": "After having spent the whole afternoon in seeing only about a thousandth part of the city, they were brought back to the King’s palace. Candide sat down at the table with his Majesty, his servant Cacambo, and several ladies of the Court. Never was entertainment more elegant, nor could any one possibly show more wit than his Majesty displayed while they were at supper. Cacambo explained all the King’s bons mots to Candide, and although they were translated they still appeared to be bons mots. Of all the things that surprised Candide, this was not the least. They spent a whole month in this hospitable place, during which time Candide was continually saying to Cacambo:"}, {"fr": "Ils passèrent un mois dans cet hospice. Candide ne cessait de dire à Cacambo : « Il est vrai, mon ami, encore une fois, que le château où je suis né ne vaut pas le pays où nous sommes ; mais enfin Mlle Cunégonde n’y est pas, et vous avez sans doute quelque maîtresse en Europe. Si nous restons ici, nous n’y serons que comme les autres ; au lieu que si nous retournons dans notre monde, seulement avec douze moutons chargés de cailloux d’Eldorado, nous serons plus riches que tous les rois ensemble, nous n’aurons plus d’inquisiteurs à craindre, et nous pourrons aisément reprendre Mlle Cunégonde. »", "en": "“I own, my friend, once more, that the castle where I was born is a mere nothing in comparison with the place where we now are; but still Miss Cunegund is not here, and you yourself have doubtless some mistress in Europe. If we remain here, we shall only be as others are: whereas, if we return to our own world with only a dozen of El Dorado sheep, loaded with the pebbles of this country, we shall be richer than all the kings in Europe; we shall no longer need to stand in awe of the Inquisitors; and we may easily recover Miss Cunegund.”"}, {"fr": "Ce discours plut à Cacambo ; on aime tant à courir, à se faire valoir chez les siens, à faire parade de ce qu’on a vu dans ses voyages, que les deux heureux résolurent de ne plus l’être, et de demander leur congé à Sa Majesté.", "en": "This speech pleased Cacambo. A fondness for roving, for making a figure in their own country, and for boasting of what they had seen in their travels, was so strong in our two wanderers that they resolved to be no longer happy; and demanded permission of his Majesty to quit the country."}, {"fr": "« Vous faites une sottise, leur dit le roi ; je sais bien que mon pays est peu de chose ; mais, quand on est passablement quelque part, il faut y rester. Je n’ai pas assurément le droit de retenir des étrangers ; c’est une tyrannie qui n’est ni dans nos mœurs ni dans nos lois : tous les hommes sont libres ; partez quand vous voudrez, mais la sortie est bien difficile. Il est impossible de remonter la rivière rapide sur laquelle vous êtes arrivés par miracle, et qui court sous des voûtes de rochers. Les montagnes qui entourent tout mon royaume ont dix mille pieds de hauteur, et sont droites comme des murailles : elles occupent chacune en largeur un espace de plus de dix lieues ; on ne peut en descendre que par des précipices. Cependant, puisque vous voulez absolument partir, je vais donner ordre aux intendants des machines d’en faire une qui puisse vous transporter commodément. Quand on vous aura conduits au revers des montagnes, personne ne pourra vous accompagner : car mes sujets ont fait vœu de ne jamais sortir de leur enceinte, et ils sont trop sages pour rompre leur vœu. Demandez-moi d’ailleurs tout ce qu’il vous plaira.", "en": "“You are about to do a rash and silly action,” said the King; “I am sensible my kingdom is an inconsiderable spot; but when people are tolerably at their ease in any place, I should think it would be their interest to remain there. Most assuredly, I have no right to detain you or any strangers against your wills; this is an act of tyranny to which our manners and our laws are equally repugnant: all men are free; you have an undoubted liberty to depart whenever you please, but you will have many difficulties in passing the frontiers. It is impossible to ascend that rapid river which runs under high and vaulted rocks, and by which you were conveyed hither by a miracle. The mountains by which my kingdom is hemmed in on all sides are ten thousand feet high, and perfectly perpendicular; they are above ten leagues over each, and the descent from them is one continued precipice. However, since you are determined to leave us, I will immediately give orders to the superintendent of machines to cause one to be made that will convey you safely. When they have conducted you to the back of the mountains, nobody can attend you further; for my subjects have made a vow never to quit the kingdom, and they are too prudent to break it. Ask me whatever else you please.”"}, {"fr": "Nous ne demandons à Votre Majesté, dit Cacambo, que quelques moutons chargés de vivres, de cailloux, et de la boue du pays. » Le roi rit : « Je ne conçois pas, dit-il, quel goût vos gens d’Europe ont pour notre boue jaune ; mais emportez-en tant que vous voudrez, et grand bien vous fasse. »", "en": "“All we shall ask of your Majesty,” said Cacambo, “is a few sheep laden with provisions, pebbles, and the clay of your country.” The King smiled at the request, and said, “I cannot imagine what pleasure you Europeans find in our yellow clay; but take away as much of it as you will, and much good may it do you.”"}, {"fr": "Il donna l’ordre sur-le-champ à ses ingénieurs de faire une machine pour guinder ces deux hommes extraordinaires hors du royaume. Trois mille bons physiciens y travaillèrent ; elle fut prête au bout de quinze jours, et ne coûta pas plus de vingt millions de livres sterling, monnaie du pays. On mit sur la machine Candide et Cacambo ; il y avait deux grands moutons rouges sellés et bridés pour leur servir de monture quand ils auraient franchi les montagnes, vingt moutons de bât chargés de vivres, trente qui portaient des présents de ce que le pays a de plus curieux, et cinquante chargés d’or, de pierreries, et de diamants. Le roi embrassa tendrement les deux vagabonds.", "en": "He immediately gave orders to his engineers to make a machine to hoist these two extraordinary men out of the kingdom. Three thousand good mathematicians went to work and finished it in about fifteen days; and it did not cost more than twenty millions sterling of that country’s money. Candide and Cacambo were placed on this machine, and they took with them two large red sheep, bridled and saddled, to ride upon when they got on the other side of the mountains; twenty others to serve as pack-horses for carrying provisions; thirty laden with presents of whatever was most curious in the country; and fifty with gold, diamonds, and other precious stones. The King embraced the two wanderers with the greatest cordiality."}, {"fr": "Ce fut un beau spectacle que leur départ, et la manière ingénieuse dont ils furent hissés eux et leurs moutons au haut des montagnes. Les physiciens prirent congé d’eux après les avoir mis en sûreté, et Candide n’eut plus d’autre désir et d’autre objet que d’aller présenter ses moutons à Mlle Cunégonde. « Nous avons, dit-il, de quoi payer le gouverneur de Buénos-Ayres, si Mlle Cunégonde peut être mise à prix. Marchons vers la Cayenne, embarquons-nous, et nous verrons ensuite quel royaume nous pourrons acheter. »", "en": "It was a curious sight to behold the manner of their setting off, and the ingenious method by which they and their sheep were hoisted to the top of the mountains. The mathematicians and engineers took leave of them as soon as they had conveyed them to a place of safety, and Candide was wholly occupied with the thoughts of presenting his sheep to Miss Cunegund. “Now,” said he, “thanks to heaven, we have more than sufficient to pay the Governor of Buenos Ayres for Miss Cunegund, if she is redeemable. Let us make the best of our way to Cayenne, where we will take ship, and then we may at leisure think of what kingdom we shall purchase.”"}, {"fr": "La première journée de nos deux voyageurs fut assez agréable. Ils étaient encouragés par l’idée de se voir possesseurs de plus de trésors que l’Asie, l’Europe et l’Afrique, n’en pouvaient rassembler. Candide transporté, écrivit le nom de Cunégonde sur les arbres. À la seconde journée, deux de leurs moutons s’enfoncèrent dans des marais, et y furent abîmés avec leurs charges ; deux autres moutons moururent de fatigue quelques jours après ; sept ou huit périrent ensuite de faim dans un désert ; d’autres tombèrent au bout de quelques jours dans des précipices. Enfin, après cent jours de marche, il ne leur resta que deux moutons. Candide dit à Cacambo : « Mon ami, vous voyez comme les richesses de ce monde sont périssables ; il n’y a rien de solide que la vertu et le bonheur de revoir Mlle Cunégonde.", "en": "Our travellers’ first day’s journey was very pleasant; they were elated with the prospect of possessing more riches than were to be found in Europe, Asia, and Africa together. Candide, in amorous transports, cut the name of Miss Cunegund on the trees. The second day, two of their sheep sank into a morass, and were swallowed up with their loads; two more died of fatigue some few days afterwards; seven or eight perished with hunger in a desert, and others, at different times, tumbled down precipices; so that, after travelling about a hundred days, they had only two sheep left. Said Candide to Cacambo, “You see, my dear friend, how perishable the riches of this world are; there is nothing solid but virtue and the joy of seeing Miss Cunegund again.”"}, {"fr": "Je l’avoue, dit Cacambo ; mais il nous reste encore deux moutons avec plus de trésors que n’en aura jamais le roi d’Espagne ; et je vois bien de loin une ville que je soupçonne être Surinam, appartenante aux Hollandais. Nous sommes au bout de nos peines et au commencement de notre félicité. »", "en": "“Very true,” said Cacambo; “but we have still two sheep remaining, with more treasure than ever the King of Spain will be possessed of; and I espy a town at a distance, which I take to be Surinam, a town belonging to the Dutch. We are now at the end of our troubles, and at the beginning of happiness.”"}, {"fr": "En approchant de la ville, ils rencontrèrent un nègre étendu par terre, n’ayant plus que la moitié de son habit, c’est-à-dire d’un caleçon de toile bleue ; il manquait à ce pauvre homme la jambe gauche et la main droite. « Eh ! mon Dieu ! lui dit Candide en hollandais, que fais-tu là, mon ami, dans l’état horrible où je te vois ?", "en": "As they drew near the town, they saw a negro stretched on the ground with only one half of his habit, which was a pair of blue cotton drawers; for the poor man had lost his left leg, and his right hand. “Good God,” said Candide in Dutch, “what dost thou here, friend, in this deplorable condition?”"}, {"fr": "J’attends mon maître, M. Vanderdendur, le fameux négociant, répondit le nègre.", "en": "“I am waiting for my master Mynheer Vanderdendur, the famous trader,” answered the negro."}, {"fr": "Est-ce M. Vanderdendur, dit Candide, qui t’a traité ainsi ?", "en": "“Was it Mynheer Vanderdendur that used you in this cruel manner?”"}, {"fr": "Oui, monsieur, dit le nègre, c’est l’usage. On nous donne un caleçon de toile pour tout vêtement deux fois l’année. Quand nous travaillons aux sucreries, et que la meule nous attrape le doigt, on nous coupe la main ; quand nous voulons nous enfuir, on nous coupe la jambe : je me suis trouvé dans les deux cas. C’est à ce prix que vous mangez du sucre en Europe. Cependant, lorsque ma mère me vendit dix écus patagons sur la côte de Guinée, elle me disait : « Mon cher enfant, bénis nos fétiches, adore-les toujours, ils te feront vivre heureux ; tu as l’honneur d’être esclave de nos seigneurs les blancs, et tu fais par là la fortune de ton père et de ta mère. » Hélas ! je ne sais pas si j’ai fait leur fortune, mais ils n’ont pas fait la mienne. Les chiens, les singes, et les perroquets, sont mille fois moins malheureux que nous ; les fétiches hollandais qui m’ont converti me disent tous les dimanches que nous sommes tous enfants d’Adam, blancs et noirs. Je ne suis pas généalogiste ; mais si ces prêcheurs disent vrai, nous sommes tous cousins issus de germain. Or vous m’avouerez qu’on ne peut pas en user avec ses parents d’une manière plus horrible.", "en": "“Yes, Sir,” said the negro; “it is the custom here. They give a pair of cotton drawers twice a year, and that is all our covering. When we labour in the sugar-works, and the mill happens to snatch hold of a finger, they instantly chop off our hand; and when we attempt to run away, they cut off a leg. Both these cases have happened to me, and it is at this expense that you eat sugar in Europe; and yet when my mother sold me for ten pattacoons on the coast of Guinea, she said to me, ‘My dear child, bless our fetishes; adore them for ever; they will make thee live happy; thou hast the honour to be a slave to our lords the whites, by which thou wilt make the fortune of us thy parents.’ Alas! I know not whether I have made their fortunes; but they have not made mine: dogs, monkeys, and parrots, are a thousand times less wretched than me. The Dutch fetishes who converted me tell me every Sunday that, blacks and whites, we are all children of Adam. As for me, I do not understand any thing of genealogies; but if what these preachers say is true, we are all second cousins; and you must allow, that it is impossible to be worse treated by our relations than we are.”"}, {"fr": "— Ô Pangloss ! s’écria Candide, tu n’avais pas deviné cette abomination ; c’en est fait, il faudra qu’à la fin je renonce à ton optimisme.", "en": "“O Pangloss!” cried out Candide, “such horrid doings never entered my imagination. Here is an end of the matter; I find myself, after all, obliged to renounce thy Optimism.”"}, {"fr": "Qu’est-ce qu’optimisme ? disait Cacambo.", "en": "“Optimism!” said Cacambo, “what is that?”"}, {"fr": "Hélas ! dit Candide, c’est la rage de soutenir que tout est bien quand on est mal » ; et il versait des larmes en regardant son nègre ; et en pleurant, il entra dans Surinam.", "en": "“Alas!” replied Candide, “it is the obstinacy of maintaining that everything is best when it is worst”: and so saying, he turned his eyes towards the poor negro, and shed a flood of tears; and in this weeping mood he entered the town of Surinam."}, {"fr": "La première chose dont ils s’informent, c’est s’il n’y a point au port quelque vaisseau qu’on pût envoyer à Buénos-Ayres. Celui à qui ils s’adressèrent était justement un patron espagnol qui s’offrit à faire avec eux un marché honnête. Il leur donna rendez-vous dans un cabaret. Candide et le fidèle Cacambo allèrent l’y attendre avec leurs deux moutons.", "en": "Immediately upon their arrival, our travellers inquired if there was any vessel in the harbour which they might send to Buenos Ayres. The person they addressed themselves to happened to be the master of a Spanish bark, who offered to agree with them on moderate terms, and appointed them a meeting at a public-house. Thither Candide and his faithful Cacambo went to wait for him, taking with them their two sheep."}, {"fr": "Candide, qui avait le cœur sur les lèvres, conta à l’Espagnol toutes ses aventures, et lui avoua qu’il voulait enlever Mlle Cunégonde. « Je me garderai bien de vous passer à Buénos-Ayres, dit le patron ; je serais pendu, et vous aussi ; la belle Cunégonde est la maîtresse favorite de monseigneur. » Ce fut un coup de foudre pour Candide, il pleura longtemps ; enfin il tira à part Cacambo. « Voici, mon cher ami, lui dit-il, ce qu’il faut que tu fasses. Nous avons chacun dans nos poches pour cinq ou six millions de diamants, tu es plus habile que moi ; va prendre Mlle Cunégonde à Buénos-Ayres. Si le gouverneur fait quelque difficulté, donne-lui un million ; s’il ne se rend pas, donne-lui-en deux ; tu n’as point tué d’inquisiteur, on ne se défiera point de toi. J’équiperai un autre vaisseau, j’irai t’attendre à Venise : c’est un pays libre où l’on n’a rien à craindre ni des Bulgares, ni des Abares, ni des juifs, ni des inquisiteurs. » Cacambo applaudit à cette sage résolution. Il était au désespoir de se séparer d’un bon maître devenu son ami intime ; mais le plaisir de lui être utile l’emporta sur la douleur de le quitter. Ils s’embrassèrent en versant des larmes : Candide lui recommanda de ne point oublier la bonne vieille. Cacambo partit dès le jour même : c’était un très-bon homme que ce Cacambo.", "en": "Candide, who was all frankness and sincerity, made an ingenuous recital of his adventures to the Spaniard, declaring to him at the same time his resolution of carrying off Miss Cunegund. “In that case,” said the shipmaster, “I’ll take good care not to take you to Buenos Ayres. It would prove a hanging matter to us all. The fair Cunegund is the Governor’s favourite mistress.” These words were like a clap of thunder to Candide; he wept bitterly for a long time, and, taking Cacambo aside, he said to him: “I’ll tell you, my dear friend, what you must do. We have each of us in our pockets to the value of five or six millions in diamonds; you are cleverer at these matters than I; you must go to Buenos Ayres and bring off Miss Cunegund. If the Governor makes any difficulty, give him a million; if he holds out, give him two; as you have not killed an Inquisitor, they will have no suspicion of you: I’ll fit out another ship and go to Venice, where I will wait for you: Venice is a free country, where we shall have nothing to fear from Bulgarians, Abares, Jews, or Inquisitors.” Cacambo greatly applauded this wise resolution. He was inconsolable at the thought of parting with so good a master, who treated him more like an intimate friend than a servant; but the pleasure of being able to do him a service soon got the better of his sorrow. They embraced each other with a flood of tears. Candide charged him not to forget the old woman. Cacambo set out the same day. This Cacambo was a very honest fellow."}, {"fr": "Candide resta encore quelque temps à Surinam, et attendit qu’un autre patron voulût le mener en Italie, lui et les deux moutons qui lui restaient. Il prit des domestiques, et acheta tout ce qui lui était nécessaire pour un long voyage ; enfin M. Vanderdendur, maître d’un gros vaisseau, vint se présenter à lui. « Combien voulez-vous, demanda-t-il à cet homme, pour me mener en droiture à Venise, moi, mes gens, mon bagage, et les deux moutons que voilà ? » Le patron s’accorda à dix mille piastres ; Candide n’hésita pas.", "en": "Candide continued some days longer at Surinam, waiting for any captain to carry him and his two remaining sheep to Italy. He hired domestics and purchased many things necessary for a long voyage; at length, Mynheer Vanderdendur, skipper of a large Dutch vessel, came and offered his service. “What will you take,” said Candide, “to carry me, my servants, my baggage, and these two sheep you see here, direct to Venice?”"}, {"fr": "« Oh ! oh ! dit à part soi le prudent Vanderdendur, cet étranger donne dix mille piastres tout d’un coup ! il faut qu’il soit bien riche. » Puis, revenant un moment après, il signifia qu’il ne pouvait partir à moins de vingt mille. « Eh bien ! vous les aurez, dit Candide.", "en": "The skipper asked ten thousand piastres; and Candide agreed to his demand without hesitation. “Oh, ho!” said the cunning Vanderdendur to himself, “this stranger must be very rich; he agrees to give me ten thousand piastres without hesitation.” Returning a little while after, he told Candide that upon second consideration he could not undertake the voyage for less than twenty thousand. “Very well, you shall have them,” said Candide."}, {"fr": "Ouais, se dit tout bas le marchand, cet homme donne vingt mille piastres aussi aisément que dix mille. »", "en": "“Zounds!” said the skipper to himself, “this man agrees to pay twenty thousand piastres with as much ease as ten.”"}, {"fr": "Il revint encore, et dit qu’il ne pouvait le conduire à Venise à moins de trente mille piastres. « Vous en aurez donc trente mille, répondit Candide.", "en": "Accordingly he went back again, and told him roundly that he would not carry him to Venice for less than thirty thousand piastres. “Then you shall have thirty thousand,” said Candide."}, {"fr": "Oh ! oh ! se dit encore le marchand hollandais, trente mille piastres ne coûtent rien à cet homme-ci ; sans doute les deux moutons portent des trésors immenses : n’insistons pas davantage ; faisons-nous d’abord payer les trente mille piastres, et puis nous verrons. »", "en": "“Odso!” said the Dutchman once more to himself, “thirty thousand piastres seem a trifle to this man. Those sheep must certainly be laden with an immense treasure. I’ll stop here and ask no more; but make him pay down the thirty thousand piastres, and then we shall see.”"}, {"fr": "Candide vendit deux petits diamants, dont le moindre valait plus que tout l’argent que demandait le patron. Il le paya d’avance. Les deux moutons furent embarqués. Candide suivait dans un petit bateau pour joindre le vaisseau à la rade ; le patron prend son temps, met à la voile, démarre ; le vent le favorise. Candide éperdu et stupéfait le perd bientôt de vue. « Hélas ! cria-t-il, voilà un tour digne de l’ancien monde. » Il retourne au rivage, abîmé dans la douleur : car enfin il avait perdu de quoi faire la fortune de vingt monarques.", "en": "Candide sold two small diamonds, the least of which was worth more than all the skipper asked. He paid him before-hand, and the two sheep were put on board, and Candide followed in a small boat to join the vessel in the road. The skipper took his opportunity, hoisted his sails, and put out to sea with a favourable wind. Candide, confounded and amazed, soon lost sight of the ship. “Alas!” said he, “this is a trick like those in our old world!” He returned back to the shore overwhelmed with grief; and, indeed, he had lost what would have been the fortune of twenty monarchs."}, {"fr": "Il se transporte chez le juge hollandais ; et, comme il était un peu troublé, il frappe rudement à la porte ; il entre, expose son aventure, et crie un peu plus haut qu’il ne convenait. Le juge commença par lui faire payer dix mille piastres pour le bruit qu’il avait fait ; ensuite il l’écouta patiemment, lui promit d’examiner son affaire sitôt que le marchand serait revenu, et se fit payer dix mille autres piastres pour les frais de l’audience.", "en": "Immediately upon his landing, he applied to the Dutch magistrate: being transported with passion, he thundered at the door; which being opened, he went in, told his case, and talked a little louder than was necessary. The magistrate began by fining him ten thousand piastres for his petulance, and then listened very patiently to what he had to say, promised to examine into the affair at the skipper’s return, and ordered him to pay ten thousand piastres more for the fees of the court."}, {"fr": "Ce procédé acheva de désespérer Candide ; il avait à la vérité essuyé des malheurs mille fois plus douloureux ; mais le sang-froid du juge, et celui du patron dont il était volé, alluma sa bile, et le plongea dans une noire mélancolie. La méchanceté des hommes se présentait à son esprit dans toute sa laideur, il ne se nourrissait que d’idées tristes. Enfin un vaisseau français étant sur le point de partir pour Bordeaux, comme il n’avait plus de moutons chargés de diamants à embarquer, il loua une chambre du vaisseau à juste prix, et fit signifier dans la ville qu’il payerait le passage, la nourriture, et donnerait deux mille piastres à un honnête homme qui voudrait faire le voyage avec lui, à condition que cet homme serait le plus dégoûté de son état et le plus malheureux de la province.", "en": "This treatment put Candide out of all patience: it is true, he had suffered misfortunes a thousand times more grievous; but the cool insolence of the judge and of the skipper who robbed him raised his choler and threw him into a deep melancholy. The villainy of mankind presented itself to his mind in all its deformity, and his soul was a prey to the most gloomy ideas. After some time, hearing that the captain of a French ship was ready to set sail for Bordeaux, as he had no more sheep loaded with diamonds to put on board, he hired the cabin at the usual price; and made it known in the town that he would pay the passage and board of any honest man who would give him his company during the voyage; besides making him a present of ten thousand piastres, on condition that such person was the most dissatisfied with his condition and the most unfortunate in the whole province."}, {"fr": "Il se présenta une foule de prétendants qu’une flotte n’aurait pu contenir. Candide, voulant choisi
