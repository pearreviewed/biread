<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>@@CSS@@</style>
</head>
<body>
<header id="app-header">
  <div class="header-left">
    <span class="eyebrow">Lecteur bilingue</span>
    <span class="booktitle" id="book-title-label"></span>
  </div>
  <div class="header-right">
    <button class="counter" id="counter" data-i18n-aria="goToPage" aria-label="Go to a page"></button>
    <input class="counter-input" id="counter-input" type="text" inputmode="numeric" autocomplete="off" data-i18n-aria="pageNumber" aria-label="Page number" hidden>
    <button class="btn-pill" id="blur-toggle" data-i18n="blur">Blur translation</button>
    <div class="segmented-row">
      <div class="segmented" role="group" aria-label="Translation source">
        <button id="seg-translation" data-i18n="translation" aria-pressed="true">AI translation</button>
        <span class="seg-divider"></span>
        <button id="seg-published" data-i18n="published" aria-pressed="false" aria-disabled="true" tabindex="-1" disabled>Published</button>
      </div>
      <button class="info-btn" id="info-btn" data-i18n-aria="aboutPublished" aria-label="About the published translation" data-info="1">i</button>
    </div>
    <div class="nav-controls">
      <button id="chap-btn" data-pop="1" data-i18n="chapters" aria-haspopup="true" aria-expanded="false">Chapters</button>
      <span class="seg-divider"></span>
      <button id="bm-star" class="bm-star" aria-pressed="false" data-i18n-aria="bookmark" data-i18n-title="bookmark" aria-label="Bookmark this spread" title="Bookmark this spread">
        <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path id="bm-star-path" d="M2 1.2 h10 a1 1 0 0 1 1 1 V16.6 a0.5 0.5 0 0 1 -0.8 0.4 L7 13.4 l-5.2 3.6 A0.5 0.5 0 0 1 1 16.6 V2.2 a1 1 0 0 1 1 -1 z" fill="transparent" stroke="#a98f78" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <span class="seg-divider"></span>
      <button id="bm-btn" data-pop="1" data-i18n="bookmarks" aria-haspopup="true" aria-expanded="false">Bookmarks</button>
    </div>
    <div class="fontsize-control">
      <button id="font-dec" data-i18n-aria="smallerText" aria-label="Smaller text">A−</button>
      <span class="seg-divider"></span>
      <button id="font-inc" data-i18n-aria="largerText" aria-label="Larger text">A+</button>
    </div>
    <!-- The "take it with you" cluster, set apart at the far edge. Every other
         control works the book in place; these hand it off — the link this exact
         spot, the edits link the reader's own corrections, the download the whole
         book. The edits link appears only once corrections exist; download only
         when a format was built. -->
    <button class="link-btn" id="link-btn" data-i18n-aria="copyLink" data-i18n-title="copyLink" aria-label="Copy a link to this page" title="Copy a link to this page">
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    </button>
    <!-- Carries the reader's corrections in a link, separate from the page link
         above so private edits never ride a shared page. Revealed by JS only when
         there is at least one correction to carry. -->
    <button class="link-btn edits-btn" id="edits-btn" data-i18n-aria="reviseCopyEdits" data-i18n-title="reviseCopyEdits" aria-label="Copy a link to your corrections" title="Copy a link to your corrections" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    </button>
    <button class="link-btn dl-btn" id="dl-btn" data-pop="1" data-i18n-aria="download" data-i18n-title="download" aria-haspopup="true" aria-expanded="false" aria-label="Download this book" title="Download this book" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
</header>
<div id="stage-wrap"><div class="loading-msg">@@UI_LOADING@@</div></div>
<div id="measure-host"></div>
<div id="overlay-root"></div>
<!-- Built formats, base64, read only when the reader downloads one — kept out of
     the book data so it is not parsed on every open. Empty on a plain build. -->
@@DOWNLOADS@@
<script type="application/json" id="book-data">@@BOOK_DATA@@</script>
<script>@@JS@@</script>
</body>
</html>
