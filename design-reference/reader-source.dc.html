<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #17130d; }
  a { color: #8a6a3a; }
  a:hover { color: #a5814b; }
  .fw { cursor: help; border-radius: 2px; transition: background .14s ease; outline: none; }
  .fw:hover { background: rgba(150,110,60,0.20); }
  .fw:focus-visible { outline: 2px solid rgba(140,105,55,.75); outline-offset: 1px; background: rgba(150,110,60,0.20); }
  button:focus-visible { outline: 2px solid rgba(200,175,130,.85); outline-offset: 2px; }
  @keyframes pageShade { 0% { opacity: 0; } 45% { opacity: .7; } 100% { opacity: 0; } }
  @keyframes pageCurl { 0% { transform: scaleX(1); } 50% { transform: scaleX(.94); } 100% { transform: scaleX(1); } }
  @keyframes tipIn { from { opacity: 0; transform: translate(-50%, var(--ty, 0)) scale(.96); } }
  @keyframes xfade { from { opacity: 0; } }
</style>
</helmet>
<div style="min-height: 100vh; background: radial-gradient(120% 90% at 50% 15%, #2c2418 0%, #1c160f 55%, #120d08 100%); display: flex; flex-direction: column; font-family: 'EB Garamond', Georgia, serif; color: #ded2b8; overflow-x: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 30px; border-bottom: 1px solid rgba(180,150,100,.14); flex-wrap: wrap;">
    <div style="display: flex; align-items: baseline; gap: 14px;">
      <span style="font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #8f7d5e;">Lecteur bilingue</span>
      <span style="font-size: 18px; color: #cbbc9b; font-style: italic;">La maison au bord du fleuve</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 13px; letter-spacing: .18em; color: #7d6e52; min-width: 54px; text-align: right;">{{ counter }}</span>
      <button onClick="{{ toggleBlur }}" style="font-family: inherit; font-size: 14px; color: #e4d7ba; background: rgba(120,95,55,.16); border: 1px solid rgba(180,150,100,.28); border-radius: 999px; padding: 7px 16px; cursor: pointer;">{{ blurLabel }}</button>
      {{ transControl }}
      {{ navControls }}
      <div style="display: flex; align-items: center; border: 1px solid rgba(180,150,100,.28); border-radius: 999px; overflow: hidden;">
        <button onClick="{{ decFont }}" aria-label="Smaller text" style="font-family: inherit; font-size: 13px; color: #e4d7ba; background: transparent; border: none; padding: 7px 13px; cursor: pointer;">A−</button>
        <span style="width: 1px; align-self: stretch; background: rgba(180,150,100,.28);"></span>
        <button onClick="{{ incFont }}" aria-label="Larger text" style="font-family: inherit; font-size: 17px; color: #e4d7ba; background: transparent; border: none; padding: 5px 13px; cursor: pointer;">A+</button>
      </div>
    </div>
  </div>
  {{ stage }}<!-- rebuild2 -->
  {{ tooltip }}
  {{ infoPanel }}
  {{ overlays }}
</div>
</x-dc>

  scrubber() {
    const h = React.createElement, n = this.state.spreads.length;
    if (n <= 1) return null;
    const cur = this.state.spreadIndex;
    const previewIdx = this.state.scrub && this.state.scrub.idx != null ? this.state.scrub.idx : cur;
    const frac = n > 1 ? cur / (n - 1) : 0;
    const fromEvt = (e) => {
      const r = this._scrubRef.getBoundingClientRect();
      const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      return { idx: Math.round(f * (n - 1)), x: e.clientX, rect: r };
    };
    const bubble = this.state.scrub ? h('div', { key: 'bub', style: { position: 'absolute', bottom: '18px', left: (this.state.scrub.px != null ? this.state.scrub.px : frac * 100 + '%'), transform: 'translateX(-50%)', pointerEvents: 'none', background: '#211b14', color: '#efe6d2', borderRadius: '7px', padding: '6px 10px', fontFamily: FONT, fontSize: '12.5px', whiteSpace: 'nowrap', boxShadow: '0 8px 22px rgba(0,0,0,.5)' } }, [
      h('span', { key: 1, style: { color: '#e8cf94', letterSpacing: '.12em' } }, 'p. ' + (previewIdx + 1)),
      h('span', { key: 2, style: { fontStyle: 'italic', color: '#c8ba95', marginLeft: '7px' } }, this.chapterOfSpread(previewIdx).frTitle)
    ]) : null;
    return h('div', { key: 'scrub', 'data-scrub': '1',
      onClick: (e) => e.stopPropagation(),
      style: { position: 'absolute', left: '58px', right: '58px', bottom: '8px', height: '22px', zIndex: 8, cursor: 'pointer', touchAction: 'none' } }, [
      bubble,
      h('div', { key: 'track',
        ref: (el) => { this._scrubRef = el; },
        onPointerDown: (e) => { e.stopPropagation(); e.currentTarget.setPointerCapture(e.pointerId); const p = fromEvt(e); this._scrubbing = true; this.setState({ scrub: { idx: p.idx, px: ((e.clientX - p.rect.left) / p.rect.width * 100) + '%' } }); this.jumpTo(p.idx); },
        onPointerMove: (e) => { const p = fromEvt(e); const px = ((e.clientX - p.rect.left) / p.rect.width * 100) + '%'; if (this._scrubbing) { this.setState({ scrub: { idx: p.idx, px } }); this.jumpTo(p.idx); } else this.setState({ scrub: { idx: p.idx, px } }); },
        onPointerUp: (e) => { this._scrubbing = false; this.setState({ scrub: null }); },
        onPointerLeave: () => { if (!this._scrubbing) this.setState({ scrub: null }); },
        style: { position: 'absolute', left: 0, right: 0, top: '9px', height: '4px', borderRadius: '2px', background: 'rgba(90,66,30,.22)' } }, [
        h('div', { key: 'fill', style: { position: 'absolute', left: 0, top: 0, bottom: 0, width: (frac * 100) + '%', background: 'rgba(120,90,45,.55)', borderRadius: '2px' } }),
        h('div', { key: 'knob', style: { position: 'absolute', left: (frac * 100) + '%', top: '50%', width: '9px', height: '9px', marginLeft: '-4.5px', transform: 'translateY(-50%) rotate(45deg)', background: '#9c7a44', boxShadow: '0 1px 2px rgba(0,0,0,.4)' } })
      ])
    ]);
  }

  renderVals() {
    return {
      stage: this.stage(),
      tooltip: this.renderTip(),
      transControl: this.transControl(),
      navControls: this.navControls(),
      overlays: this.overlays(),
      infoPanel: this.infoPanel(),
      blurLabel: this.state.blurEnglish ? 'Show translation' : 'Blur translation',
      toggleBlur: () => this.setState(s => ({ blurEnglish: !s.blurEnglish, activePair: -1 })),
      incFont: this.incFont,
      decFont: this.decFont,
      counter: this.state.ready && this.state.spreads.length ? `${this.state.spreadIndex + 1} / ${this.state.spreads.length}` : ''
    };
  }
}
</script>
