[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biread"
version = "0.1.0"
description = "Build a self-contained bilingual (French/English) HTML reader from a plain-text book."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "requests>=2.31.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Powers --epub and --pdf export and the reader's browser tests; also needs
# `playwright install chromium webkit`. Pillow is here for the few tests that
# read pixels rather than the DOM — a border that is styled correctly and not
# painted is invisible to every other kind of assertion.
browser = ["pytest>=8.0", "playwright>=1.40", "pillow>=10.0"]

[project.scripts]
biread = "biread.cli:main"

[tool.setuptools.packages.find]
include = ["biread*"]

[tool.setuptools.package-data]
biread = ["render/templates/*", "assets/*.png", "assets/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
