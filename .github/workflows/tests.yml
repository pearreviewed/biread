name: tests

# Run the suite on every push to main and on every pull request, so a change —
# yours or a contributor's — is checked before it is merged. The tests need no
# network and no API key, so there are no secrets to configure.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The fast path: the ~200 Python tests, across the oldest and a current Python.
  # The browser tests skip themselves here — Playwright is not installed — so this
  # job stays quick and gives the green check most changes need.
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The slow path: the reader and the builder driven in real headless browsers,
  # plus the PDF export they render. Separate so it never holds up the fast
  # check. Both engines, because Safari carries faults Chromium does not — it
  # broke a shelf card across a column boundary and left it open at the top,
  # there and nowhere else — and the builder's own screens are here for the same
  # reason: that fault was on one of them, and this job used not to open the
  # builder at all.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium webkit
      - run: pytest tests/test_reader_js.py tests/test_builder_js.py tests/test_reader_sync_js.py tests/test_export.py tests/test_cli.py -q

  # The bookmark-sync service, against a real Postgres. Its own job because it is
  # its own program: not installed with the package, not collected by the root
  # suite (testpaths is `tests`), and previously run nowhere but the server — 26
  # tests guarding other people's reading positions, checked by nobody.
  server:
    name: server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biread_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest httpx
      # The merge rule lives in `on conflict … where`, so a fake database would
      # only reimplement it wrongly. This is the one suite that needs a service.
      - run: pytest -q server/tests
        env:
          BIREAD_DATABASE_URL: "host=localhost port=5432 user=postgres password=postgres dbname=biread_test"
